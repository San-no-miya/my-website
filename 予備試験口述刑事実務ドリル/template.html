<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予備口述ドリル 刑事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 法廷の墨と朱印。1画面1枚のカード、親指で押せる下寄せボタン */
:root {
  --bg: #eef0f3; --surface: #ffffff; --ink: #1b2230; --muted: #5d6675; --line: #d5d9e0;
  --accent: #b8322a; --accent-soft: #f6e3e1; --navy: #22324d; --navy-soft: #e3e8f1;
  --ok: #1d7a4c; --ok-soft: #e1f2e8; --ng: #b8322a; --ng-soft: #f8e4e2; --jo-bg: #f7f5ef; --star: #b7791f;
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1b212b; --ink: #e7e9ee; --muted: #9aa3b2; --line: #313a48;
    --accent: #e8665c; --accent-soft: #3a2224; --navy: #9fb6dc; --navy-soft: #232d3d;
    --ok: #5fcf93; --ok-soft: #173326; --ng: #f07b70; --ng-soft: #3d2023; --jo-bg: #20252e; --star: #e3b04b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1b212b; --ink: #e7e9ee; --muted: #9aa3b2; --line: #313a48;
  --accent: #e8665c; --accent-soft: #3a2224; --navy: #9fb6dc; --navy-soft: #232d3d;
  --ok: #5fcf93; --ok-soft: #173326; --ng: #f07b70; --ng-soft: #3d2023; --jo-bg: #20252e; --star: #e3b04b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.7; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible + span { outline: 3px solid var(--navy); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.brand { display: flex; align-items: center; gap: 12px; padding-top: 8px; }
.seal { width: 48px; height: 48px; border: 2.5px solid var(--accent); color: var(--accent); border-radius: 8px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; transform: rotate(-4deg); flex: none; }
.brand h1 { font-size: 23px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px; text-align: center; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; font-family: var(--display); }
.stat span { font-size: 12px; color: var(--muted); }
.course { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.course .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; background: var(--navy-soft); color: var(--navy); }
.course.red .ic { background: var(--accent-soft); color: var(--accent); }
.course.star .ic { color: var(--star); }
.course b { display: block; font-size: 16px; }
.course .d { font-size: 13px; color: var(--muted); line-height: 1.5; }
.course .n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.years { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.years button { padding: 10px 4px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 700; font-size: 15px; line-height: 1.3; }
.years button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.years button[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--surface); }
.years button[aria-pressed="true"] small { color: inherit; opacity: .8; }
.years .all { grid-column: 1 / -1; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 700; }
.seg button[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--surface); }
.primary { width: 100%; padding: 16px; border: none; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; font-size: 17px; }
.primary:disabled { opacity: .45; cursor: default; }
.ghost { width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 700; }
.back { background: none; border: none; color: var(--muted); padding: 4px 0; font-size: 14px; align-self: flex-start; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.navy { background: var(--navy-soft); color: var(--navy); }
.bar { display: flex; align-items: center; gap: 10px; }
.bar .quit { background: none; border: none; color: var(--muted); padding: 4px; font-size: 14px; white-space: nowrap; }
.track { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; background: var(--navy); width: 0; transition: width .3s; }
.count { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); min-width: 4.5em; text-align: right; }
.combo { font-weight: 700; color: var(--accent); font-size: 14px; min-height: 1.4em; text-align: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qtext { font-size: 17px; font-weight: 500; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ox button { aspect-ratio: 1.5; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); font-family: var(--display); font-size: 54px; font-weight: 800; line-height: 1; }
.ox button[data-v="true"] { color: var(--ok); }
.ox button[data-v="false"] { color: var(--ng); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choices button { text-align: left; padding: 13px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; gap: 10px; align-items: flex-start; line-height: 1.55; font-size: 15px; }
.choices .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.is-right { border-color: var(--ok) !important; background: var(--ok-soft) !important; }
.is-wrong { border-color: var(--ng) !important; background: var(--ng-soft) !important; }
.answered button { cursor: default; }
.verdict { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.ng { background: var(--ng-soft); color: var(--ng); }
.verdict .mark { font-family: var(--display); font-size: 34px; line-height: 1; }
.exp { font-size: 15px; }
details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
summary { padding: 11px 14px; font-weight: 700; font-size: 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "＋"; color: var(--muted); }
details[open] > summary::after { content: "－"; }
.dbody { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.case { background: var(--bg); border-color: transparent; }
.case .dbody { color: var(--muted); }
.jo { background: var(--jo-bg); border-radius: 8px; padding: 12px; font-family: var(--display); font-size: 15px; line-height: 1.85; }
.jo .h { font-weight: 800; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.jo .h a { font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--navy); }
.jo .cap { color: var(--muted); font-weight: 500; }
.jo p { margin: 4px 0 0; }
.jo mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: inherit; padding: 0 1px; }
.oral { display: grid; gap: 10px; }
.oral .pair { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.oral .pair:last-child { border-bottom: none; padding-bottom: 0; }
.oral b { color: var(--muted); font-size: 12px; }
.check { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check span.box { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 14px; color: transparent; background: var(--surface); }
.check input:checked + span.box { border-color: var(--star); background: var(--star); color: #fff; }
.check input:checked ~ span.lbl { color: var(--star); font-weight: 700; }
.next { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
.next .row { max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.next .row.one { grid-template-columns: 1fr; }
.next .ghost, .next .primary { padding: 15px; }
/* フラッシュカード */
.flash { min-height: 46vh; cursor: pointer; }
.flash .side { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.flash .ans { font-size: 16px; border-top: 2px solid var(--accent); padding-top: 12px; }
.flash .ans .lab { font-family: var(--display); color: var(--accent); font-weight: 800; font-size: 15px; display: block; margin-bottom: 4px; }
.hint { text-align: center; font-size: 13px; color: var(--muted); }
.result { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 18px 16px; }
.big { font-family: var(--display); font-size: 54px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stamp { border: 3px solid var(--accent); color: var(--accent); font-family: var(--display); font-weight: 800; font-size: 22px; padding: 4px 16px; border-radius: 8px; transform: rotate(-6deg); margin: 6px 0; }
.misslist { display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; }
.misslist div { font-size: 14px; border-left: 3px solid var(--ng); padding: 4px 10px; background: var(--bg); border-radius: 0 8px 8px 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; }
.branch { display: grid; gap: 10px; }
@keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.01); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes flip { from { transform: rotateX(70deg); opacity: .3; } to { transform: none; opacity: 1; } }
.pop { animation: pop .25s ease-out; }
.shake { animation: shake .25s ease-in-out; }
.flipin { animation: flip .22s ease-out; }
@media (prefers-reduced-motion: reduce) { .pop, .shake, .flipin { animation: none; } .fill { transition: none; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
/*__DATA__*/
const YEARS = Object.keys(DATA.years);
const CARD = Object.fromEntries(DATA.cards.map(c => [c.id, c]));
const ITEM = Object.fromEntries(DATA.items.map(i => [i.id, i]));

const store = {
  get(k, d) { try { const v = localStorage.getItem("kj2-" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kj2-" + k, JSON.stringify(v)); } catch {} }
};
const getSet = k => new Set(store.get(k, []));
const putSet = (k, s) => store.set(k, [...s]);
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
const yl = y => DATA.years[y];
const sceneLabel = c => c.sc.replace("場面設定", "場面");

let pref = { years: store.get("years", ["all"]), order: store.get("order", "順番") };
let run = null;
let keyHandler = null;
document.addEventListener("keydown", e => keyHandler && keyHandler(e));

function inYears(y) { return pref.years.includes("all") || pref.years.includes(y); }
function artsHTML(keys) {
  return keys.map(k => {
    const a = DATA.arts[k];
    const link = a.url ? `<a href="${a.url}" target="_blank" rel="noopener">e-Govで${a.no.match(/^\d+条(?:の\d+)?/)[0]}を開く</a>` : "";
    return `<div class="jo"><div class="h"><span>${a.law} ${a.no}${a.cap ? ` <span class="cap">（${a.cap}）</span>` : ""}</span>${link}</div><p>${a.text}</p></div>`;
  }).join("");
}
function checkBox(kind, id) {
  const on = getSet(kind === "item" ? "chkI" : "chkC").has(id);
  return `<label class="check"><input type="checkbox" id="chk" data-kind="${kind}" data-id="${id}" ${on ? "checked" : ""}><span class="box">✓</span><span class="lbl">要確認リストに入れる</span></label>`;
}
function bindCheck() {
  const el = app.querySelector("#chk");
  if (!el) return;
  el.onchange = () => {
    const k = el.dataset.kind === "item" ? "chkI" : "chkC";
    const s = getSet(k);
    el.checked ? s.add(el.dataset.id) : s.delete(el.dataset.id);
    putSet(k, s);
  };
}
function caseBlock(c) {
  if (c.first === c.id) return "";
  return `<details class="case"><summary>前提の事例</summary><div class="dbody">${CARD[c.first].q}</div></details>`;
}

// ───────── ホーム
function home() {
  keyHandler = null;
  const chkI = getSet("chkI"), chkC = getSet("chkC"), miss = getSet("miss");
  const seenI = getSet("seenI"), seenC = getSet("seenC");
  app.innerHTML = `
    <div class="brand"><div class="seal">口述</div><div><h1>予備口述ドリル 刑事</h1><div class="muted small">平成23年〜令和3年・予備試験口述式試験（刑事）</div></div></div>
    <section class="panel">
      <div class="stats">
        <div class="stat"><b>${seenI.size}/${DATA.items.length}</b><span>ゲームで解いた</span></div>
        <div class="stat"><b>${seenC.size}/${DATA.cards.length}</b><span>カードで見た</span></div>
        <div class="stat"><b>${chkI.size + chkC.size}</b><span>要確認</span></div>
      </div>
    </section>
    <button class="course red" data-go="game"><span class="ic">○×</span><span><b>一問一答ゲーム</b><span class="d">○×と4択で決着をつける。年度を選んで挑戦</span></span><span class="n">${DATA.items.length}問</span></button>
    <button class="course" data-go="flash"><span class="ic">札</span><span><b>フラッシュカード</b><span class="d">本番の問答を表→裏でテンポよく見る</span></span><span class="n">${DATA.cards.length}枚</span></button>
    <button class="course star" data-go="check"><span class="ic">★</span><span><b>要確認リスト</b><span class="d">自分でチェックした問題だけを演習</span></span><span class="n">${chkI.size + chkC.size}件</span></button>
    <button class="course" data-go="miss"><span class="ic">×</span><span><b>間違えた問題の復習</b><span class="d">ゲームで間違えた問題だけ。正解すると外れる</span></span><span class="n">${miss.size}問</span></button>
    <p class="note">条文は令和8年時点の現行法（刑法は拘禁刑施行後）として掲載しています。長い条文は抄録です。正確な文言はe-Gov法令検索で確認してください。学習記録とチェックはこの端末のブラウザにだけ保存されます。</p>
    <button class="ghost" id="reset">学習記録とチェックを消す</button>`;
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => setup(b.dataset.go));
  const rs = app.querySelector("#reset");
  rs.onclick = () => {
    if (rs.dataset.armed) { ["chkI","chkC","miss","seenI","seenC"].forEach(k => store.set(k, [])); home(); }
    else { rs.dataset.armed = "1"; rs.textContent = "もう一度押すと消去します"; }
  };
  scrollTo(0, 0);
}

// ───────── 年度選択などの設定画面
const COURSE = {
  game: { title: "一問一答ゲーム", pool: () => DATA.items, unit: "問" },
  flash: { title: "フラッシュカード", pool: () => DATA.cards, unit: "枚" },
  check: { title: "要確認リスト", pool: null, unit: "件" },
  miss: { title: "間違えた問題の復習", pool: () => { const m = getSet("miss"); return DATA.items.filter(i => m.has(i.id)); }, unit: "問" }
};
function setup(course) {
  keyHandler = null;
  const C = COURSE[course];
  const chkI = getSet("chkI"), chkC = getSet("chkC");
  const all = course === "check" ? [...DATA.items.filter(i => chkI.has(i.id)), ...DATA.cards.filter(c => chkC.has(c.id))] : C.pool();
  const cnt = y => all.filter(x => y === "all" || x.y === y).length;
  const yb = y => `<button type="button" data-y="${y}" class="${y === "all" ? "all" : ""}" aria-pressed="${pref.years.includes(y)}">${y === "all" ? "全年度" : yl(y)}<small>${cnt(y)}${C.unit}</small></button>`;
  const fI = DATA.items.filter(i => chkI.has(i.id) && inYears(i.y)).length;
  const fC = DATA.cards.filter(c => chkC.has(c.id) && inYears(c.y)).length;
  const n = course === "check" ? fI + fC : all.filter(x => inYears(x.y)).length;
  app.innerHTML = `
    <button class="back" id="bk">← ホーム</button>
    <h1 style="font-size:22px">${C.title}</h1>
    <section class="panel">
      <h2>年度</h2>
      <div class="years">${["all", ...YEARS].map(yb).join("")}</div>
      <div class="muted small">複数の年度を選べます。</div>
      <h2>出題順</h2>
      <div class="seg">${["順番","シャッフル"].map(v => `<button type="button" data-o="${v}" aria-pressed="${pref.order === v}">${v}</button>`).join("")}</div>
      <div class="muted small">${pref.order === "順番" ? "本番の問答の流れどおりに出します。" : "ランダムに出します。"}</div>
    </section>
    ${course === "check" ? `
      <section class="panel branch">
        <h2>演習のしかた</h2>
        <button class="primary" id="goF" ${fC ? "" : "disabled"}>フラッシュカードで見る（${fC}枚）</button>
        <button class="primary" id="goG" style="background:var(--navy)" ${fI ? "" : "disabled"}>ゲームで解く（${fI}問）</button>
        <div class="muted small">フラッシュカードでチェックした問答はフラッシュカードに、ゲームでチェックした問題はゲームに入ります。</div>
      </section>`
    : `<button class="primary" id="go" ${n ? "" : "disabled"}>${n ? `${n}${C.unit}をはじめる` : (course === "miss" ? "間違えた問題はありません" : "対象がありません")}</button>`}`;
  app.querySelector("#bk").onclick = home;
  app.querySelectorAll("[data-y]").forEach(b => b.onclick = () => {
    const y = b.dataset.y;
    if (y === "all") pref.years = ["all"];
    else {
      let s = pref.years.filter(v => v !== "all");
      s = s.includes(y) ? s.filter(v => v !== y) : [...s, y];
      pref.years = s.length ? s : ["all"];
    }
    store.set("years", pref.years); setup(course);
  });
  app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { pref.order = b.dataset.o; store.set("order", pref.order); setup(course); });
  const order = l => pref.order === "シャッフル" ? shuffle(l) : l;
  if (course === "check") {
    const f = app.querySelector("#goF"), g = app.querySelector("#goG");
    f.onclick = () => startFlash(order(DATA.cards.filter(c => chkC.has(c.id) && inYears(c.y))), "check");
    g.onclick = () => startGame(order(DATA.items.filter(i => chkI.has(i.id) && inYears(i.y))), "check");
  } else {
    const list = () => order(all.filter(x => inYears(x.y)));
    app.querySelector("#go").onclick = () => course === "flash" ? startFlash(list(), course) : startGame(list(), course);
  }
  scrollTo(0, 0);
}

// ───────── ゲーム
function startGame(list, mode) { run = { kind: "game", mode, list, i: 0, score: 0, combo: 0, maxCombo: 0, wrong: [] }; ask(); }
function ask() {
  const q = run.list[run.i], total = run.list.length;
  run.opts = q.t === "mc" ? shuffle(q.c.map((text, idx) => ({ text, idx }))) : null;
  const c0 = CARD[q.src[0]];
  app.innerHTML = `
    <div class="bar"><button class="quit" id="quit">✕ やめる</button><div class="track"><div class="fill" style="width:${run.i / total * 100}%"></div></div><div class="count">${run.i + 1} / ${total}</div></div>
    <div class="combo">${run.combo >= 2 ? `${run.combo} コンボ` : ""}</div>
    <article class="card" id="card">
      <div class="meta"><span class="tag">${yl(q.y)}</span><span class="tag navy">${sceneLabel(c0)}</span><span class="tag navy">${q.t === "ox" ? "○×" : "4択"}</span></div>
      <div class="qtext">${esc(q.q)}</div>
    </article>
    ${q.t === "ox"
      ? `<div class="ox" id="ans"><button data-v="true" aria-label="正しい">○</button><button data-v="false" aria-label="誤り">×</button></div>`
      : `<div class="choices" id="ans">${run.opts.map((o, k) => `<button data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o.text)}</span></button>`).join("")}</div>`}
    <div id="after"></div>`;
  app.querySelector("#quit").onclick = () => run.i ? gameResult() : home();
  app.querySelectorAll("#ans button").forEach(b => b.onclick = () => judge(b));
  keyHandler = e => {
    if (app.querySelector("#ans.answered")) { if (e.key === "Enter" || e.key === "ArrowRight") app.querySelector("#nx")?.click(); return; }
    if (q.t === "ox" && (e.key === "o" || e.key === "1")) app.querySelector('[data-v="true"]').click();
    if (q.t === "ox" && (e.key === "x" || e.key === "2")) app.querySelector('[data-v="false"]').click();
    if (q.t === "mc" && "1234abcd".includes(e.key.toLowerCase())) { const k = "1234".includes(e.key) ? +e.key - 1 : "abcd".indexOf(e.key.toLowerCase()); app.querySelector(`[data-k="${k}"]`)?.click(); }
  };
  scrollTo(0, 0);
}
function judge(btn) {
  const box = app.querySelector("#ans");
  if (box.classList.contains("answered")) return;
  box.classList.add("answered");
  const q = run.list[run.i];
  let ok, rightBtn;
  if (q.t === "ox") { ok = (btn.dataset.v === "true") === q.a; rightBtn = box.querySelector(`[data-v="${q.a}"]`); }
  else { ok = run.opts[+btn.dataset.k].idx === 0; rightBtn = box.querySelector(`[data-k="${run.opts.findIndex(o => o.idx === 0)}"]`); }
  rightBtn.classList.add("is-right");
  if (!ok) btn.classList.add("is-wrong");
  const miss = getSet("miss"), seen = getSet("seenI");
  seen.add(q.id);
  if (ok) { run.score++; run.combo++; miss.delete(q.id); buzz(15); }
  else { run.combo = 0; run.wrong.push(q); miss.add(q.id); buzz([30, 40, 30]); }
  run.maxCombo = Math.max(run.maxCombo, run.combo);
  putSet("miss", miss); putSet("seenI", seen);
  app.querySelector(".combo").textContent = run.combo >= 2 ? `${run.combo} コンボ` : "";
  app.querySelector("#card").classList.add(ok ? "pop" : "shake");
  const correct = q.t === "ox" ? (q.a ? "○" : "×") : q.c[0];
  const oral = q.src.map(id => { const c = CARD[id]; return `<div class="pair"><b>主査</b><div>${c.q}</div><b>受験者</b><div>${c.a}</div></div>`; }).join("");
  app.querySelector("#after").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="verdict ${ok ? "ok" : "ng"}"><span class="mark">${ok ? "○" : "×"}</span><span>${ok ? "正解" : "不正解　正解は「" + esc(correct) + "」"}</span></div>
      ${q.e ? `<div class="exp">${esc(q.e)}</div>` : ""}
      ${checkBox("item", q.id)}
      ${q.arts.length ? `<details open><summary>条文（${q.arts.length}）</summary><div class="dbody">${artsHTML(q.arts)}</div></details>` : ""}
      <details><summary>本番の口述問答（${q.src.length}）</summary><div class="dbody oral">${oral}</div></details>
    </div>
    <div class="next"><div class="row one"><button class="primary" id="nx">${run.i + 1 < run.list.length ? "次の問題へ" : "結果を見る"}</button></div></div>`;
  bindCheck();
  app.querySelector("#nx").onclick = () => { run.i++; run.i < run.list.length ? ask() : gameResult(); };
}
function gameResult() {
  keyHandler = null;
  const n = run.i + (app.querySelector("#ans.answered") ? 1 : 0) || run.list.length;
  const done = Math.min(n, run.list.length), r = done ? run.score / done : 0;
  const rank = r === 1 ? "満点" : r >= .8 ? "合格圏" : r >= .6 ? "あと一歩" : "要復習";
  const chk = getSet("chkI"), marked = run.list.slice(0, done).filter(q => chk.has(q.id)).length;
  app.innerHTML = `
    <section class="panel result">
      <div class="muted">${COURSE[run.mode].title}</div>
      <div class="big">${run.score}<span style="font-size:24px"> / ${done}</span></div>
      <div class="stamp">${rank}</div>
      <div class="muted small">最大 ${run.maxCombo} コンボ ・ 要確認に入っている問題 ${marked}問</div>
    </section>
    ${run.wrong.length ? `<section class="panel"><h2>間違えた問題</h2><div class="misslist">${run.wrong.map(q => `<div>${esc(q.q)}</div>`).join("")}</div></section>
    <button class="primary" id="again">間違えた${run.wrong.length}問をもう一度</button>` : ""}
    <button class="ghost" id="home">ホームに戻る</button>`;
  const ag = app.querySelector("#again");
  if (ag) ag.onclick = () => startGame(shuffle(run.wrong), run.mode);
  app.querySelector("#home").onclick = home;
  scrollTo(0, 0);
}

// ───────── フラッシュカード
function startFlash(list, mode) { run = { kind: "flash", mode, list, i: 0, flipped: false }; card(); }
function card() {
  const c = run.list[run.i], total = run.list.length;
  const seen = getSet("seenC"); seen.add(c.id); putSet("seenC", seen);
  app.innerHTML = `
    <div class="bar"><button class="quit" id="quit">✕ やめる</button><div class="track"><div class="fill" style="width:${(run.i + 1) / total * 100}%"></div></div><div class="count">${run.i + 1} / ${total}</div></div>
    <article class="card flash" id="fc">
      <div class="meta"><span class="tag">${yl(c.y)}</span><span class="tag navy">${sceneLabel(c)}</span></div>
      ${caseBlock(c)}
      <div class="side">問</div>
      <div class="qtext">${c.q}</div>
      <div id="back"></div>
    </article>
    <div id="extra"></div>
    <div class="next"><div class="row"><button class="ghost" id="pv" ${run.i ? "" : "disabled"}>前へ</button><button class="primary" id="fl">裏をめくる</button></div></div>`;
  app.querySelector("#quit").onclick = flashEnd;
  app.querySelector("#pv").onclick = () => { if (run.i) { run.i--; card(); } };
  const flip = () => {
    if (app.querySelector("#back").innerHTML) return;
    app.querySelector("#back").innerHTML = `<div class="ans flipin"><span class="lab">答</span>${c.a}</div>`;
    app.querySelector("#extra").innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${checkBox("card", c.id)}${c.arts.length ? `<details><summary>関連条文（${c.arts.length}）</summary><div class="dbody">${artsHTML(c.arts)}</div></details>` : ""}</div>`;
    bindCheck();
    const fl = app.querySelector("#fl");
    fl.textContent = run.i + 1 < total ? "次のカードへ" : "おわる";
    fl.onclick = next;
  };
  const next = () => { if (run.i + 1 < total) { run.i++; card(); } else flashEnd(); };
  app.querySelector("#fl").onclick = flip;
  app.querySelector("#fc").addEventListener("click", e => { if (!e.target.closest("details, a")) flip(); });
  keyHandler = e => {
    if (e.target.closest && e.target.closest("input")) return;
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); app.querySelector("#back").innerHTML ? next() : flip(); }
    if (e.key === "ArrowLeft" && run.i) { run.i--; card(); }
  };
  scrollTo(0, 0);
}
function flashEnd() {
  keyHandler = null;
  const chk = getSet("chkC"), seenN = run.i + 1;
  const marked = run.list.slice(0, seenN).filter(c => chk.has(c.id)).length;
  app.innerHTML = `
    <section class="panel result">
      <div class="muted">${COURSE[run.mode].title === "要確認リスト" ? "要確認リスト（フラッシュカード）" : "フラッシュカード"}</div>
      <div class="big">${seenN}<span style="font-size:24px"> 枚</span></div>
      <div class="muted small">見たカードのうち要確認に入っているもの ${marked}枚</div>
    </section>
    <button class="primary" id="again">もう一周する</button>
    <button class="ghost" id="home">ホームに戻る</button>`;
  app.querySelector("#again").onclick = () => startFlash(pref.order === "シャッフル" ? shuffle(run.list) : run.list, run.mode);
  app.querySelector("#home").onclick = home;
  scrollTo(0, 0);
}

home();
</script>
</body>
</html>
