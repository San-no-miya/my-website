<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予備口述ドリル 刑事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 法廷の墨と朱印。1画面1枚のカード、親指で押せる下寄せボタン */
:root {
  --bg: #eef0f3; --surface: #ffffff; --ink: #1b2230; --muted: #5d6675; --line: #d5d9e0;
  --accent: #b8322a; --accent-soft: #f6e3e1; --navy: #22324d; --navy-soft: #e3e8f1;
  --ok: #1d7a4c; --ok-soft: #e1f2e8; --ng: #b8322a; --ng-soft: #f8e4e2; --jo-bg: #f7f5ef; --star: #b7791f;
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1b212b; --ink: #e7e9ee; --muted: #9aa3b2; --line: #313a48;
    --accent: #e8665c; --accent-soft: #3a2224; --navy: #9fb6dc; --navy-soft: #232d3d;
    --ok: #5fcf93; --ok-soft: #173326; --ng: #f07b70; --ng-soft: #3d2023; --jo-bg: #20252e; --star: #e3b04b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1b212b; --ink: #e7e9ee; --muted: #9aa3b2; --line: #313a48;
  --accent: #e8665c; --accent-soft: #3a2224; --navy: #9fb6dc; --navy-soft: #232d3d;
  --ok: #5fcf93; --ok-soft: #173326; --ng: #f07b70; --ng-soft: #3d2023; --jo-bg: #20252e; --star: #e3b04b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.7; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible + span { outline: 3px solid var(--navy); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.brand { display: flex; align-items: center; gap: 12px; padding-top: 8px; }
.seal { width: 48px; height: 48px; border: 2.5px solid var(--accent); color: var(--accent); border-radius: 8px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; transform: rotate(-4deg); flex: none; }
.brand h1 { font-size: 23px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--bg); border-radius: 10px; padding: 8px; text-align: center; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; font-family: var(--display); }
.stat span { font-size: 12px; color: var(--muted); }
.course { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.course .ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; background: var(--navy-soft); color: var(--navy); }
.course.red .ic { background: var(--accent-soft); color: var(--accent); }
.course.star .ic { color: var(--star); }
.course b { display: block; font-size: 16px; }
.course .d { font-size: 13px; color: var(--muted); line-height: 1.5; }
.course .n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.years { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.years button { padding: 10px 4px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 700; font-size: 15px; line-height: 1.3; }
.years button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.years button[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--surface); }
.years button[aria-pressed="true"] small { color: inherit; opacity: .8; }
.years .all { grid-column: 1 / -1; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 700; }
.seg button[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--surface); }
.primary { width: 100%; padding: 16px; border: none; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; font-size: 17px; }
.primary:disabled { opacity: .45; cursor: default; }
.ghost { width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 700; }
.back { background: none; border: none; color: var(--muted); padding: 4px 0; font-size: 14px; align-self: flex-start; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.navy { background: var(--navy-soft); color: var(--navy); }
.bar { display: flex; align-items: center; gap: 10px; }
.bar .quit { background: none; border: none; color: var(--muted); padding: 4px; font-size: 14px; white-space: nowrap; }
.track { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; background: var(--navy); width: 0; transition: width .3s; }
.count { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); min-width: 4.5em; text-align: right; }
.combo { font-weight: 700; color: var(--accent); font-size: 14px; min-height: 1.4em; text-align: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qtext { font-size: 17px; font-weight: 500; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ox button { aspect-ratio: 1.5; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); font-family: var(--display); font-size: 54px; font-weight: 800; line-height: 1; }
.ox button[data-v="true"] { color: var(--ok); }
.ox button[data-v="false"] { color: var(--ng); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choices button { text-align: left; padding: 13px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; gap: 10px; align-items: flex-start; line-height: 1.55; font-size: 15px; }
.choices .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.is-right { border-color: var(--ok) !important; background: var(--ok-soft) !important; }
.is-wrong { border-color: var(--ng) !important; background: var(--ng-soft) !important; }
.answered button { cursor: default; }
.verdict { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.ng { background: var(--ng-soft); color: var(--ng); }
.verdict .mark { font-family: var(--display); font-size: 34px; line-height: 1; }
.exp { font-size: 15px; }
details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
summary { padding: 11px 14px; font-weight: 700; font-size: 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "＋"; color: var(--muted); }
details[open] > summary::after { content: "－"; }
.dbody { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.case { background: var(--bg); border-color: transparent; }
.case .dbody { color: var(--muted); }
.jo { background: var(--jo-bg); border-radius: 8px; padding: 12px; font-family: var(--display); font-size: 15px; line-height: 1.85; }
.jo .h { font-weight: 800; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.jo .h a { font-family: var(--body); font-size: 12px; font-weight: 500; color: var(--navy); }
.jo .cap { color: var(--muted); font-weight: 500; }
.jo p { margin: 4px 0 0; }
.jo mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: inherit; padding: 0 1px; }
.oral { display: grid; gap: 10px; }
.oral .pair { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.oral .pair:last-child { border-bottom: none; padding-bottom: 0; }
.oral b { color: var(--muted); font-size: 12px; }
.check { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check span.box { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 14px; color: transparent; background: var(--surface); }
.check input:checked + span.box { border-color: var(--star); background: var(--star); color: #fff; }
.check input:checked ~ span.lbl { color: var(--star); font-weight: 700; }
.next { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
.next .row { max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.next .row.one { grid-template-columns: 1fr; }
.next .ghost, .next .primary { padding: 15px; }
/* フラッシュカード */
.flash { min-height: 46vh; cursor: pointer; }
.flash .side { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.flash .ans { font-size: 16px; border-top: 2px solid var(--accent); padding-top: 12px; }
.flash .ans .lab { font-family: var(--display); color: var(--accent); font-weight: 800; font-size: 15px; display: block; margin-bottom: 4px; }
.hint { text-align: center; font-size: 13px; color: var(--muted); }
.result { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 18px 16px; }
.big { font-family: var(--display); font-size: 54px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stamp { border: 3px solid var(--accent); color: var(--accent); font-family: var(--display); font-weight: 800; font-size: 22px; padding: 4px 16px; border-radius: 8px; transform: rotate(-6deg); margin: 6px 0; }
.misslist { display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; }
.misslist div { font-size: 14px; border-left: 3px solid var(--ng); padding: 4px 10px; background: var(--bg); border-radius: 0 8px 8px 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; }
.branch { display: grid; gap: 10px; }
@keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.01); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes flip { from { transform: rotateX(70deg); opacity: .3; } to { transform: none; opacity: 1; } }
.pop { animation: pop .25s ease-out; }
.shake { animation: shake .25s ease-in-out; }
.flipin { animation: flip .22s ease-out; }
@media (prefers-reduced-motion: reduce) { .pop, .shake, .flipin { animation: none; } .fill { transition: none; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const DATA = {"years": {"H23": "平成23年", "H24": "平成24年", "H25": "平成25年", "H26": "平成26年", "H27": "平成27年", "H28": "平成28年", "H29": "平成29年", "H30": "平成30年", "R1": "令和元年", "R2": "令和2年", "R3": "令和3年"}, "cards": [{"id": "H23-01", "y": "H23", "sn": 1, "sc": "場面設定1", "q": "甲と乙は、共謀の上、Pに対し、加療3か月の傷害を加え、両名は逮捕、勾留されることとなった。甲乙の知人であるQは、弁護士Aに両名の弁護を依頼した。依頼を受けたAは接見を申入れ、両名と接見したところ、両名とも「自分たちがしたことは間違いない。早く釈放されたい」と述べた。この場合に、Aとして甲乙の釈放のために、いかなる不服申し立て措置をとることができるか。", "a": "身柄を解放するため、準抗告（刑訴法429第1項2号）が考えられる。準抗告は要件自体の不充足を主張し認められれば、身柄解放できる。勾留要件のうち、勾留の必要性がない。（逃亡のおそれ（刑訴法60条１項２号）、罪証隠滅のおそれ（同３号）がない）", "arts": ["訴429", "訴60"], "first": "H23-01"}, {"id": "H23-02", "y": "H23", "sn": 1, "sc": "場面設定1", "q": "甲について裁判所が接見禁止決定を行ったところ、弁護人として甲と連絡を取る必要が生じた。この場合の弁護人はどのような手段をとるべきか。", "a": "弁護人には接見禁止制限が及ばないため（法81条）、接見が可能。（法39条1項）", "arts": ["訴81", "訴39"], "first": "H23-01"}, {"id": "H23-03", "y": "H23", "sn": 1, "sc": "場面設定1", "q": "甲の母親が甲と緊急に連絡を取りたいと言っている。この場合、弁護人はどのような手段ををとるべきか。", "a": "裁判所の接見禁止決定に対する抗告（419条）または、接見禁止決定の一部解除申立てが可能である。", "arts": ["訴81"], "first": "H23-01"}, {"id": "H23-04", "y": "H23", "sn": 1, "sc": "場面設定1", "q": "甲乙が傷害の共同正犯として公訴提起された場合、弁護人としてはいかなる態度決定をすべきか。", "a": "事後的に利益相反状態になる可能性があるため、両方の弁護人を辞任するべきである。（弁護士職務基本規程28条3項本文）ただし、甲乙の双方が同意した場合は認めてもよい（28条3項但し書き）※刑事弁護なので42の利益相反Q題、プラス46最善弁護ができなくなる", "arts": ["職28", "職42", "職46"], "first": "H23-01"}, {"id": "H24-01", "y": "H24", "sn": 1, "sc": "場面設定1", "q": "Aが火災保険をだまし取る目的で自分の家に放火したという容疑で逮捕されました。放火の点につき、何罪が成立しますか。（Aのみが居住しているという前提で）", "a": "他人所有非現住建造物等放火罪（刑法109条1項）が成立する。理由：保険に付したものであるため、刑法115条の適用により、自己所有の物であっても他人所有とみなされるため。詐欺罪は実行の着手（欺罔行為すらない）がないので、成立しない。", "arts": ["刑109", "刑115"], "first": "H24-01"}, {"id": "H24-02", "y": "H24", "sn": 1, "sc": "場面設定1", "q": "では、現住建造物等放火罪ではない理由は何故か。", "a": "108条の「人」には、犯人は含まないと解するため。理由：現住建造物等放火罪の保護法益は、人の生命身体財産である。犯人が自己加害をしても保護範囲に含まれないため。", "arts": ["刑108"], "first": "H24-01"}, {"id": "H24-03", "y": "H24", "sn": 1, "sc": "場面設定1", "q": "事例において、Aが自宅で家族と共に一緒に住んでいる場合で、家族が一時外出中であった場合はどうか。", "a": "現住建造物等放火罪（刑法108条）が成立する。理由：現住建造物は、人の起臥寝食に用いられる建物であり、一時的な外出に留まり現住建造物としての性質に変更がない場合、現住性が失われたとはいえない（判例有）", "arts": ["刑108"], "first": "H24-03"}, {"id": "H24-04", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "Aは起訴され、検察官はBさんという人に火災原因報告書の作成を依頼しました。 Bさんは消防士として15年間の勤務経験もあり、約20年にわたって火災原因の調査に携わってきた人物です。そして、検察官は、その火災原因報告書の証拠調べ請求しましたが、弁護人は伝聞証拠（刑訴法320条1項）にあたるとして不同意意見を述べました。この場合、検察官はどうしますか。", "a": "伝聞例外（刑訴法321条4項）を主張します。理由：刑訴法321条4項は、特別の学識経験を有する者の作成した文書の場合、客観的な事実を記載し正確性·信用性が高く、文書の方が報告しやすいという点もあるため伝聞例外として認められる。本件Bは20年も火災原因調査をしており、火災原因調査に関する特別の学識経験を有しており、これに基づいて報告書を作成しているため認められる。科搜研等が鑑定した場合は、321条4項準用。", "arts": ["訴321-4"], "first": "H24-04"}, {"id": "H24-05", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "321条3項ではない理由は？", "a": "321条3項は、作成主体を「検察官、司法警察職員、検察事務官」と定め、作成主体を限定しているため。", "arts": ["訴321-3"], "first": "H24-04"}, {"id": "H24-06", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "では、弁護人が現場に行って図面などを書いて証拠として出した場合は何条になるか。", "a": "321条1項3号。理由：弁護人は、特別の学識経験に基づいて図面等を作成したわけではないため。", "arts": ["訴321-1"], "first": "H24-04"}, {"id": "H24-07", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "321条4項で伝聞例外が認められる要件は何か。", "a": "作成者が証人尋問を受け、作成の真正と、内容の真正について証言した場合認められる。", "arts": ["訴321-4", "訴321-3"], "first": "H24-04"}, {"id": "H24-08", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "作成の真正とは何か。また、内容の真正とは何か。", "a": "作成の真正とは、B自身が作成したという意味。内容の真正とは、Bの記憶に基づいて内容に偽りなく正確に記載したという意味。なお、実験実施過程の適正も含む。", "arts": ["訴321-4", "訴321-3"], "first": "H24-04"}, {"id": "H24-09", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "Bをどのように呼ぶのか。", "a": "証人として呼ぶ。（刑訴法1·43条以下）", "arts": [], "first": "H24-04"}, {"id": "H24-10", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "裁判所が、この火災原因報告書の証拠請求をする旨の決定をしたとします。証拠調べはどのような方法によってするのか。", "a": "証拠書類の朗読（刑訴法305条）または証拠の要旨告知（規則203の2）。", "arts": ["訴305"], "first": "H24-04"}, {"id": "H24-11", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "報告書に図や写真がついている場合の証拠調べの方法は他にあるか。", "a": "証拠物の展示（刑訴法306条）具体的には、訴訟関係人に見せる。", "arts": [], "first": "H24-04"}, {"id": "H24-12", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "裁判所の証拠決定に不服がある場合に、弁護人が不服申し立てする方法はあるか。", "a": "刑訴法309条1項、規則205条1項により、異議申立てする。", "arts": ["訴309", "規205"], "first": "H24-04"}, {"id": "H24-13", "y": "H24", "sn": 2, "sc": "場面設定2", "q": "本件ではできるか。また、証拠能力がないのに採用した場合はどうか。", "a": "本件はできない。伝聞証拠などに該当し、伝開例外にも当たらず証拠能力がないのに採用した場合は、法令違反（規則205条1項）として主張できる。なお、証拠決定の不服（規則190-2参照）なので、相当でないことを理由に異議申し立てはできない。（規則205-1）", "arts": ["規205"], "first": "H24-04"}, {"id": "H24-14", "y": "H24", "sn": 3, "sc": "場面設定3", "q": "事件が公判前整理手続きに付されたとして、検察官が火災原因報告書を、要旨をまとめた捜査報告書にして、これを証拠調べ請求した。弁護人は、火災原因報告書を見たいと考えたが、どのような手段があるか。", "a": "類型証拠開示請求（刑訴法316条の15第1項4号）による。", "arts": ["訴316-15"], "first": "H24-14"}, {"id": "H24-15", "y": "H24", "sn": 3, "sc": "場面設定3", "q": "類型証拠開示請求の要件は何か。", "a": "①第一項各号に掲げる証拠の類型　４号<br>②開示の請求に係る証拠を識別するに足りる事項　火災原因報告書<br>③当該開示の請求に係る証拠が当該検察官請求証拠の証明力を判断するために重要であること　内容過誤や本来記載されるべき事項の脱落の有無を確かめることは証明力判断のために重要である<br>④被告人の防御の準備のために当該開示が必要である理由本当に犯罪実行可能という結果が記載されているのか確かめるため（不可能なら不可罰だから。）", "arts": ["訴316-15"], "first": "H24-14"}, {"id": "H24-16", "y": "H24", "sn": 3, "sc": "場面設定3", "q": "本件は、これにあたるのか。なにが検察官請求証拠なのか。火災原因報告書を見たら、証明力を判断するために重要といえるのはなぜか。", "a": "あたる。火災原因報告書をまとめた搜査報告書。内容誤記載や、重要な事項の欠落があれば証明力は低下するので、比較対象といった方法で証明力判断をすることが重要といえるから。", "arts": ["訴316-15"], "first": "H24-14"}, {"id": "H24-17", "y": "H24", "sn": 3, "sc": "場面設定3", "q": "弁護人は、火災原因についても争おうと考えている。この場合、他の方法でこの火災原因報告書の開示請求ができるか。", "a": "主張関連証拠（316条の20）として開示請求できる。<br>①類型証拠開示請求した証拠以外で、第三百十六条の十七第一項の主張に関連する<br>②被告人又は弁護人から開示の請求があつた場合において<br>③開示の請求に係る証拠を識別するに足りる事項<br>④第三百十六条の十七第一項の主張と開示の請求に係る証拠との関連性<br>⑤被告人の防御の準備のために当該開示が必要である理由", "arts": ["訴316-20"], "first": "H24-14"}, {"id": "H24-18", "y": "H24", "sn": 3, "sc": "場面設定3", "q": "類型証拠開示請求と主張関連請求のどちらもできる場合、どちらの方が良いか。", "a": "手続き的に先行する類型証拠開示請求をすべき。つまり、手続き的に主張関連証拠請求よりも早く開示されるので、防御方針を立てやすいため。", "arts": [], "first": "H24-14"}, {"id": "H25-01", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "Aが金目の物を盗む目的で、深夜B宅に侵入し、就寝中のBの部屋から現金5万円とキャッシュカードが入った財布を発見し、これを懐中に入れたところ、Bが目を覚ましたのでBに対して反抗抑圧程度の暴行を加えて逃走した。何罪が成立するか。", "a": "住居侵入罪と事後強盗罪が成立する。 (強盗罪も成立しうる。→占有の取得と確保を分ける見解)", "arts": ["刑238", "刑130"], "first": "H25-01"}, {"id": "H25-02", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、Aはどういう目的で暴行を加えたのか。", "a": "逮捕免脱、罪証隠滅、財物奪還阻止目的のいずれか。", "arts": ["刑238"], "first": "H25-01"}, {"id": "H25-03", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "事後強盗罪の構成要件を述べよ。", "a": "客観的構成要件要素として<br>①窃盗が、<br>②被害者などの逃亡の障害になる者に対して暴行・脅迫(強盗罪と同程度なので反抗抑圧程度のもの)を加えること<br>③暴行・脅迫が、窃盗の機会性のある状況でなされることであり、主観的構成要件要素として<br>④逮捕免脱、罪証隠滅、財物奪還阻止目的のいずれかの目的<br>⑤故意<br>⑥不法領得の意思である。", "arts": ["刑238"], "first": "H25-01"}, {"id": "H25-04", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "Aはキャッシュカードと現金入り財布をBから窃取したあと、キャッシュカードの暗証番号を聞き出すため、Bに対して反抗抑圧程度の暴行を加え、暗証番号を聞き出した。何罪が成立するか。", "a": "2項強盗罪。", "arts": ["刑236"], "first": "H25-01"}, {"id": "H25-05", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "この事例でAは具体的にどのような財産上不法の利益を得たのか。", "a": "キャッシュカードと暗証番号を入手することにより、Bの口座から容易に預金を引き出すことができるという財産上不法の利益を得た。", "arts": ["刑236"], "first": "H25-05"}, {"id": "H25-06", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "その後Aは逮捕され、事後強盗を被疑事実とする捜索差押許可状により、A宅のAの部屋を、Aの母親を立会人として捜索差押えが実施された。この結果、覚せい剤が発見された。この場合、発布された捜索差押許可状により差押えすることができるか。", "a": "できない。事後強盗罪と覚せい剤所持罪との間には、被疑事実関連性がないため。", "arts": ["訴219"], "first": "H25-06"}, {"id": "H25-07", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "この場合、他に覚せい剤を押収する手段はあるか。", "a": "Aの母親は保管者なので、任意提出を受けて領置することができる。※領置は、物の所有者、所持者、保管者から任意提出を受けてすることができる。 (刑訴法221条)　　遺留物として領置することもできる。", "arts": ["訴221"], "first": "H25-06"}, {"id": "H25-08", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "本件の覚せい剤は遺留物に当たるか。", "a": "当たらない。遺留物は、占有離脱物又は所有者等が占有を放棄した物をいうが、本件覚せい剤は、未だAの支配領域内に存在し、占有離脱物・占有を放棄した物とはいえないから。", "arts": ["訴221"], "first": "H25-06"}, {"id": "H25-09", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "捜索差押許可状で捜索中、覚せい剤が発見されたが、立会人であるA母親の同意なく差押えた。この場合、何が問題になるか。(訴訟上)", "a": "証拠収集手続きに違法があるため、違法収集証拠として、証拠能力が問題となる。", "arts": [], "first": "H25-06"}, {"id": "H25-10", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "違法収集証拠として証拠能力が否定される判断基準はどのようなものか。", "a": "憲法及び刑訴法の所期する令状主義の精神を没却するような重大な違法があり、収集された証拠の証拠能力を認めることが、将来の違法捜査抑止の観点から排除が相当といえる場合か否か。", "arts": [], "first": "H25-06"}, {"id": "H25-11", "y": "H25", "sn": 1, "sc": "場面設定1（1日目）", "q": "本件事例に当てはめてみよ。", "a": "本件の覚せい剤の差押えは別件差押えであり、違法であるが、覚せい剤事件において覚せい剤の存在は証拠として不可欠といえるし、本件の捜索差押えはもともと適法な事後強盗罪の捜索差押許可状に基づき実施され、その結果発見されたものである。そのため、覚せい剤所持罪での差押許可状の発布を受けて差押えることもでき、手続きの選択ミスと評価しうる。そのため違法程度がさほど高くなく、将来の違法捜査抑止の必要性も高くない。よって、証拠能力を認めても良い。", "arts": [], "first": "H25-11"}, {"id": "H25-12", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "AがXに対して暴行し、畏怖させた後に金を渡すよう要求した。そして、AがBに5万円を与えるからといって、Xから金を取ってこいと命令し、Bはそれに従ってXから金銭の交付を受けた。この場合、A、Bに何罪が成立するか。", "a": "A、Bに恐喝既遂罪の共同正犯が成立する。", "arts": ["刑249", "刑60"], "first": "H25-12"}, {"id": "H25-13", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜか。", "a": "Aに関して、Bとの間で共謀共同正犯が成立し、一部実行全部責任の原則から、BがXから金銭交付を受けた点も含めて帰責される。 Bに関して、承継的共同正犯が成立する。共犯の処罰根拠が自己の行為が共犯者の行為に間接的に因果性を与えたか否かであるが、Bは、AがXを暴行し畏怖させた状態を利用して、その畏怖状態にあるXから金銭交付を受けているから、因果性を与えているといえる。また5万円を得るので利益帰属もあるため正犯性もある。このため承継的共同正犯となり、帰責される。", "arts": ["刑60"], "first": "H25-12"}, {"id": "H25-14", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "AがXに暴行し、顔面打撲を負わせ、畏怖させて金銭を後に渡すよう要求した。その後、AがBに対し、5万円を与えるからといって、Xから金銭の交付を受けるよう言い、Xから拒まれた場合は傷害を負わせても良いから金を取ってくるよう言われた。Bはそれに従いXに暴行を加え、右上腕骨折をさせ、金銭の交付を受けた。この場合、A、Bに何罪が成立するか。", "a": "Aによる顔面打撲の点、Bを介した右上腕骨折の点の傷害罪と、Bを介した金銭交付を受けた点の恐喝既遂罪が成立する。 Bは、右上腕骨折の点の傷害罪と、恐喝既遂罪が成立する。", "arts": ["刑204", "刑249"], "first": "H25-14"}, {"id": "H25-15", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜBには顔面打撲の点の傷害罪が成立しないのか。", "a": "共犯の処罰根拠論から、自己の行為が共犯者を通じて間接的に法益侵害を惹起させる必要があるが、傷害罪は結果発生時点で既遂に達するため、事後に加担しても因果性を遡ることがありえない。よって成立しない。", "arts": ["刑60"], "first": "H25-14"}, {"id": "H25-16", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜ恐喝罪は承継的共同正犯が成立するのに傷害罪は成立しないのか。", "a": "恐喝罪は、先行する畏怖状態が事後に継続し、その後金銭交付を受けることで既遂となるため因果性を及ぼすことができるが、傷害罪は加担時点で既に既遂に達しており、因果性を及ぼしようがないから。", "arts": ["刑60"], "first": "H25-14"}, {"id": "H25-17", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "A、Bが、恐喝罪で共同被告人として起訴されました。両者は自己の犯行を認めています。この場合両者から弁護の依頼を受けた弁護士はこの依頼を受任すべきでしょうか。", "a": "事後的な利益相反状態になった場合には弁護士職務基本規程２８条柱書の本文、同３号に抵触するので、辞任する可能性があることから、あらかじめ、受任すべきではない。", "arts": ["職28"], "first": "H25-14"}, {"id": "H25-18", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "ではいかなる場合にも引き受けることができないのか。", "a": "受任する際に、当事者に利害対立した場合には辞任することを伝え (弁護士職務基本規程32条) 当事者双方の同意を得ればよい（同２８条柱書の但書）", "arts": ["職32", "職28"], "first": "H25-14"}, {"id": "H25-19", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "具体的審理の経過から両者が否認に転じたこの場合、弁護継続すべきか。", "a": "最善弁護活動ができなくなる恐れがあるため（規程４２、４６条）継続するべきではない。なぜなら両者の否認している内容が犯人はAだ、違う犯人はBだ、というように矛盾している場合、両者の間で利益相反状態となるため、攻撃防御が矛盾することとなり両者にとって不利益が大きいからである。", "arts": ["職42", "職46"], "first": "H25-14"}, {"id": "H25-20", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "では次にAがCにアリバイがあるように装うため、その内容の証言をしてほしいと考え、その旨を Cに伝えてくれと弁護人であるあなたに依頼した。この場合あなたはCに伝えますか。", "a": "伝えない。偽証罪の教唆犯（規程７５条）ともなりうるからである。", "arts": ["職75"], "first": "H25-14"}, {"id": "H25-21", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "それでは続いて公判の場面に移ります。Aが犯行を認めBが否認している際の弁護人としてBの証言を証拠とするためにはどのような方法が考えられますか。", "a": "Bの捜査段階における供述調書を証拠調べ請求する。", "arts": [], "first": "H25-14"}, {"id": "H25-22", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "それではその供述調書の話に移ります。Bの証人尋問をした際、検察官面前調書の内容と相反する供述をしました。この場合、検察官の立場として、検察官面前調書はどのように使いますか。", "a": "刑事訴訟法321条1項2号後段の相反供述書面として証拠調べ請求します。", "arts": ["訴321-1"], "first": "H25-14"}, {"id": "H25-23", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜ322条ではないのか。", "a": "322条は被告人本人の供述調書に関する規定だからである。この場合、共同被告人はあくまで第三者だし、322の不利益供述+任意性という緩やかな要件で認めるべきではないので、321条1項2号後段によるべきである。", "arts": ["訴322"], "first": "H25-14"}, {"id": "H25-24", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "2号(後段)書面の要件を述べよ。", "a": "前の供述と相反供述または実質的に異なった供述であること相対的特信状況があること。", "arts": ["訴321-1"], "first": "H25-14"}, {"id": "H25-25", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "特信状況をどのように判断するのか", "a": "外部的付随的事情から判断する。", "arts": ["訴321-1"], "first": "H25-14"}, {"id": "H25-26", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "ではどのように外部的事情を判断するのか", "a": "供述状況。（つまり、供述と証言の供述状況の対比）公判で相手方から見られている場合は心理的圧迫から冷静な心理的状況で供述できないが、他方で密室での検察官との会話であれば冷静な心理的状況で供述できると考えられるので相対的に信用性が高いと言える。なお外部的事情を判断するために供述内容も考慮しうる。理路整然か否かなども考慮する。", "arts": ["訴321-1"], "first": "H25-14"}, {"id": "H25-27", "y": "H25", "sn": 2, "sc": "場面設定2（2日目）", "q": "それ以外にも相対的特信状況を判断する事実はあるか。", "a": "記憶の鮮明さの比較。捜査段階で作成された供述調書のほうが公判証言よりも時系列的に前なので、より新鮮であるため、信用性が高いといえる。", "arts": [], "first": "H25-14"}, {"id": "H26-01", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "XはAに印鑑と預金通帳を預け、預金を引き出す権限を与えていた。Aはこれを使って預金を引き出し、自分のものにした。Aにはどのような罪が成立するか。", "a": "横領罪。", "arts": ["刑252"], "first": "H26-01"}, {"id": "H26-02", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "横領罪は、自己の占有する他人の物を横領するときに成立します。この場合、預金通帳と印鑑を持っているだけでAに占有は認められるのか。", "a": "認められる。横領罪の占有は、濫用のおそれがある支配力をいい、事実上の占有だけではなく法律上の占有も含む。　そして、預金通帳と印鑑があれば預金の払い戻しを受けることができるため、預金口座内の現金につき、法律上の占有があるといえる。", "arts": ["刑252"], "first": "H26-01"}, {"id": "H26-03", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "XはBに預金通帳と印鑑を盗まれた。そしてBがXの預金通帳と印鑑を持って銀行窓口へ行き、窓口で行員から預金の払い戻しを受けた。この場合、銀行との関係でBに何罪が成立するか。", "a": "1項詐欺罪。", "arts": ["刑246"], "first": "H26-01"}, {"id": "H26-04", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "はじめの事例との違いは何か。", "a": "正当な払い戻し権限の有無。", "arts": ["刑246"], "first": "H26-04"}, {"id": "H26-05", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "預金の占有とはどのようなものか。", "a": "横領罪は法律上の占有であり、詐欺罪は事実上の占有という点で、占有態様が異なる。", "arts": [], "first": "H26-04"}, {"id": "H26-06", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "Cは銀行に預金口座を持っていたが、身に覚えがない振込みがあり、Cはこれに気づいたものの窓口の行員に何も告げずに、その振り込まれた金を引き出した。この場合Cに何罪が成立するか。", "a": "1項詐欺罪。", "arts": ["刑246"], "first": "H26-04"}, {"id": "H26-07", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "誤振込みの場合、債権は有効に成立するという民事判例がある。これを考慮すると、Cに預金の占有があり、銀行の占有を肯定できないのではないか。", "a": "銀行の占有は認められる。", "arts": [], "first": "H26-04"}, {"id": "H26-08", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "この場合、もともとCに占有があるのだから、銀行の占有を認めるというのは矛盾しないか。", "a": "矛盾しない。横領罪の占有は、法律上の占有であるが、詐欺罪の占有は事実上の占有であるため、法律上の占有があっても事実上の占有があるわけではないため。誤振込により法律上の占有はあるが事実上の占有はあくまで銀行にある。", "arts": [], "first": "H26-04"}, {"id": "H26-09", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "この事例における欺く行為は何か。", "a": "銀行と継続的取引を行う者として、信義則上、誤振込の事実を告げる義務があるが、これを告げなかった不作為。（作為義務と義務違反、作為の可能性＋容易性）", "arts": ["刑246"], "first": "H26-09"}, {"id": "H26-10", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "この事例における財産的損害は何か。", "a": "確かに民事判例では、誤振込であっても当該預金の払出し債権を有することになる。そのため、財産的損害が生じない（ので「欺」く行為に当たらない）とも思える。しかし、銀行実務では誤振込の指摘があると、誤振込の事実確認をして、組戻しするという対応をとっていることから、誤振込事実を告げずに当該金を引き出すと、銀行は組戻しの機会を奪われて当該金を払い出すことになってしまう。よって、社会通念上、別個の支払いと言えるため、財産的損害と評価できる。", "arts": [], "first": "H26-10"}, {"id": "H26-11", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "Bの詐欺罪につき捜索場所をBの自宅、差し押えるべき物を預金通帳、印鑑とする捜索差押え許可状の発布を受けてB宅の捜索を実施した。この場合、本件詐欺罪とは無関係の他人名義の預金口座や印鑑が多数発見された。これらを、この捜索差押許可状で差し押えることができるか。", "a": "できない。被疑事実関連性がない。", "arts": ["訴219"], "first": "H26-11"}, {"id": "H26-12", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "捜索中に、Bの友人であるDがその場に居合わせて、そこにある書類は自分の物だと言って自分の服のポケットに入れた。この場合、先ほどの捜索差押許可状で捜索差押ができるか。", "a": "できる。必要な処分として、現場の原状回復として認められる。（刑訴法222条1項が準用する111条1項）", "arts": ["訴111"], "first": "H26-11"}, {"id": "H26-13", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "Bの自宅に第三者Fのがかかった金庫が置かれていた。この場合は、先ほどの捜索差押許可状でできるか。", "a": "をBが管理している場合　中身はBの管理支配権に属する物といえるので、できる。をFが管理している場合　中身はBと独立してFの管理支配権に及んでいるので、Bの自宅の同一管理権に属さないため、できない。", "arts": [], "first": "H26-11"}, {"id": "H26-14", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "Bの金庫だったとして、どのようにして金庫を開けるのか。", "a": "の任意提出を受けたり、Bの協力を求める。協力がない場合、必要な処分として、錠を開けることができる。この場合、屋を呼んだり、破壊する。", "arts": ["訴111"], "first": "H26-11"}, {"id": "H26-15", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "Bの自宅の庭にBの車があった場合、車の中を先ほどの捜索差押許可状で、捜索差押できるか。", "a": "できる。 Bの自宅敷地内に存在する以上は、Bの自宅の同一管理権に属する。", "arts": [], "first": "H26-11"}, {"id": "H26-16", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "他人名義の車だとどうか。", "a": "金庫と同様の問題(の管理の有無)となる。", "arts": [], "first": "H26-11"}, {"id": "H26-17", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、Bの車が公道上に存在する場合はどうか。", "a": "できない。同一管理権に属さないため。", "arts": [], "first": "H26-11"}, {"id": "H26-18", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "Bは起訴され、あなたはBの弁護人になったと仮定する。Bと接見した際、Bは自分が窃盗や詐欺などを犯したのは事実だが、無罪になる方法を教えてくれと言ってきた。この場合、どのような弁護方法を行うべきか。", "a": "無罪主張する。", "arts": [], "first": "H26-11"}, {"id": "H26-19", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "ではBが当初、公判廷で有罪を認めていたが、審理が相当進んだ後に無罪主張し始めた。この場合はどうか。", "a": "弁護士職務基本規程の真実義務と、守秘義務、最善弁護義務との抵触が問題となる。 (5条、23条、 46条) 被告の防御権を全うならしめるための弁護人選任権が認められていることからも、守秘義務や被告人の意思の尊重を優先させるべきである。そして立証責任は検察官にあるため、弁護人が積極的な真実義務を負うのではなく、不当な証言や証拠を提出しない限度での消極的真実義務を負うに過ぎない。そこで、被告人の意思が無罪主張なのであれば、基本的には検察官の提出する証拠を弾劾し、証明不十分の無罪となる方向で争う。もっとも、証拠上有罪が固い場合に無罪主張することで、かえって情状が悪くなり、刑罰が重くなる可能性もあるため、事件の見通しなどを説明し、最も被告人の利益となるような方法を助言し、説得も試みながら、意思を確認する。", "arts": ["職5", "職23", "職46"], "first": "H26-11"}, {"id": "H26-20", "y": "H26", "sn": 1, "sc": "場面設定1（1日目）", "q": "それでもなお無罪主張する場合は?", "a": "その場合も、説得や助言を試みるが、事件の見通しから明らかに無罪主張することが被告人の利益にならないような例外を除き、意思を尊重して、証拠の弾劾をして証明不十分による無罪を主張する。", "arts": ["職22"], "first": "H26-11"}, {"id": "H26-21", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "Aは前方を注視することなく車を運転し、Vを轢いた後、自己の罪が発覚することを恐れて逃亡し、結果、Aは死亡した。この場合の罪責は?", "a": "保護責任者遺棄致死罪が成立しない。", "arts": ["刑219"], "first": "H26-21"}, {"id": "H26-22", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜ、保護責任者遺棄致死罪が成立しないのか。", "a": "不作為犯が成立するには、作為との構成要件的同価値性が必要で、内容は、作為義務、作為の可能性、容易性が必要である。作為義務は、法令・契約・慣習・条理や、先行行為・危険の引き受け等で認められるが、法益が行為者に具体的に依存していたという排他的支配が必要。本件では、Aには交通事故発生させた場合の法令上の救護義務がある。しかし、排他的支配を認めるには足りない。 (形式的な作為義務だけでなく+排他的支配設定がないとだめ) (なお、事故発生後に119番通報して救急車で病院に連れて行かせることは、可能かつ容易。)", "arts": ["刑219"], "first": "H26-21"}, {"id": "H26-23", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、AがVを轢いた後（第一行為）、そのまま死んでしまうかもしれないが止むを得ないと考えて、そのまま Vを放置し（第二行為）、Vが死亡した場合はどうか。", "a": "過失致死罪が成立する。理由: 保護責任者遺棄致死罪が成立するには、作為義務が必要であるが、本問では作為義務がないため不作為による故意犯は成立しない。※なお、作為義務を認めた場合には、保護責任者遺棄致死罪と殺人既遂罪の区別が問題となる。　この場合の両者の区別は、　　①死の認識・認容という故意の有無　　②前者は抽象的危険犯であることから、後者が成立するには、生命侵害の現実的・具体的危　　　険がある状況で作為義務を怠ったか否かによる。", "arts": ["刑210"], "first": "H26-21"}, {"id": "H26-24", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、先ほどの事例同様にAはVを自動車で轢いた後、Vを車輪に巻き込んでしまった。 Aはそのことを認識しながら死亡しても構わないと思い、Vを車輪に巻き込んだまま1時間くらい引きずって走行した。結果Vは死亡した。この場合は何罪が成立するか。", "a": "当初の事故は過失運転致死罪が成立。その後の引きずり行為は、殺人既遂罪が成立する。（※意思の継続がないので別個の行為といえ、２罪成立する。）（※最初の事例は放置事例であるため不作為犯の検討となるが、本問は作為事例であるため作為義務の有無が問題とならない。なお、両者は併合罪となる。（熊撃ち判例参照）", "arts": ["刑199"], "first": "H26-24"}, {"id": "H26-25", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、最初の事故と、引きずり行為のいずれかでVが死亡したか判然としない。この場合はAの罪責はどうなるか。", "a": "過失運転致死罪と殺人未遂罪が成立する。", "arts": ["刑203"], "first": "H26-24"}, {"id": "H26-26", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜ死亡結果まで責任を問えるのか。", "a": "いずれの行為から死亡したかはわからないため、死亡結果の因果関係が否定され、利益原則から、死亡結果は帰責できないとも思える。しかし、両行為のどちらかで死亡したことが認められるのであれば、その限りで二者択一といえる。そのため、重なり合う軽い限度では、合理的疑いを入れない程度に死の結果が証明できており、軽い限度で帰責できるからである。", "arts": ["刑203"], "first": "H26-24"}, {"id": "H26-27", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、最初の事例に戻り、Aは過失運転致傷罪で逮捕され、自動車を運転してAがVをはねたとされる地点を警察官が実況見分し、その際に、Aは自分がVを初めて認識した地点はここだった、述べて、それが実況見分調書に記載された。検察官は、公判廷において、その実況見分調書を証拠として請求したが、弁護人に不同意とされた。この場合、検察官は調書を証拠採用されたい場合、どのような方法をとるか。", "a": "警察官を証人として証人尋問の請求をし、その警察官に、公判廷において、作成と内容の真正作成証言をしてもらう。(刑訴法321条3項) ※作成の真正とは、作成名義が当該警察官であるということ※作成内容の真正とは、記載内容と実況見分の実施過程が適正になされたということ", "arts": ["訴321-3"], "first": "H26-27"}, {"id": "H26-28", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、警察官に真正作成証言をさせ、実況見分調書が証拠採用されたとする。その調書内の、Aが Vを初めて認識した地点はここ、ということを立証するために、Aの指示説明部分を証拠とすることはできるか。", "a": "できない。 Aが実際にその地点でVを初めて認識したのか否か内容の真実性が問題となる。そのため当該部分は、実況見分調書とは独立して伝聞証拠に当たるため、別に伝聞例外の要件を充足する必要がある。本件では、Aの供述部分にAの署名押印（刑訴法３２１条１項柱書）がないため、認められない。", "arts": ["訴322"], "first": "H26-27"}, {"id": "H26-29", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "では捜査段階でどうすべきだったか。", "a": "Aの供述調書を作成しておくべきだった。", "arts": ["訴322"], "first": "H26-27"}, {"id": "H26-30", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "検察官が、Aを前方不注視の過失で起訴したものの、裁判官の心証では、前方不注視でなくスピード違反の過失が認められると抱いた。その場合、裁判所は訴因変更せずに、スピード違反を過失として認定することができるか。", "a": "できない。理由: 　訴因は、審判対象画定機能と防御権告知機能があり、前者が第一義的な意味を有しているため、他の犯罪と識別可能な程度の特定及び犯罪構成要件該当事実の記載が求められる。　その結果、審判対象画定に不可欠な事項が変動した場合には訴因変更が必須である。　また、後者の観点から、起訴状に明記され攻撃防御に含まれるものは被告の防御権告知機能の観点から、訴因変更が必要である。　もっとも、被告人にとって非不利益、非不意打ならば訴因変更は不要である。　過失の場合は、①注意義務発生根拠となる具体的事実、②注意義務の内容、③注意義務違反行為が異なるため、この3点が画定されて初めて審判対象が画定したと言える。　そのため、訴因変更が必要である。", "arts": ["訴312"], "first": "H26-30"}, {"id": "H26-31", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "前方不注視かスピード違反かどちらかわからないが、そのどちらかの過失があると心証を得た場合、裁判所はそのように認定することはできるか。", "a": "できる。　確かに、前方不注視又はスピード違反の過失による過失運転致死罪は、いずれも同一構成要件内だから、合成的構成要件創出というような罪刑法定主義に反することにはならない。　しかし、具体的な過失の内容が異なるのみで、過失があること自体は合理的疑いを入れない程度に証明されているため、利益原則から、情状の軽い方の過失を認定することができる。　※利益原則は、犯罪の証明ができなかった場合に、被告人を有利に扱う原則であり、このような認定は本来の使い方とは言えず許されないとする批判がある。", "arts": [], "first": "H26-30"}, {"id": "H26-32", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "検察官は、もともと過失運転致死罪で起訴していたが、その後、AがVを車に乗せてその後放置したことによる保護責任者遺棄致死罪で問うべき事案であったと思い直した。この場合、保護責任者遺棄致死罪でAに罪を問いたいのですが、どのような方法によるべきか。", "a": "訴因変更によるべき。", "arts": ["訴312"], "first": "H26-32"}, {"id": "H26-33", "y": "H26", "sn": 2, "sc": "場面設定2（2日目）", "q": "理由は?", "a": "同一客体の死が2回発生することは有り得ず、狭義の同一性が認められるので、「公訴事実の同一性」（刑訴法３１２条１項）が認められることから、訴因変更によるべきである。", "arts": ["訴312"], "first": "H26-32"}, {"id": "H27-01", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "事案甲は、ホテルを利用した後、午前10時にチェックアウトしようと思ったら、所持金がないことに気づいた。そこで、ホテルの支配人Aに、ちょっとトイレに行ってくる、と言って入り口付近に行き、逃走した。この場合、甲になんらかの犯罪が成立するか。", "a": "犯罪は成立しない。", "arts": ["刑246"], "first": "H27-01"}, {"id": "H27-02", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、考えうる犯罪は何が挙げられたか。", "a": "窃盗罪と詐欺罪(2項)。", "arts": ["刑246"], "first": "H27-01"}, {"id": "H27-03", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜ犯罪が成立しないと考えたのか。", "a": "窃盗罪は、利益窃盗が不可罰とされているため。詐欺罪における、財産的処分行為がないため成立しない。なぜなら、Aは、甲がトイレに行くと思ったので、その点を認めたに過ぎず、その限度の外形的事実しか認識しておらず債務の免除等を認めたわけではないため。", "arts": ["刑246"], "first": "H27-01"}, {"id": "H27-04", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、先ほどの事案で、甲が逃走する意図で支配人Aに対して、ちょっと5キロほど離れた街に行ってくる。数時間後に帰ってくる。お金はその時に払う、と言った場合はどうか。", "a": "2項詐欺罪が成立する。この場合は、Aとしては、甲が戻ってこない可能性も含めて認識しながら、債務履行の猶予を与えており、甲の欺く行為により錯誤に陥り財産的処分行為がなされているため。", "arts": ["刑246"], "first": "H27-01"}, {"id": "H27-05", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、甲が支払い意思がないのに、ホテルで食事の提供を受けたり、宿泊した。この場合は何罪が成立するか。", "a": "飲食について1項詐欺罪、宿泊について2項詐欺罪が成立する。", "arts": ["刑246"], "first": "H27-01"}, {"id": "H27-06", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜ1項と2項が成立するのか。", "a": "飲食物は財物であるためであり、宿泊は財産上の利益であるため。", "arts": ["刑246"], "first": "H27-01"}, {"id": "H27-07", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "罪数は?", "a": "包括一罪。同一の法益に対してなされ、近接した日時場所で行われているため。", "arts": ["刑246"], "first": "H27-01"}, {"id": "H27-08", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、先ほどの事例で、甲がお金を払わず逃走したところ、支配人が追いかけてお金を払えと請求してきた。このため甲はAの右腕を切りつけて出血させて逃走した。この場合は何罪が成立するか。", "a": "強盗致傷罪(刑法240条前段)", "arts": ["刑240", "刑236"], "first": "H27-08"}, {"id": "H27-09", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "この場合、まず何項の強盗罪が成立するのか。", "a": "2項強盗罪(236条2項)", "arts": ["刑240", "刑236"], "first": "H27-08"}, {"id": "H27-10", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "財産上の不法の利益を得たとは言えないのでは?（実行行為性の問題）", "a": "いえる。利益の移転につき処罰範囲の限定のため直接性や具体性が必要なところ、Aが甲の所在を突き止めて債務の履行を求めることは困難であるため、利益移転の直接性や具体性も認められるから。", "arts": ["刑236"], "first": "H27-08"}, {"id": "H27-11", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "処罰範囲の限定って、なぜ?", "a": "債務者が債権者を殺害した場合のように、結果的に利益を得る場合にも無条件に強盗利得罪が成立しかねないため。※債権に関する証拠が一切残っておらず債権者に相続人が居ないようなケースでは、強盗利得罪が成立しうるので注意。", "arts": ["刑236"], "first": "H27-08"}, {"id": "H27-12", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "先ほどの詐欺罪と2項強盗罪の罪数は?", "a": "包括一罪", "arts": [], "first": "H27-08"}, {"id": "H27-13", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "先ほどの事例で、Aは怪我をして病院へ行き、治療を受けた後、午後5時くらいにたまたま駅で甲を見つけた。なお甲がAにナイフで怪我を負わせたのは午前10時30分とする。この場合に、A は自ら甲を捕まえることは困難だと考え、110番通報した。現場に駆けつけた警察官は、甲の姿を見て、甲の身体や被服に血液が付着しているのを確認した。この場合、警察官は甲を逮捕できるか。", "a": "できる。", "arts": [], "first": "H27-13"}, {"id": "H27-14", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、どのような逮捕種別が考えられるか。", "a": "準現行犯逮捕(刑訴法212条2項) または緊急逮捕(刑訴法210条１項)", "arts": ["訴210", "訴212"], "first": "H27-13"}, {"id": "H27-15", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、どちらの手続きが適切か。", "a": "緊急逮捕。準現行犯逮捕については、時間的接着性が必要であるが、すでに6時間半もの時間経過があり罪を行い終わって間がないとは言えないから。しかもAによる甲の逮捕行為も、一度見失っており、逮捕行為が継続しているとも言えないため。", "arts": ["訴210", "訴212"], "first": "H27-13"}, {"id": "H27-16", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、先ほどの事例で警察官は緊急逮捕ではなく、準現行犯逮捕してしまった。この場合、身柄の送検を受けた検察官としては、どのような対応をするべきか。", "a": "一旦身柄を釈放し、その上で緊急逮捕するべき。", "arts": [], "first": "H27-16"}, {"id": "H27-17", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "緊急逮捕の要件は?", "a": "1被疑者が死刑または無期もしくは長期3年以上の懲役または禁錮に当たる罪を犯したこと<br>2急速を要し裁判官の令状を求めることができないこと<br>3被疑者が罪を犯したことを疑うに足りる充分な理由があること<br>4その理由を告げること<br>5逮捕後に直ちに裁判官に令状請求し、逮捕状発布を受けること<br>6逮捕の必要性（逃亡のおそれ又は罪証隠滅のおそれがあること）（刑訴法１９９条２項但書、規則１４３の３）", "arts": ["訴210"], "first": "H27-16"}, {"id": "H27-18", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、充分な理由があると言えるか。", "a": "言える。時間経過6時間半の時点で、被害者のAが甲を発見され、甲の身体や被服には血液が付着しているため、Aの証言は記憶減退が少なく証言内容と甲の状態が一致することから信用性が高いため、充分な理由があると言える。", "arts": ["訴210"], "first": "H27-16"}, {"id": "H27-19", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、同じ被疑事実で再逮捕することは許されるのか。", "a": "許される。（刑訴法199条3項、規則142条1項8号参照）理由は、再逮捕を認める必要性があり、逮捕の不当な蒸し返しと言えない場合でなければならないが、本件では、手続き選択を誤ったに過ぎず不当な蒸し返しではないし、罪の重さや逃走の恐れなどもあり再逮捕を認める必要性もあるため。", "arts": [], "first": "H27-16"}, {"id": "H27-20", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "その後甲は勾留され、その後も勾留延長された。この場合甲は釈放されたいと望んでいるが、弁護人としてはどのような対応を取るべきか。", "a": "勾留の取消請求と、そもそも勾留延長に理由がないとして、準抗告(429条1項2号)する。", "arts": ["訴429", "訴87"], "first": "H27-16"}, {"id": "H27-21", "y": "H27", "sn": 1, "sc": "場面設定1（1日目）", "q": "甲はホテルに泊まったとされる時間帯に彼女の家にいたと主張している。あなたは甲の弁護人として、検察官が有しているアリバイ証拠を主張関連証拠として手に入れたいと考えている。主張関連証拠として請求するには何を主張するか。", "a": "まずアリバイ主張をする。その上で、証拠開示請求に係る証拠を識別するに足りる事項を明らかにする。更には、主張との証拠の関連性と被告人の防御の準備のために必要な理由を明らかにする。刑訴法316条の20。", "arts": ["訴316-20"], "first": "H27-21"}, {"id": "H27-22", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "事例　AはB社に勤務している。B社は通信販売の代金を代引きで決済するというサービスを行っている。 Aは代金の受け取りのため、Cの下を訪れた。この時Aは、受領した代金をパチンコ代に浪費する意図で、実際にCから代引きによる決済で受け取った代金5万円を、自己の財布に入れて、これをパチンコ代に浪費した。　この事例において、Aに何罪が成立するか。", "a": "業務上横領罪が成立する。", "arts": ["刑253"], "first": "H27-22"}, {"id": "H27-23", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "他に何か検討すべき犯罪はないか。(不成立だとしても検討すべき犯罪はないかという意味)", "a": "1項詐欺罪。", "arts": ["刑253"], "first": "H27-22"}, {"id": "H27-24", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "詐欺罪(1項)の成否を検討しましょう。詐欺罪の構成要件を述べよ。", "a": "1人に対して<br>2欺く行為をし<br>3これによって錯誤に陥らせ<br>4財産的処分行為をさせ<br>5財物の占有移転を受けること、これら一連の因果関係があること。また、主観的構成要件要素である故意と、領得罪としての不法領得の意思が必要。", "arts": ["刑246"], "first": "H27-22"}, {"id": "H27-25", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "本問では欺く行為があったと言えるか。", "a": "ない。欺く行為とは、人の財産的処分行為をするにあたっての判断の基礎となる重要な事実を偽ることを言うが、Aは集金権限があり、真意である自己費消目的を秘したとしても、代金5万円を支払えばB社に対する決済は完了して債務消滅するため、重要な事実は、代金支払いがB社に帰属し債務消滅するか否かであり、Aの目的の有無は重要ではない。よって、この点を秘しても欺く行為にはならない。", "arts": ["刑246"], "first": "H27-22"}, {"id": "H27-26", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "そうすると、結論は?", "a": "詐欺罪は不成立となる。", "arts": ["刑246"], "first": "H27-22"}, {"id": "H27-27", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、業務上横領罪を検討するとして、本問で、横領はあるといえるか?", "a": "ある。横領とは、不法領得の意思の発現たる一切の行為をいい、この場合の不法領得の意思は、他人の物の占有者が、委託の趣旨に背いて所有者でなければできないような処分をすることをいう。本問では、集金した5万円につき、B社に渡さなければならないところ、これを自己のパチンコ消費のために財布に入れて、パチンコに浪費したのだから、所有者たるB社でなければできないような処分をしたといえ、不法領得の意思が発現したといえる。よって横領がある。", "arts": ["刑253"], "first": "H27-22"}, {"id": "H27-28", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "検察官が、横領行為の成立を認めるためには、どの時点で認めるのが良いと考えるか。", "a": "パチンコで費消した時点。", "arts": [], "first": "H27-22"}, {"id": "H27-29", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "それより前の場合はどうか。ではなぜ、その時点としないのか。", "a": "財布に入れた時点財布に入れた時点では、また戻すつもりだった可能性が否定できず、そのような反論があった場合に、不法領得の意思の発現が認められない可能性があるため。", "arts": [], "first": "H27-22"}, {"id": "H27-30", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、B社では集金したお金は、直ちに集金袋に入れるルールが確立されていながら、Aは自己の財布に入れた場合で、かつ、この状況を防犯カメラで撮影されたケースではどうか。", "a": "この場合は、財布に入れた時点でも、不法領得の意思の発現が証明できるので、この時点でも良い。", "arts": [], "first": "H27-22"}, {"id": "H27-31", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "Aからの反論で、確かに財布にお金を入れたが、パチンコで儲けて返すつもりだったという反論があった場合はどうか。", "a": "横領罪が成立することに変わりない。", "arts": [], "first": "H27-22"}, {"id": "H27-32", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "理由は?", "a": "確実に補填できる場合であれば格別、パチンコはギャンブルであり確実に補填できるとは限らないから。", "arts": [], "first": "H27-22"}, {"id": "H27-33", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "Aは、以前から、集金代金の使い込みを行なっており、これを補填するため、別の客からの集金代金で補填するというようなことを繰り返していた。今回も、Cから受け取った代金を使い込んだため、Dから受け取った代金で補填した。この場合、Aは、Cの代金の横領の点は補填されているのだから損害発生がないとして、横領罪の不成立を主張している。横領罪は成立するか。", "a": "成立する。横領罪は、個別的財産に対する罪（背任罪が全体財産に対する罪であることとの対比）であるため、Cから受け取った現金についてパチンコ代に費消することは横領したと言えるため。", "arts": [], "first": "H27-33"}, {"id": "H27-34", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、Dから受け取った代金でCから受け取った分の補填をした行為に横領罪は成立するか。", "a": "成立する。補填行為も所有者でなければできない行為であり、これをAが自己のパチンコ費消の補填のため行なっているから。", "arts": [], "first": "H27-33"}, {"id": "H27-35", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "その後Aは、行方不明となった。捜査機関はAに対する業務上横領罪の被疑事実で、Aの元の自宅に対して捜索差押を実施するため令状発布を受け、捜索を開始した。その結果、Aの元の自宅から、大麻が発見された。この場合、捜査機関は、この大麻を差し押えることができるか。", "a": "できない。", "arts": ["訴219"], "first": "H27-35"}, {"id": "H27-36", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜか。", "a": "業務上横領罪と大麻との間には、通常、被疑事実関連性がないから。（刑訴法２２２条１項本文、９９条１項）", "arts": ["訴219"], "first": "H27-35"}, {"id": "H27-37", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、どのようにして大麻を押収するべきか。", "a": "別途、大麻所持罪で差押許可状の発布を受けて差し押える。", "arts": ["訴221"], "first": "H27-35"}, {"id": "H27-38", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "それ以外の手段はないか。この場合、立会人としてAの母を置いていたものとする。", "a": "所有者や所持者だけでなく、保管者からも提出を受けることができるため(刑訴法221条)、 Aの母から、任意提出をうけて領置する。なお、Aの占有が放棄されたと解される場合は、遺留品として領置する。", "arts": ["訴221"], "first": "H27-35"}, {"id": "H27-39", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "Aが所持していた帳簿のデータなどを差し押えるため、差押状には、CDーRが差し押えるべき物と記載され、実際にCDーRが発見された。この場合に、中のデータを確認することなく差し押えることはできるか。", "a": "原則できないが、例外的に、証拠存在の蓋然性があり、その場で確認していたのではデータ消滅させられる危険が存する場合には、内容確認しなくとも差し押えることができる。", "arts": [], "first": "H27-35"}, {"id": "H27-40", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、中身を確認する方法は何があるか。", "a": "立会人に処分に必要な協力をさせる。(刑訴法111条の2)", "arts": ["訴111-2"], "first": "H27-35"}, {"id": "H27-41", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "Aが行方不明のまま、国選弁護人が選任された。この場合、何か問題はあるか。", "a": "Aから弁解を聞くことができず、意向に沿った防御方針がたてにくい。その結果、最善弁護を果たせなくなる可能性(46条)と意思の尊重(22条)ができなくなる可能性がある。", "arts": ["職22", "職46"], "first": "H27-35"}, {"id": "H27-42", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "Aには逮捕状が発布されていたとして、捜査員がたまたま街中でAを発見した。しかし逮捕状を持っていなかった。この場合、どうすべきか。", "a": "緊急執行(刑訴法201条2項、73条3項)する。<br>1逮捕状が発付済みであるが、逮捕状を所持しないためこれを示すことができない場合<br>2急速を要するとき<br>3被疑者に対し、被疑事実の要旨及び逮捕状が発せられている旨を告げる<br>4ただし、逮捕状は、逮捕後にできる限り速やかに示す。", "arts": ["訴201", "訴73"], "first": "H27-35"}, {"id": "H27-43", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "捜査員がAを最寄の警察署に連行した。その後、Aの身体や衣服を捜索したが、これは許されるか。", "a": "逮捕に伴い、逮捕の現場における捜索差押として許される。", "arts": ["訴220"], "first": "H27-35"}, {"id": "H27-44", "y": "H27", "sn": 2, "sc": "場面設定2（2日目）", "q": "今回のようなケースでも逮捕の現場と言えるのか。", "a": "言える。原則は、逮捕した場所で行う必要があるが、例外として、被疑者の名誉を害したり、交通支障がある場合、被疑者等の抵抗等があって支障がある場合には、その場から捜索差押えに適する最寄の場所まで移動しても、当該場所は「逮捕の現場」と同視できる。よって、することができる。この場合、被疑者の身体などは元の場所か否かで証拠存在の蓋然性は変わりないし、令状による場合も適切な最寄の場所へ移動してから差押えすることができることとの均衡である。", "arts": ["訴220"], "first": "H27-35"}, {"id": "H28-01", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "事例 Aはある日、実母Vの留守中を狙ってVの暮らす家に侵入した。そして、タンスの中にしまってあるV所有の宝石を換金目的で盗み、そのまま家を出た。 Aについて窃盗罪は成立するか。", "a": "犯罪としては成立する。しかし親族相当例により処罰阻却される。", "arts": ["刑244"], "first": "H28-01"}, {"id": "H28-02", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "親族相当例の効果や趣旨について述べよ。", "a": "「罪・・・その刑を免除する」（刑法２４４条１項）とされており、犯罪の成立は前提としつつも処罰を免除つまり処罰阻却事由としての効果がある。趣旨は、「法は家庭に入らず」ということで、家庭内の問題は家庭で解決することが適切であろうとする法政策的配慮による。参照条文刑法２４４条 (親族間の犯罪に関する特例) 配偶者、直系血族又は同居の親族との間で第二百三十五条の罪、第二百三十五条の二の罪又はこれらの罪の未遂罪を犯した者は、その刑を免除する。<br>2 前項に規定する親族以外の親族との間で犯した同項に規定する罪は、告訴がなければ公訴を提起することができない。<br>3 前二項の規定は、親族でない共犯については、適用しない。一身的処罰阻却事由とされており、犯罪は成立するが処罰されない。", "arts": ["刑244"], "first": "H28-01"}, {"id": "H28-03", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "判例はこの点につきなんと言っているか", "a": "同趣旨を述べている。 &lt;判例&gt; 親族間の一定の財産犯罪については、国家が刑罰権の行使を差し控え、親族間の自律にゆだねる方が望ましいという政策的な考慮に基づき、その犯人の処罰につき特例を設けたにすぎず、その犯罪の成立を否定したものではない。", "arts": ["刑244"], "first": "H28-01"}, {"id": "H28-04", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、宝石がV所有ではなく、Vの知人Wの所有であった場合、甲は窃盗罪で処罰されるか。", "a": "される。理由は、法は家庭に入らずという趣旨が当てはまるためには、所有者と占有者の双方との親族関係が必要であり、本件では所有者との親族関係がないから。つまり窃盗の保護法益は占有と所有権の双方と解するので、双方との親族関係が無いと、いずれかの法益を侵害することになり、家庭外の問題となってしまうため。", "arts": ["刑244"], "first": "H28-01"}, {"id": "H28-05", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "判例は同趣旨?", "a": "はい。", "arts": ["刑244"], "first": "H28-01"}, {"id": "H28-06", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "事例 AはVから宝石を盗んだ後、知人のBに事情を話して保管を依頼しBは宝石を2週間保管した。ところが、その後、Bは宝石を売却して金を得ようと企て、Aに無断で宝石をCに売却した。 Bの罪責は?", "a": "1盗品等保管罪(刑法256条2項)が成立する<br>2委託物横領罪が成立する(刑法252条)", "arts": ["刑256", "刑252"], "first": "H28-06"}, {"id": "H28-07", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜ横領罪が成立するのか。", "a": "横領罪の構成要件は、自己の占有する、他人の物、委託信任関係、横領である。まず、Bは、Aから宝石の保管を依頼されて保管しているため、自己の占有する、と言える。次に、保管を依頼されているから、委託信任関係がある。横領罪の保護法益は所有権だけでなく副次的に委託者との信任関係も含むが、窃盗犯人との委託信任関係は保護されないようにも思われる。しかし窃盗罪における窃盗の占有を保護することとの均衡から、窃盗犯人との委託信任関係も、保護される。そのため、委託信任関係もある。所有者はVなので、他人の物である。横領とは不法領得の意思の発現たる一切の行為をいい、委託物につき、委託の趣旨に背いて権限がないのに所有者でなければできないような処分をすることをいう。 Bは宝石をAに無断で売って金を得ようとしているため、委託の趣旨に背いて権限がないのに所有者でなければできないような処分をしたといえ不法領得の意思の発言があり、横領したと言える。", "arts": ["刑252"], "first": "H28-06"}, {"id": "H28-08", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、両罪の罪数は?", "a": "併合罪になる。理由は、盗品等保管は継続犯、横領罪は状態犯であるため、線と点の関係にあるから。また、盗品等保管は所有権者の追求権侵害が主な侵害法益であるが、他方で横領罪は、所有権だけでなく委託者との委託信任関係も副次的に保護されるため、前者の犯罪のみでは、法益侵害が評価し尽くされていないから。", "arts": [], "first": "H28-06"}, {"id": "H28-09", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "AとBが共謀してVから宝石を盗んだとする。実行者はAであり、Bは共謀のみで、もっぱら背後者という形で関与した。 ABはともに窃盗罪で起訴され、公判前整理手続を経て、共通の手続きで審理されることになった。では、まず冒頭手続きで何がどのような順序で行われるか。", "a": "人定質問→起訴状朗読→権利告知→罪状認否", "arts": [], "first": "H28-09"}, {"id": "H28-10", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "証拠調べ手続きでは、最初に何が行われるか。", "a": "検察官の冒頭陳述が行われる。", "arts": ["訴316-30"], "first": "H28-09"}, {"id": "H28-11", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、被告人側の冒頭陳述はされるのか。", "a": "される。なお、公判前整理手続に付された場合は、必要的である。(通常は任意的)", "arts": ["訴316-30"], "first": "H28-09"}, {"id": "H28-12", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "Aは全面的に公訴事実を認めているが、BはAが窃盗をしたことは認めるものの、自分は共謀していないとして否認している。検察官は、窃盗についての第三者の目撃証言及びAとBが話し合っていた旨が記載された検察官の面前での供述録取書を証拠調べ請求してきた。あなたがBの弁護人であるとして、これにどのように対応するか。", "a": "まず、①Aが窃盗をしたこと、については同意する。しかし、②BはAと共謀したこと、については否認する。 (※いわゆる一部同意)", "arts": ["訴326"], "first": "H28-12"}, {"id": "H28-13", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "その理由は?", "a": "①については争いがないため。<br>②については、共謀部分につき争いがあるため。なお、これにより、争点明確化が図られて、立証方針が定まり、効率化が図られる。", "arts": ["訴326"], "first": "H28-12"}, {"id": "H28-14", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、検察官が、先ほどの検察官面前調書と相当程度重複する警察官面前調書も証拠調べ請求してきたとする。裁判官は、検察官面前調書について証拠調べをすべきでないと考えているが、それはどのような観点からなのか。", "a": "証拠の厳選(規則189の2)。相当程度重複するのであれば、基本的に片方で足りると言えるから。刑訴法規則(１８９の２）証拠の厳選証拠調べの請求は、証明すべき事実の立証に必要な証拠を厳選して、これをしなければならない。", "arts": ["規189-2"], "first": "H28-14"}, {"id": "H28-15", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、検察官面前調書の証拠調べ方法は?", "a": "朗読(法305)または要旨の告知(規則203の2)", "arts": ["訴305"], "first": "H28-14"}, {"id": "H28-16", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、AとBは起訴され、ともに全面自白したとする。あなたは、AB双方から弁護人になるよう依頼されたが、受任するか。", "a": "受任しない。", "arts": ["職28", "職46"], "first": "H28-14"}, {"id": "H28-17", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "理由は?", "a": "確かに、共犯関係として起訴されており、事件も同一であり証拠関係も相当程度共通する。また、現時点では、互いに自白しているから利益相反関係にならない。しかし、事後に相反する可能性がありうるため、あらかじめ受任しない方が良い。弁護士職務基本規程28条3号に反する可能性があるし、最善弁護(46条)ができなくなる可能性があるからである。", "arts": ["職28", "職46"], "first": "H28-14"}, {"id": "H28-18", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、仮に、AB双方の依頼を受けて受任したとする。しかし、その後Bのみが否認し始めた。どうするか。", "a": "辞任する。", "arts": ["職42", "職46"], "first": "H28-14"}, {"id": "H28-19", "y": "H28", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "まず、現実に利害対立が発生しているため42条により辞任を検討すべきことになる。また、一方についてプラスになる証拠があっても、他方にとってはマイナスになる証拠があり得たり、双方で攻撃防御方針が異なってしまう場合には、一方を弁護する代わりに他方を弾劾するなど矛盾した弁護活動が迫られる。そうなってしまうと、いずれに対しても、最善弁護ができなくなる懸念があるため。", "arts": ["職42", "職46"], "first": "H28-14"}, {"id": "H28-20", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "事例 Aは銀行口座を開設して、通帳とキャシュカードの交付を受け、これを第三者に譲渡する意思を有していたが、これを秘して銀行に置いて口座開設をして、通帳とキャッシュカードの交付を受けたとする。 Aの行為には何罪が成立するか。", "a": "銀行に対する1項詐欺罪(246条1項)が成立する。", "arts": ["刑246"], "first": "H28-20"}, {"id": "H28-21", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜ詐欺罪が成立するのか。", "a": "まず、銀行行員は本人たる銀行の&lt;財物&gt;である通帳やキャッシュカードの交付判断をすることができ、被欺罔者たる&lt;人&gt;である。次に、&lt;欺いて&gt;とは、人が処分行為に向けられた、処分行為の判断にあたっての基礎となる重要な事実を偽ることをいい、銀行実務では他人に対するキャッシュカードや通帳の譲渡を定款で禁止していることから、他人に譲渡する目的がある場合には、口座開設を受け付けずに通帳キャッシュカードの交付をしない。にもかかわらず本件で通帳やキャッシュカードを交付したのは、他人に対する譲渡目的を秘匿して自己使用であるかのように装ったからである。これは挙動により他人に対する譲渡目的がないとした行為であり、処分行為の判断の基礎となる重要な事実を偽る行為なので、&lt;欺く&gt;行為である。これにより錯誤に陥った銀行員が、Aに通帳やキャッシュカードという&lt;財物&gt;を&lt;交付&gt;した上、これらに因果関係が認められ、不法領得の意思、故意に欠けるところもないため、詐欺罪が成立する。", "arts": ["刑246"], "first": "H28-20"}, {"id": "H28-22", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "しかし、銀行には、損害は生じないのでは?", "a": "銀行としては、暴対法などの関係上、他人名義の口座開設を禁止するシステム構築をしていることから、他人名義の口座開設をしたとなれば、社会的信用低下になるため、経済的損失が生じうる。そのため、損害があるといえる。", "arts": [], "first": "H28-20"}, {"id": "H28-23", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、本件のキャッシュカードと通帳は、詐欺での財物に当たるか。", "a": "当たる。通帳やキャッシュカードは所有権の対象になり、また、単なる証明作用だけでなく、預金の入出金という経済的機能を備えるため、詐欺罪で保護すべき財物に当たる。", "arts": ["刑246"], "first": "H28-20"}, {"id": "H28-24", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、そういう判例があるのか", "a": "ある。（最高裁決定平成26年4月7日）", "arts": ["刑246"], "first": "H28-20"}, {"id": "H28-25", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、Aは、知り合いのBに対して、A名義のクレジットカードを渡し、口座には50万円入っているから、その範囲ならこれを使って買い物をしても良いと告げた。 Bはクレジットカードの加盟店において、クレジットカードを利用し、商品の交付を受けた。この場合、Bには何罪が成立するか。", "a": "1項詐欺罪が成立する。", "arts": ["刑246"], "first": "H28-25"}, {"id": "H28-26", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "この場合の詐欺の客体は?", "a": "購入した商品。", "arts": ["刑246"], "first": "H28-25"}, {"id": "H28-27", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "この場合、なぜBの行為は詐欺罪における欺もう行為だと言えるのか。", "a": "欺く行為は、人の処分行為をするにあたっての判断の基礎となる重要な事実を偽る行為であるが、クレジットカードはカード利用者の経済的信用を基礎に成り立っており、加盟店は、信販会社との立替払い契約上、クレジットカード利用者が名義人本人であるか否かを確認する義務がある。もし、加盟店が、この義務を怠って商品を渡せば、立替払いを受けられなくなる可能性があるため、クレジットカード利用者がカード名義人本人であるか否かは、処分行為をするにあたっての判断の基礎となる重要な事実に当たるからである。", "arts": [], "first": "H28-25"}, {"id": "H28-28", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "本人が承諾していてもダメなのか。", "a": "クレジットカード利用規約上、本人のみしか利用できないため本人の承諾は意味をなさない。", "arts": [], "first": "H28-25"}, {"id": "H28-29", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、Aは、ATMの設置された銀行の支店に置いて、他人がATMを利用しているところを狙い、この暗証番号を盗撮する目的で、支店に入った。この場合、Aには建造物侵入罪は成立するか。", "a": "成立する。", "arts": ["刑130"], "first": "H28-25"}, {"id": "H28-30", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜか", "a": "建造物侵入は、正当な理由がなく、人の看守する建造物に侵入することをいう。侵入とは、看守者の意思に反した立ち入りをいうと解される。一般的に公開されて立ち入りが自由な場所であっても、立ち入り目的、態様、場所の性質、管理者の態度などから、看守者が立ち入りを拒むと言える場合には、侵入に当たるとされる。銀行の支店看守者である支店長としては、他の利用客の暗証番号を盗撮する目的での立ち入り者については、立ち入りを拒むのが通常なので、看守者の意思に反した立ち入りであり、侵入に当たる。(判例アリ平成19年7月2日最高裁決定)", "arts": ["刑130"], "first": "H28-25"}, {"id": "H28-31", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、侵入を管理者の意思に反する立ち入りと解すると、万引き目的で店に入っただけでも建造物侵入罪が成立することになるが、これでは、処罰範囲が不当に拡大しないか。", "a": "犯罪自体は、成立する。この部分は、起訴便宜主義から、検察官に起訴不起訴の決定権限(刑訴法247、248 条)があるため、不起訴にすれば、処罰範囲を調整でき、不当に拡大することはない。", "arts": ["訴248"], "first": "H28-25"}, {"id": "H28-32", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "Aは、住居侵入罪の容疑で逮捕された。検察官は、Aを住居侵入罪とは全く別の機会でなされた詐欺罪で勾留することができるか。", "a": "住居侵入と詐欺が、公訴事実の同一性(刑訴312条1項)がないならば、事件が全くの別個のものなので、逮捕前置がなされておらず、勾留はできない。もっとも、公訴事実の同一性があるならば、逮捕を前置しているといえ勾留できる。", "arts": [], "first": "H28-25"}, {"id": "H28-33", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、逮捕前置主義の趣旨から、先ほどの事案で勾留が認められない理由を説明せよ。", "a": "逮捕前置主義は、裁判官による二重の司法審査に服させることにより、不必要な身柄拘束を回避して被疑者の人権保護をするものである。そして、この前提として、刑訴法は、事件について人ごとではなく、事実ごとに判断することとなっているので(被疑事実、公訴事実など)逮捕の前置があるか否かは、事実ごとに判断する。(事件単位説) そして、事実ごとに逮捕前置がなされているかどうかは、公訴事実の同一性が認められるか否かによる。本件では、別個の事実による身柄拘束にすぎず、事件単位説からは逮捕前置があると言えず勾留はできない。", "arts": [], "first": "H28-25"}, {"id": "H28-34", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "勾留の手続き的要件を述べよ。", "a": "1適法な逮捕の前置 2時間制限の厳守(刑訴法203から206条)<br>3勾留請求手続き", "arts": ["訴205"], "first": "H28-25"}, {"id": "H28-35", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜ裁判官のところに連れて行かれるのか。", "a": "勾留質問(刑訴61)されるため", "arts": ["訴61"], "first": "H28-25"}, {"id": "H28-36", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "勾留質問では、どのようなことを手続きをするのか", "a": "1人定質問<br>2黙秘権告知<br>3被疑事実の要旨の告知<br>4弁解の機会の付与<br>5弁護人選任権の告知<br>6勾留通知先の聴取", "arts": ["訴61"], "first": "H28-25"}, {"id": "H28-37", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜ、被疑事実の要旨を告知するのか。", "a": "自らがどのような理由で身柄拘束を受けているのかわからないと十分に防御権行使できないから。", "arts": ["訴61"], "first": "H28-25"}, {"id": "H28-38", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、裁判官が勾留質問の際、Aから、身柄拘束の理由となっていた住居侵入罪の取り調べは一切行われず、全く無関係の殺人罪の取り調べが行われたとの話を聞きました。このような場合、勾留の適法性はどうなると言えるか。", "a": "違法になる。裁判官により、身柄拘束につき二重の司法審査に服させる必要があるところ、別件である住居侵入については逮捕前置していても、本件である殺人罪については、司法審査がなされているとは言えないため、適法な逮捕が前置していないので違法になる。", "arts": [], "first": "H28-38"}, {"id": "H28-39", "y": "H28", "sn": 2, "sc": "場面設定2（2日目）", "q": "常にできないか。", "a": "住居侵入と殺人が、公訴事実の単一性があり、実体法上で一罪の関係にあるならば、適法な逮捕前置がなされているといえ、勾留できる。", "arts": [], "first": "H28-38"}, {"id": "H29-10", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "事例成人Bは自分が自殺したいと思い、Aに対してその旨を告げて、Aに毒薬をペットボトルの飲料水に入れるようにお願いして、Aはその通りにBの面前でペットボトルに毒薬を入れてBに渡した。Bは、それを飲んで死亡した。 Bに何らかの犯罪は成立するか。", "a": "成立しない。", "arts": [], "first": "H29-10"}, {"id": "H29-11", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜ成立しないのか。", "a": "自殺は、違法な行為ではあるものの、自殺者本人が自殺することについては期待可能性がないため責任阻却されるから。", "arts": [], "first": "H29-10"}, {"id": "H29-12", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "ではAに何らかの犯罪は成立するか。", "a": "自殺関与罪(202条前段)が成立する。", "arts": ["刑202"], "first": "H29-10"}, {"id": "H29-13", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、なぜBは自殺をしても罪に問われないのに、それに関与したAには犯罪が成立するのだろうか。", "a": "Aについては責任阻却されないため。つまり、違法は連帯するが、責任は個別的に判断されるから。 (上記問は、違法なことを前提に、個別に責任阻却する立場に立たないと詰められる。)", "arts": [], "first": "H29-10"}, {"id": "H29-14", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "事例 3歳の女の子は、Aに対して、「私もお母さんと一緒に死ぬ。」と言っている。そこで、母親であるAは、女の子が自殺できるように毒薬を飲ませたところ、女の子は死亡した。 Aの罪責は?", "a": "普通殺人罪(199条)", "arts": ["刑199", "刑202"], "first": "H29-14"}, {"id": "H29-15", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "それは、先ほどの事例と矛盾するのでは、違いはどこにあるのだろうか。", "a": "同意能力の欠如にある。 3歳の女の子では、事理弁識能力が備わっておらず、自殺の意味を理解し、自殺について自由な意思決定の能力がないので、殺害につき同意があったものとは言えない。そのため、同意が無効であるため、殺人罪が成立する。", "arts": ["刑199", "刑202"], "first": "H29-15"}, {"id": "H29-16", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "事例 Aは医師であり、患者に対して日頃から強い恨みを抱いていた。そこで、自分の下に来た健康体の患者Bに対して、「あなたは余命3ヶ月で、死亡する際には耐え難い苦痛に見舞われて死亡する。しかし、この薬を飲めば、その苦しみから解放されて楽になりますよ。」と告げながら毒薬入りカプセルを渡した。その結果、患者Bはそのカプセルを飲んで死亡した。 Aの罪責は?", "a": "普通殺人罪(199条)", "arts": ["刑199"], "first": "H29-16"}, {"id": "H29-17", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか", "a": "確かに、死亡することにつき黙示の同意があるため自殺関与罪にも思える。しかし、Bはもともと死ぬつもりも必要も全くない状態でありながら、Aから余命3ヶ月である、死ぬ際に耐え難い苦痛に見舞われるなどと言われたため、短期間のうちに死亡することや死ぬ際に耐え難い苦痛に見舞われるならば、楽に死にたいと考えて自殺を決意したものと思われる。これは、Bが自殺行為をするにあたって判断の基礎となる重要な事実に錯誤がある。そのため、Aの真意を知ったならば自殺行為をしなかったといえるため、その決意は真意に沿わない重大な瑕疵ある意思であり、同意は無効である。よって、自殺関与罪ではなく、殺人既遂罪が成立する。", "arts": ["刑199"], "first": "H29-16"}, {"id": "H29-18", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "事例 Bは、Aに対して、人生に疲れたと言うことを伝えた。するとAは、これを機にBだけ死亡させようと考えて、Bに対して「自分も追死する。」と告げた。その結果、BはAの言葉を信じて死亡を決意し、自殺した。この事案につきAの罪責は?", "a": "普通殺人罪(間接正犯)が成立する。", "arts": ["刑199"], "first": "H29-18"}, {"id": "H29-19", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "Bが死亡をすることを決意した決定的事情は、Aが追死すると言った点にある。この部分がBが自殺するにあたっての判断の基礎となった重要な事実であり、この部分が虚偽であることを知っていれば、自殺することを決意しなかったと言える。そのため、Aの真意を知ったならば自殺行為をしなかったと言えるため、その決意は、真意に沿わない重大な瑕疵ある意思であり無効なので、普通殺人罪が成立する。", "arts": ["刑199"], "first": "H29-18"}, {"id": "H29-20", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "判例はあるか。", "a": "ある。", "arts": [], "first": "H29-18"}, {"id": "H29-21", "y": "H29", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、判例は、どのような理由を述べて、結論を導いたのか。", "a": "被害者は被告人の欺もうの結果、被告人の追死を予期して死を決意した・・・その決意は真意に沿わない重大な瑕疵ある意思・・・であるから普通殺人罪に該当する (最高裁判例S33・11・21)", "arts": [], "first": "H29-18"}, {"id": "H29-22", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "公判廷での手続きについて質問します。まず、冒頭手続きは、どのような順序で進行するか。", "a": "人定質問→起訴状朗読→権利告知→罪状認否", "arts": [], "first": "H29-22"}, {"id": "H29-23", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "この起訴状朗読は、すべて読み上げるのか。", "a": "人定事項はすでに明らかになっているため省略できる。そのため、公訴事実、罪名、罰条につき、すべて読み上げる。 (起訴状の記載内容は1人定事項または被告人の特定事項(身体特徴など)2公訴事実3罪名<br>4罰条5身柄拘束の有無)", "arts": ["訴291"], "first": "H29-22"}, {"id": "H29-24", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "なぜ、起訴状朗読するのか。", "a": "裁判の公開原則(憲法82条)と口頭主義の観点から、傍聴人に対して、起訴状記載の内容を明らかにするために読み上げる。 (なお、裁判所には事前に起訴状が提出されているし(刑訴法256条1項)、被告人も起訴状の謄本の送付を受けている(刑訴法271第1項)ため、専ら前記理由による。)", "arts": ["憲82"], "first": "H29-22"}, {"id": "H29-25", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、起訴状記載の被害者の名前を、被害者保護の観点から秘匿したいが、可能か。（公開の法廷で明らかにしないことの可否。起訴状には絶対に記載される。←これは秘匿できないので注意。）", "a": "可能である。(刑訴法290の2)", "arts": ["訴290-2"], "first": "H29-22"}, {"id": "H29-26", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "手続きの流れは?", "a": "1まず、被害者等は、検察官に対して、被害者特定事項の非公開にしたい旨を申出する。<br>2検察官は、意見を付して、これを裁判所に通知する。<br>3裁判所は、被告人または弁護人の意見を聞いて相当と認めるときは、非公開決定する。 &lt;条文&gt; 第290条の2", "arts": ["訴290-2"], "first": "H29-22"}, {"id": "H29-27", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "では検察官は、自らは非公開の必要がないと考えていても、裁判所に通知する必要があるのか。", "a": "ある。この場合には、自らの意見である、非公開の必要がない理由を付して裁判所に通知する。", "arts": ["訴290-2"], "first": "H29-22"}, {"id": "H29-28", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "この場合、被害者特定事項が被告人の防御の観点から極めて重要なのに、明らかにされずに困らないか。", "a": "この場合には、被害者特定事項が記載されている状態の起訴状を示すという方法によれば良い。", "arts": [], "first": "H29-22"}, {"id": "H29-29", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、被告人には黙秘権が保障されるか。", "a": "保障される。", "arts": ["憲38", "訴311"], "first": "H29-22"}, {"id": "H29-30", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "根拠条文は?", "a": "憲法38条1項、刑訴法311条1項", "arts": ["憲38", "訴311"], "first": "H29-22"}, {"id": "H29-31", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、証人には黙秘権は保障されるか。", "a": "されない。", "arts": [], "first": "H29-22"}, {"id": "H29-32", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、証人は一切の事項を証言しなければならないのか。", "a": "証言拒絶事由(144から147、149条)があれば、その限度で証言しなくても良い。", "arts": [], "first": "H29-22"}, {"id": "H29-33", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "例えばどのようなものがある?", "a": "1 公務員の職務上の秘密(144)<br>2 自己が刑事訴追を受ける虞がある場合(146)<br>3 自己の配偶者や3親等以内の血族等が刑事訴追を受ける虞がある場合(147)<br>4 弁護士などの職務上の秘密(149)<br>5 国会議員で議院の承諾がない場合(145)", "arts": ["訴146", "訴147", "訴149"], "first": "H29-22"}, {"id": "H29-34", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、証言拒絶権と黙秘権の範囲に違いはあるか。", "a": "前者は拒絶事由がある限度だが、後者は包括的に拒絶可能なので、後者の方が範囲が広い。", "arts": [], "first": "H29-22"}, {"id": "H29-35", "y": "H29", "sn": 2, "sc": "場面設定2（1日目）", "q": "なぜ違うのか。", "a": "被告人については、防御権を最大限行使させるため、有利不利問わず一切の供述を拒否する権能を与えた。他方、証人は、被告人と異なり証言拒絶事由以外では供述義務を課しても、不利益が乏しく真実発見の要請が強いため。", "arts": [], "first": "H29-22"}, {"id": "H29-36", "y": "H29", "sn": 3, "sc": "場面設定3（2日目）", "q": "事例ある日、道を歩いていたVに対して、Aが、所持していた包丁を突きつけて脅した。なおこれは反抗抑圧程度のものとする。そして、Aは、Vからバッグを強取して逃走した。このとき、この様子を目撃していたWが、Aを追跡した。 AはWから逃走しようとしたが、強取した地点から50メートルの場所で、Wから追いつかれた。そこで、Aは、逮捕を免れるためにWを突き飛ばし、これによって、Wは傷害を負った。 Aに何罪が成立するか。", "a": "強盗致傷罪が成立する。", "arts": ["刑240"], "first": "H29-36"}, {"id": "H29-37", "y": "H29", "sn": 3, "sc": "場面設定3（2日目）", "q": "それは、どの行為についてでしょうか。", "a": "Wを突き飛ばした行為", "arts": ["刑240"], "first": "H29-36"}, {"id": "H29-38", "y": "H29", "sn": 3, "sc": "場面設定3（2日目）", "q": "それはなぜか。", "a": "1強盗の機会には、財物奪取や逃走のために致死傷結果が伴いやすいことが刑事学上顕著であるため、被害者は財物の占有者のみならず、追跡者などの第三者も含むと解されること。<br>2強盗の機会とは、暴行・脅迫との時間的場所的近接性を踏まえつつ、犯意の継続性の有無で判断する。 (cf事後強盗における&lt;窃盗の機会&gt;は被害者の支配領域を脱したか否かであり、異なる) 本件は、距離にして50メートル、Wは、AによるVに対する強盗行為を目撃しており、その状況で逃走したAを追跡しているから、時間的場所的に近接性が認められ、犯意の継続性が認められるから、強盗の機会と言える。そのため、この時に、追跡者であるWになされた暴行行為であるので、強盗致傷罪の実行行為に当たる。", "arts": ["刑240"], "first": "H29-36"}, {"id": "H29-39", "y": "H29", "sn": 3, "sc": "場面設定3（2日目）", "q": "事例では、AがVからバッグを強取して、Wに追跡されたところまでは先の事例と同様とする。ここで追いつかれたAは、Wの面前に包丁を突きつけて脅した。これにより驚愕し畏怖したWは、必死に逃げようとした。しかし、10メートルほど逃げた先で、誤って道端の石に躓いて転び、怪我をした。この間、Aは、Wに包丁を突きつけた地点から動いていない。では、この時にAには強盗致傷罪が成立するか", "a": "成立する。", "arts": ["刑240"], "first": "H29-39"}, {"id": "H29-40", "y": "H29", "sn": 3, "sc": "場面設定3（2日目）", "q": "なぜか。", "a": "まず、手段から直接生じた訳ではないが、強盗の機会においては、致死傷結果が伴いやすいことが刑事学上顕著なので、強盗の機会といえれば、致死傷結果を帰責できる。強盗の機会性に関しては、Aに対するWによる追跡が継続した状況で、Wに対する脅迫行為がなされており、犯意の継続性が認められるため、強盗の機会と言える。確かに、Wの転倒自体は、自らの過失で道端の石に躓いたものであり因果関係が否定されそうとも思える。しかし、Wが転んだ原因は、Aが面前に包丁を突きつけて脅迫したために驚愕し畏怖したから必死に逃げたからである。つまり、Wの転倒は、Aによる包丁突きつけ脅迫行為の危険が現実化したものなので、因果関係が認められる。※この問題が、一番はじめの財物奪取に向けられた暴行脅迫時から生じている場合には、この暴行・脅迫は強盗の手段であるため、機会性の話は述べる必要が一切ないので注意。　今回、機会性の話をしているのは、強盗の暴行・脅迫の後になされた強盗の手段とは別の暴行・脅迫によるものだからである。", "arts": ["刑240"], "first": "H29-39"}, {"id": "H29-41", "y": "H29", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、先ほどの事例を少し変更し、Wが逃げようとした際に、公道上に飛び出したところ、そこを通過していた車に轢かれて怪我をした場合はどうか。", "a": "この場合も強盗致傷罪が成立する。", "arts": ["刑240"], "first": "H29-41"}, {"id": "H29-42", "y": "H29", "sn": 3, "sc": "場面設定3（2日目）", "q": "なぜか。", "a": "まず、包丁突きつけ脅迫行為には、強盗の機会性が認められる。 (*再現の中には、単純に距離が離れているから時間的場所的近接性が否定されて、強盗の機会性を否定する回答があるが誤りである。すなわち、本件は、あくまで行為自体は追跡継続中に面前で行われているから強盗の機会性は認められるのが前提の事例である。→本問は、因果関係の問題である。) (cf密接関連性説が強盗の機会性を、処罰範囲の限定のために絞るのは、全く無関係な事情による致死結果を帰責させないためであるが、この場合の強盗の機会性は、本問のようなケースとは異なる。例えば、犯人が仲間割れして一方が他方に怪我をさせたようなケースでは、強盗の機会性はありそうだが、帰責させるべきではないケースに当たる。) (※因果関係に関しては、激烈暴行後に高速道路侵入し死亡した事件判例も参照。) 確かに、公道上に飛び出す行為は、不相当な逃走手段とも思える。しかし、Aが面前に包丁を突きつけて脅迫するという強度の脅迫を加えたために、驚愕し畏怖したから、Wは必死に逃げるべく冷静な判断能力が失われ、公道上に飛び出すという逃走手段を選ばざるを得ない心理状態に陥ったと言える。（つまり介在事情の異常性はないということ）これは、Aによる脅迫行為から誘発されたものといえ、公道上で車に轢かれるという結果は、 A の行為の危険が現実化したといえるから、因果関係が認められる。よって、強盗致傷罪が成立する。", "arts": ["刑240"], "first": "H29-41"}, {"id": "H29-43", "y": "H29", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、WがAから500メートル逃げたところで石に躓いて転んで怪我をした場合はどうなるか。なお、この場合にも、Aは脅迫した場所から動いていないものとする。 (*再現の中には、単純に距離が離れているから時間的場所的近接性が否定されて、強盗の機会性を否定する回答があるが誤りである。すなわち、本件は、あくまで行為自体は追跡継続中に面前で行われているから強盗の機会性は認められるのが前提の事例である。→本問は、因果関係の問題である。)", "a": "まず、包丁突きつけ脅迫行為には、強盗の機会性が認められる。確かに、Wは脅迫行為を受けて、500メートルもAから逃走し、他方で、この間Aは一歩もその場から動いていないため、客観的には、Aからの逃走が完了しており、因果関係が否定されそうである。しかし、WはAからの脅迫行為によって驚愕し畏怖しており、その心理的状態が継続していたから、Aによる追跡があったか否かに関わらず逃走を続けたのである。そのため、未だ、Aによる脅迫行為によって受けた心理的状態が継続した状況で転倒したから Aの脅迫行為に誘発された結果といえ、行為の危険が現実化したといえるから、因果関係が認められる。", "arts": [], "first": "H29-43"}, {"id": "H29-44", "y": "H29", "sn": 4, "sc": "場面設定4（2日目）", "q": "事例ある日、公道上に駐車されていたV所有の自動車の運転席のガラスが割られ、車内にあったバッグが盗まれるという110番通報があった。 Vによる通報を受けて駆けつけた警察官が捜査を開始したところ、V所有の自動車の直近に、ガラスを割った際に用いられたと思われるバールが落ちていた。警察官は、このバールを本件器物損壊・窃盗事件に関連する物として押収したいと考えた。このときに、警察官が取るべき押収手続きは何か。", "a": "遺留物として領置する。", "arts": ["訴221"], "first": "H29-44"}, {"id": "H29-45", "y": "H29", "sn": 4, "sc": "場面設定4（2日目）", "q": "根拠条文は?", "a": "刑訴法221条 &lt;条文&gt; 第二百二十一条検察官、検察事務官又は司法警察職員は、被疑者その他の者が遺留した物又は所有者、所持者若しくは保管者が任意に提出した物は、これを領置することができる。", "arts": ["訴221"], "first": "H29-44"}, {"id": "H29-46", "y": "H29", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、今回、警察官はバールを押収するにあたって、そのバールがVの自動車の直近に遺留されていたことを証明するために、証拠を収集したいと考えた。この場合の証拠には、どのようなものが考えられるか。", "a": "1被害者Vによる供述つまり、被害前には落ちてなかったが被害後には落ちていたこと、自分の物ではないことの供述を得て、これを調書化する。<br>2遺留されている状況の写真撮影<br>3バール自体にガラスが付着している箇所があるか確認し、その箇所の写真撮影", "arts": [], "first": "H29-44"}, {"id": "H29-47", "y": "H29", "sn": 4, "sc": "場面設定4（2日目）", "q": "この場合における公道上の写真撮影は、無令状で行うことができるか。", "a": "できる。実況見分(刑訴法197条1項本文、321条3項、犯罪捜査規範104条)としてできるので、令状は不要。", "arts": ["訴197"], "first": "H29-44"}, {"id": "H29-48", "y": "H29", "sn": 5, "sc": "場面設定5（2日目）", "q": "事例本件器物損壊・窃盗事件に関して、犯人らしき人物としてAが浮上した。警察官は、領置されたバールがAのものであることを証明するために、DNA鑑定を行いたいと考えた。そのための対照資料を集めるべく、警察官は、A宅近くの路上にある屋外ゴミ置場に捨てられていたAが出したゴミ袋を無令状で持ち帰った。この行為は適法か。", "a": "遺留物の領置として、適法である。", "arts": ["訴221"], "first": "H29-48"}, {"id": "H29-49", "y": "H29", "sn": 5, "sc": "場面設定5（2日目）", "q": "なぜか", "a": "すでにゴミ袋について、Aにより不要物として占有が放棄されており遺留物に当たる。また、ゴミ袋は、通常、他人にその内容が見られることはないという期待があるにしても、A に本件関与の嫌疑があり犯人性の証明のため、捜査の必要があるから、領置できる。 &lt;判例&gt; 最高裁H20.4.15 &lt;事例&gt; 被告人に1強盗殺人等の合理的な疑いがある場合に、2被告人及びその妻が3公道上のごみ集積所に出したごみ袋を回収し、その中身を確認して、4事件関係者が着用していたものと類似するダウンベスト等を領置。 &lt;判旨&gt; 「被告人及びその妻は、これらを入れたごみ袋を不要物として公道上のごみ集積所に排出し、その占有を放棄していたものであって、排出されたごみについては、通常、そのまま収集されて他人にその内容が見られることはないという期待があるとしても、捜査の必要がある場合には、刑訴法221条により、これを遺留物として領置することができる」として適法性肯定。", "arts": ["訴221"], "first": "H29-48"}, {"id": "H29-50", "y": "H29", "sn": 5, "sc": "場面設定5（2日目）", "q": "では、今後は、Aがマンションに居住していたとする。この場合に、Aがマンションの敷地内にあるゴミ置場に捨てたゴミ袋を押収したいが、どのような押収手続きをとるべきか。", "a": "1ゴミ袋には、マンション管理者に占有があるから、保管者として、任意提出を受ける。<br>2捜索差押許可状(刑訴法222条1項本文、99条1項準用)を得て、(捜索して発見されれば)差押えする。", "arts": ["訴221"], "first": "H29-48"}, {"id": "H29-51", "y": "H29", "sn": 5, "sc": "場面設定5（2日目）", "q": "では、捜査機関は、ゴミ袋を適法に押収したとする。このゴミ袋の中身を確認して、AのDNA鑑定につかえそうな物を探したいと考えた。これは、無令状ですることができるか。", "a": "できる。", "arts": ["訴111"], "first": "H29-48"}, {"id": "H29-52", "y": "H29", "sn": 5, "sc": "場面設定5（2日目）", "q": "なぜか。", "a": "捜索差押または領置に伴う必要な処分としてできる。中身を確認することで、本件の証拠物か否か判別でき、占有継続が必要か判断できるため、必要な処分と言えるから。", "arts": ["訴111"], "first": "H29-48"}, {"id": "H29-53", "y": "H29", "sn": 5, "sc": "場面設定5（2日目）", "q": "根拠条文は?", "a": "1領置なら、必要な処分(刑訴法222条1項、111条2項準用)<br>2捜索差押なら、必要な処分(刑訴法222条1項、111条1項準用) &lt;条文&gt; 第百十一条差押状、記録命令付差押状又は捜索状の執行については、錠をはずし、封を開き、その他必要な処分をすることができる。公判廷で差押え、記録命令付差押え又は捜索をする場合も、同様である。<br>2 前項の処分は、押収物についても、これをすることができる。", "arts": ["訴111"], "first": "H29-48"}, {"id": "H29-54", "y": "H29", "sn": 6, "sc": "場面設定6（2日目）", "q": "では、その後、Aは、本件器物損壊・窃盗事件に関して逮捕勾留された後、同一の公訴事実をもって起訴された。この場合にAの勾留はどうなるか。", "a": "検察官が何ら勾留請求せずとも、自動的に、被告人勾留へ切り替わる。 (刑訴法60条2項) ※検察官には被疑者勾留と異なり、被告人の勾留請求権限がないため。", "arts": ["訴60"], "first": "H29-54"}, {"id": "H29-55", "y": "H29", "sn": 6, "sc": "場面設定6（2日目）", "q": "では、その被告人勾留は、どの程度の期間になるのか。", "a": "公訴の提起があった日から二か月。", "arts": ["訴60"], "first": "H29-54"}, {"id": "H29-56", "y": "H29", "sn": 6, "sc": "場面設定6（2日目）", "q": "では、二ヶ月経過後に、裁判官がさらに勾留の必要があると判断した場合はどうか。", "a": "特に継続の必要がある場合には、具体的にその理由を付した決定で、一ヶ月ごとに更新する。 &lt;条文&gt; 第六十条<br>1 裁判所は、被告人が罪を犯したことを疑うに足りる相当な理由がある場合で、左の各号の一にあたるときは、これを勾留することができる。一~三省略<br>2 勾留の期間は、公訴の提起があつた日から二箇月とする。特に継続の必要がある場合においては、具体的にその理由を附した決定で、一箇月ごとにこれを更新することができる。但し・・。", "arts": ["訴60"], "first": "H29-54"}, {"id": "H29-57", "y": "H29", "sn": 6, "sc": "場面設定6（2日目）", "q": "では、Aの弁護人は、起訴されたAについて、保釈の請求をしたいと考えた。この場合、保釈の請求は、誰に対してするべきか。", "a": "第一回公判期日前は、受訴裁判所を構成する裁判官以外の裁判官、第一回公判期日後は、受訴裁判所に行う。", "arts": ["訴280", "規187", "訴256-6"], "first": "H29-54"}, {"id": "H29-58", "y": "H29", "sn": 6, "sc": "場面設定6（2日目）", "q": "では、第一回公判期日前と期日後で、請求先が異なる理由は?条文は?", "a": "1第一回公判期日前までは、刑訴法280条1項、規則187条1項により、請求先が受訴裁判所を構成しない裁判官とされている。<br>2予断排除のために、起訴状一本主義(256条6項)がとられているのに、第一回公判期日前までの間に、受訴裁判所を構成する裁判官が証拠に触れてしまうと、予断が生じてしまうから、これを防ぐため(規則187条4項但し書き)。 &lt;条文&gt; 刑訴法第280条<br>1公訴の提起があつた後第一回の公判期日までは、勾留に関する処分は、裁判官がこれを行う。 (勾留に関する処分をすべき裁判官) 規則第187条<br>1 公訴の提起があつた後第一回の公判期日までの勾留に関する処分は、公訴の提起を受けた裁判所の裁判官がこれをしなければならない。但し、事件の審判に関与すべき裁判官は、その処分をすることができない。<br>2・3省略<br>4 裁判官は、第一項の処分をするについては、検察官、被告人又は弁護人の出頭を命じてその陳述を聴くことができる。必要があるときは、これらの者に対し、書類その他の物の提出を命ずることができる。但し、事件の審判に関与すべき裁判官は、事件につき予断を生ぜしめる虞のある書類その他の物の提出を命ずることができない。<br>5 省略", "arts": ["訴280", "規187", "訴256-6"], "first": "H29-54"}, {"id": "H29-59", "y": "H29", "sn": 6, "sc": "場面設定6（2日目）", "q": "では、裁判所は、Aに対して接見禁止をつけました。ですが、Aの弁護人は、ある日、Aの父親から電話でも良いから直接Aを励ましてやりたいと言われた。そこで、弁護人は、Aと接見した際に、Aの父親と電話をつないでAと父親を直接通話させた。このような行為が許されるか。", "a": "許されない。", "arts": ["訴81", "職14", "職5"], "first": "H29-59"}, {"id": "H29-60", "y": "H29", "sn": 6, "sc": "場面設定6（2日目）", "q": "なぜか。", "a": "接見禁止(刑訴法８１条)がつけられているのに、これを実質的に無に帰すような行為であるため、違法行為の助長(弁護士職務基本規程14条)に当たるし、公正な職務行為といえない(同規程5条)ため。", "arts": ["訴81", "職14", "職5"], "first": "H29-59"}, {"id": "H30-01", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "<b>事例</b><br>Aは、夫Bが外出している間、Bが所有し、生活の用に供している木造建物の玄関周りにガソリンをまき、ライターで新聞紙に火をつけてガソリンに引火させた。<br>その結果、木造建物は全焼した。 Aに何罪が成立するか。", "a": "現住建造物等放火既遂罪", "arts": ["刑108"], "first": "H30-01"}, {"id": "H30-02", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "条文は?", "a": "刑法108条", "arts": ["刑108"], "first": "H30-01"}, {"id": "H30-03", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、Aが、Bが所有し、生活に利用していない木造の建造物を全焼させた。<br>なお、Bは、このことについて同意していた。この場合は、何罪が成立するか。", "a": "自己所有非現住建造物等放火罪", "arts": ["刑109"], "first": "H30-01"}, {"id": "H30-04", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "条文は?", "a": "刑法109条2項", "arts": ["刑109"], "first": "H30-01"}, {"id": "H30-05", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "その理由は?", "a": "建造物は、B所有であるため、他人所有であり、1項によるとも思える。<br>しかし、1項と2項で罰則の軽重に差があるのは、後者は、他人の所有権侵害という財産的側面についての法益侵害がないからである。本件では、Bが同意していることで、所有権侵害という財産的側面についての法益侵害につき放棄があるため、その点の法益侵害がないから、自己所有と同じ扱いができる。", "arts": ["刑109"], "first": "H30-01"}, {"id": "H30-06", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜ不可罰ではないのか。", "a": "放火罪は、公共危険犯という性格もあるため、Bの同意では財産的側面についての放棄は可能だが、<b>公共の危険については放棄できない</b>ため。", "arts": ["刑109"], "first": "H30-01"}, {"id": "H30-07", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、所有権が放棄された建造物を放火して全焼させた場合は?", "a": "無主物の場合、先ほど同様に、所有権侵害という財産的側面についての法益侵害がないので、自己所有と同じ扱いをしてよく、109条2項でよい。", "arts": ["刑109"], "first": "H30-01"}, {"id": "H30-08", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "<b>事例</b><br>Aは、夫Bが外出している間、Bが所有し、生活の用に供している木造建物の玄関周りにガソリンをまいた後、ライターで、所持していた新聞紙に火をつけ、まいたガソリンに火が付いた新聞紙を近づけたが、火はつかなかった。 Aに何罪が成立するか。", "a": "現住建造物等放火<b>未遂罪</b>(刑法108、112条)", "arts": ["刑112"], "first": "H30-08"}, {"id": "H30-09", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、放火罪の実行の着手時期をどのように考えるか。", "a": "目的物を焼損させる現実的危険性を惹起した時点", "arts": [], "first": "H30-08"}, {"id": "H30-10", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、ガソリンを撒いたが、火はつけなかった場合に、放火罪の実行の着手はあるか。", "a": "ある。", "arts": [], "first": "H30-08"}, {"id": "H30-11", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "ガソリンは揮発性が高く、引火性が強いため。", "arts": [], "first": "H30-08"}, {"id": "H30-12", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、灯油だった場合はどうか。", "a": "灯油は揮発性が低いため、実行の着手は認められず、予備罪(113条)が成立するに留まる<br><b>(現住建造物等放火)</b><br><b>第百八条</b><br>放火して、現に人が住居に使用し又は現に人がいる建造物、汽車、電車、艦船又は鉱坑を焼損した者は、死刑又は無期若しくは五年以上の懲役に処する。 (非現住建造物等放火) 第百九条放火して、現に人が住居に使用せず、かつ、現に人がいない建造物、艦船又は鉱坑を焼損した者は、二年以上の有期懲役に処する。<br>2 前項の物が自己の所有に係るときは、六月以上七年以下の懲役に処する。ただし、公共の危険を生じなかったときは、罰しない。<br><b>(未遂罪)</b><br><b>第百十二条</b><br>第百八条及び第百九条第一項の罪の未遂は、罰する。<br><b>(予備)</b><br><b>第百十三条</b><br>第百八条又は第百九条第一項の罪を犯す目的で、その予備をした者は、二年以下の懲役に処する。ただし、情状により、その刑を免除することができる。<br><b>(差押え等に係る自己の物に関する特例)</b><br><b>第百十五条</b><br>第百九条第一項及び第百十条第一項に規定する物が自己の所有に係るものであっても、差押えを受け、物権を負担し、賃貸し、配偶者居住権が設定され、又は保険に付したものである場合において、これを焼損したときは、他人の物を焼損した者の例による。", "arts": ["刑113"], "first": "H30-08"}, {"id": "H30-13", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "<b>事例</b><br>Aは、夫Bが外出している間、Bが所有し、生活の用に供している木造建物の玄関周りにガソリンをまいた後、ライターで、所持していた新聞紙に火をつけ用とした。<br>ここで、通行人Cが、携帯電話を取り出し通話しながら、Bの建物の前の通りをBの建物方向に近づいて歩いてきたので、Aは、Cが携帯電話で、放火の様子を撮影して警察に通報するのではないかと考えて、火をつけるのを止めた。<br>この場合、刑法43条但し書きの「自己の意思により」に当たるか。", "a": "当たらない。", "arts": ["刑43"], "first": "H30-13"}, {"id": "H30-14", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、あなたは、自己の意思により、についてどのような見解に立つか。", "a": "行為者の主観的にみて、<b>やろうと思えばできたがあえてやらなかった</b>と言える場合(主観説)<br>(*外部的事情に直面して中止を決意するのが通例なので、このような場合でも自己の意思によりと言えるかどうかが問題とされなければならない。(基本刑法P293)", "arts": ["刑43"], "first": "H30-13"}, {"id": "H30-15", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "本件に当てはめてみよ。", "a": "Aの主観としては、通行人Cが携帯電話を取り出し通話しながら、Bの建物の前の通りを、Bの建物方向に近づいて歩いてきたのを見て、携帯電話で放火の様子を撮影の上、警察に通報されるのではないかと考えて火をつけるのをやめた。そのため、これ以上の犯行継続は、警察に通報されるかもしれないので、やろうと思ってもできなかったからやめたに過ぎない。よって、自己の意思により、とは言えない。", "arts": ["刑43"], "first": "H30-13"}, {"id": "H30-16", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、別の説は何があるか。", "a": "客観説(他には、限定主観説がある。)", "arts": [], "first": "H30-13"}, {"id": "H30-17", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、客観説はどのように判断するのか。", "a": "<b>一般人を基準</b>にして、<b>行為者と同じ状況に置かれた一般人ならば、社会経験上中止するのが通例と言えるかどうか</b>による。<br>(中止の動機となった外部的事情または内部的事情が経験上一般に犯罪の完遂を妨げる事情にならないにもかかわらず、行為者は中止したと言えるなら、任意性あり、と言える見解基本刑法P295)", "arts": [], "first": "H30-13"}, {"id": "H30-18", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "客観説にたち、先ほどの事例を検討してみよ。", "a": "行為者と同じ状況に置かれた一般人としては、Aが放火行為をしている状況において、目の前の通りを、Cが携帯電話で通話しながら歩いている状況を見れば、外形上、Cが携帯電話で警察に通報しようとしているようにも見えるし、内心的にも、そのように考えうる。<br>そのため、この状況においては、社会経験上中止するのが通例と言えるので、自己の意思により、と言えない。", "arts": [], "first": "H30-18"}, {"id": "H30-19", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、先ほどの事例で、実際にはCは友達に電話をかけていた場合に過ぎなかった場合は客観説に立った場合、どうか。", "a": "この場合も、前述の状況同様の外形があるため、Cが警察に通報しようとしているもの誤信しうるため、社会経験上中止するのが通例と言えるので、自己の意思により、とは言えない。", "arts": [], "first": "H30-19"}, {"id": "H30-20", "y": "H30", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、Aは、Cの状況如何にかかわらず、Bの目の前でならば放火を続けようと考えていたが、面前にBが居ないので行為を中止した場合はどうか。", "a": "<b>主観説：</b><br>やろうと思えばできたがあえてやらなかったと言えるので、自己の意思により、と言える。<br><b>客観説：</b><br>外部的事情の影響が全くなく、内心的に、Bの目の前でなければ放火しても意味がないと思って止めているため、行為者と同じ状況に置かれた<b>一般人基準でも、社会経験上中止するのが通例</b>なので、自己の意思により、と言える。", "arts": ["刑43"], "first": "H30-19"}, {"id": "H30-21", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "Aが、現住建造物等放火罪で逮捕され、起訴された。しかし、Aは否認している。そこで、目撃者であるCの証人尋問を行うこととなった。ここで、刑事訴訟法上、証人を保護する方法として、どのようなものがあるか。", "a": "1証人等特定事項の秘匿(刑訴法290の3) 　※請求段階と証人尋問段階の違いに留意。（条文が異なる）<br>2付き添い(刑訴法157の4)<br>3被告人や傍聴人との遮蔽措置(刑訴法157の5第1項、2項)<br>4ビデオリンク方式による証人尋問(刑訴法157の6)<br>5被告人の退廷(刑訴法304の2)", "arts": ["訴157-4", "訴157-5"], "first": "H30-21"}, {"id": "H30-22", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "今回は、証人等特定事項の秘匿以外について聞きます。まず、Cが13歳であるため、1人で証言するのは怖いと言った場合には、どの手段が適切か。", "a": "付き添い", "arts": ["訴157-4"], "first": "H30-21"}, {"id": "H30-23", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "なぜか。", "a": "1Cが証言することに際して障害となっているのは、一人で証言するのは怖い、つまり不安だからであるため、付き添いによって、その不安のみ除去すれば足りるから。<br>2また、13歳の子供であり精神的に未成熟なので。逆に、遮蔽措置やビデオリンク方式に寄ったとしても、一人で証言することへの不安が除去されないのであれば、意味がないから。", "arts": ["訴157-4"], "first": "H30-21"}, {"id": "H30-24", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、付き添いとして、誰が適切と考えるか。", "a": "親や親類 &lt;刑訴法第157条の4&gt; 裁判所は、証人を尋問する場合において、証人の年齢、心身の状態その他の事情を考慮し、証人が著しく不安又は緊張を覚えるおそれがあると認めるときは、検察官及び被告人又は弁護人の意見を聴き、その不安又は緊張を緩和するのに適当であり、かつ、裁判官若しくは訴訟関係人の尋問若しくは証人の供述を妨げ、又はその供述の内容に不当な影響を与えるおそれがないと認める者を、その証人の供述中、証人に付き添わせることができる。<br>2 前項の規定により証人に付き添うこととされた者は、その証人の供述中、裁判官若しくは訴訟関係人の尋問若しくは証人の供述を妨げ、又はその供述の内容に不当な影響を与えるような言動をしてはならない。", "arts": ["訴157-4"], "first": "H30-21"}, {"id": "H30-25", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、目撃証人Cは、Aの妻だとする。 Cは、Aの面前では証言するのは心苦しい、復讐も怖いと言っている。この場合は、どの手段をとるべきか。", "a": "被告人との遮蔽措置", "arts": ["訴157-5"], "first": "H30-21"}, {"id": "H30-26", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "なぜか", "a": "Cの証言への障害が、Aの面前であること、復讐が怖いという2点にあることからすれば、被告人との間に遮蔽措置を講じれば、面前性による圧迫が緩和されるため。 (刑訴法157の5第1項)", "arts": ["訴157-5"], "first": "H30-21"}, {"id": "H30-27", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、被告人と、傍聴人との遮蔽との遮蔽の要件に違いはあるか。", "a": "犯罪の性質、証人の年齢、心身の状態という考慮要素は同一。しかし、前者は、証人が被告人の面前において供述するときは圧迫を受け精神の平穏を著しく害されるおそれがあると認める場合という事情も考慮要素になる。後者は、前者の考慮要素と異なり、名誉に対する影響その他の事情が考慮要素となる。", "arts": ["訴157-5"], "first": "H30-21"}, {"id": "H30-28", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、被告人と証人との遮蔽措置に関して、ビデオリンク方式においても遮蔽措置をとることはできるか。", "a": "できる。", "arts": ["訴157-5"], "first": "H30-21"}, {"id": "H30-29", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "根拠は?", "a": "刑訴法157の5第1項カッコ書き。 &lt;刑訴法157の5&gt; 裁判所は、証人を尋問する場合において、犯罪の性質、証人の年齢、心身の状態、「被告人との関係」その他の事情によりにより「証人が被告人の面前(次条第一項及び第二項に規定する方法による場合を含む。*ビデオリンク方式でも遮蔽措置可能、という意味。)において供述するときは圧迫を受け精神の平穏を著しく害されるおそれがあると認める場合」・・相当と認めるときは、検察官及び被告人又は弁護人の意見を聴き、被告人とその証人との間で、一方から又は相互に相手の状態を認識することができないようにするための措置を採ることができる。ただし、被告人から証人の状態を認識することができないようにするための措置・・・弁護人が出頭している場合に限り、採ることができる。<br>2 裁判所は、証人を尋問する場合において、犯罪の性質、証人の年齢、心身の状態、名誉に対する影響その他の事情を考慮し、相当と認めるときは、検察官及び被告人又は弁護人の意見を聴き、傍聴人とその証人との間で、相互に相手の状態を認識することができないようにするための措置を採ることができる。", "arts": ["訴157-5"], "first": "H30-21"}, {"id": "H30-30", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、どちらの要件が厳しいと思うか。", "a": "被告人との遮蔽措置。", "arts": ["憲37", "憲82"], "first": "H30-21"}, {"id": "H30-31", "y": "H30", "sn": 2, "sc": "場面設定2（1日目）", "q": "なぜか。", "a": "当事者主義が取られている刑訴法では、被告人の防御権行使を十全ならしめるため、反対尋問権 (憲法37条2項)を保障する必要が大きい一方、傍聴人との関係では、裁判の公開原則(憲法82条) の要請が問題になるにすぎず、前者の必要が後者に比べて大きいため。", "arts": ["憲37", "憲82"], "first": "H30-21"}, {"id": "H30-32", "y": "H30", "sn": 3, "sc": "場面設定3（2日目）", "q": "事例 Vは、駅前の駐輪場にをかけた自転車を置いていたところ、Aが、この自転車のを壊して、この自転車に乗って自宅に帰った。次の日、Vは、たまたまAの自宅前を通った際に自分の自転車がAあることを発見したため、Aに無断で、この自転車に乗って自宅へ帰った。 Vに成立する犯罪は何かあるか。", "a": "窃盗罪(刑法235条、242条)", "arts": ["刑235", "刑242"], "first": "H30-32"}, {"id": "H30-33", "y": "H30", "sn": 3, "sc": "場面設定3（2日目）", "q": "窃盗罪の要件は?", "a": "客観的構成要件として他人の財物、窃取、主観的構成要件として不法領得の意思、故意。", "arts": ["刑235"], "first": "H30-32"}, {"id": "H30-34", "y": "H30", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、今回の事例では、他人の財物に当たるか。", "a": "当たる。 235条における他人の財物とは、他人の占有する他人の所有物をさす。しかし、242条により「自己の財物」であっても「他人が占有」する物は「他人の財物」とみなされる。そのため、他人の財物に当たる。", "arts": ["刑242"], "first": "H30-34"}, {"id": "H30-35", "y": "H30", "sn": 3, "sc": "場面設定3（2日目）", "q": "この場合、必ず窃盗罪が成立するか。", "a": "構成要件に該当しても、自救行為として違法性阻却される余地がある。", "arts": [], "first": "H30-34"}, {"id": "H30-36", "y": "H30", "sn": 4, "sc": "場面設定4（2日目）", "q": "事例 Aは、Vに対して10万円を貸したところ、返済時期が来たのに、返済してくれなかった。そのため、Aは、Vに対して何度も電話をかけて会おうとしたが、電話に出なかった。そこで、Aは、Vの自宅へ赴いて弁済を求めたところ「Vは返さない、そもそも借りていない。」と言って来た。そのため、Aは「この野郎、返さないというのであれば5万円を追加して15万円を返せ。返さないならぶっ殺す。」と凄んだところ、VはAの態度に畏怖して、15万円を支払った。この場合にAに成立する犯罪は何か。", "a": "15万円全部に、恐喝罪が成立する。(刑法249条)", "arts": ["刑249"], "first": "H30-36"}, {"id": "H30-37", "y": "H30", "sn": 4, "sc": "場面設定4（2日目）", "q": "あなたは、財産的損害についてどのような立場に立つのか。", "a": "個別的財産の罪。", "arts": ["刑249"], "first": "H30-36"}, {"id": "H30-38", "y": "H30", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、恐喝罪の成否に関して、どのような点が問題になると考えるか。", "a": "1構成要件該当性(財産的損害がないのではないか)<br>2違法性阻却(正当な権利行使の範囲内といえるのではないか) の2点が問題になる。", "arts": ["刑249"], "first": "H30-36"}, {"id": "H30-39", "y": "H30", "sn": 4, "sc": "場面設定4（2日目）", "q": "Aは、Vに対して、10万円の債権を有しているが、その場合でも、なぜ、10万円部分に関して恐喝罪が成立するのか。", "a": "10万円についてVという「他人の財物」であるにせよ、本来Vは、Aに対して10万円の返還債務を負うため、財産的損害がないのではないか問題になる。 (1構成要件該当性の問題) 適法に占有している現金を違法な恐喝行為により移転することと、弁済により消滅させることは財産的価値として次元が異なるし(基本刑法各論より。)同額の債権と現金とでは経済的価値が異なる。よって、財産的損害が認められる。 (*他人が別の原因で得た現金は、242条の適用せずに、他人の財物に当たる。) (*他人に貸していた動産については、242条を適用して初めて、他人の財物に当たる。)", "arts": ["刑249"], "first": "H30-36"}, {"id": "H30-40", "y": "H30", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、違法性阻却される余地があるのはなぜか。", "a": "違法性の実質は社会倫理規範違反にもあるため、正当な権利行使の範囲と言えるならば、社会的に相当といえ、違法性阻却の余地があると言えるため。", "arts": [], "first": "H30
