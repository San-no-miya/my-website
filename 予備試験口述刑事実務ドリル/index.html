}, {"id": "H30-q09", "y": "H30", "src": ["H30-12"], "t": "ox", "q": "まいたのが灯油だった場合も、ガソリンと同様に実行の着手が認められる。", "e": "灯油は揮発性が低いので実行の着手は認められず、予備罪（113条）にとどまる。", "arts": ["刑113"], "a": false}, {"id": "H30-q10", "y": "H30", "src": ["H30-13"], "t": "ox", "q": "ガソリンをまいて火をつけようとしたAが、携帯電話で通話しながら近づいてくる通行人Cを見て、撮影・通報されると思って火をつけるのをやめた。これは43条ただし書の「自己の意思により」にあたる。", "e": "", "arts": ["刑43"], "a": false}, {"id": "H30-q11", "y": "H30", "src": ["H30-14", "H30-15"], "t": "mc", "q": "「自己の意思により」について主観説はどう判断するか。そして本件の結論はどうなるか。", "e": "外部的事情に直面して中止するのが通例なので、その場合に「自己の意思」といえるかが問題になる。", "arts": ["刑43"], "c": ["行為者の主観で「やろうと思えばできたが、あえてやらなかった」か／通報を恐れてできなかったのでやめたにすぎず、あたらない", "一般人なら中止するのが通例か／あたる", "悔悟などの広義の後悔によるか／あたる", "やろうと思えばできたか／あたる"]}, {"id": "H30-q12", "y": "H30", "src": ["H30-16", "H30-17"], "t": "mc", "q": "主観説以外の見解とその判断方法の組合せとして正しいものはどれか。", "e": "客観説では、中止するのが通例といえる事情でやめたなら任意性は否定される。ほかに限定主観説がある。", "arts": [], "c": ["客観説：行為者と同じ状況に置かれた一般人なら、社会経験上中止するのが通例か", "客観説：行為者が実際に後悔していたか", "限定主観説：一般人なら中止するのが通例か", "主観説：外部的事情があれば常に任意性を否定する"]}, {"id": "H30-q13", "y": "H30", "src": ["H30-18", "H30-19"], "t": "ox", "q": "客観説に立つと、通行人Cが実際には友人と電話していただけだった場合は、Aの中止は「自己の意思により」にあたる。", "e": "外形上は通報しているように見え、一般人もそう誤信しうるので、中止するのが通例。どちらの場合も「自己の意思により」とはいえない。", "arts": [], "a": false}, {"id": "H30-q14", "y": "H30", "src": ["H30-20"], "t": "ox", "q": "AがCの様子とは関係なく、「Bの目の前でなければ放火しても意味がない」と思って中止した場合は、主観説・客観説のどちらでも「自己の意思により」にあたる。", "e": "外部的事情の影響がない。", "arts": ["刑43"], "a": true}, {"id": "H30-q15", "y": "H30", "src": ["H30-21"], "t": "mc", "q": "刑訴法上の証人保護の方法として挙げなかったものはどれか。", "e": "証人等特定事項の秘匿は、請求段階と尋問段階で条文が異なる点に注意。", "arts": ["訴157-4", "訴157-5"], "c": ["証人の匿名による証言", "証人等特定事項の秘匿（290条の3）", "付添い（157条の4）・遮へい措置（157条の5）", "ビデオリンク方式（157条の6）・被告人の退廷（304条の2）"]}, {"id": "H30-q16", "y": "H30", "src": ["H30-22", "H30-23", "H30-24"], "t": "mc", "q": "目撃者Cが13歳で「1人で証言するのは怖い」と言っている。適切な措置と付添人の組合せはどれか。", "e": "障害は1人で証言する不安なので、付添いでその不安を除けば足りる。遮へいやビデオリンクでは1人で証言する不安は除けない。", "arts": ["訴157-4"], "c": ["付添い（157条の4）／親や親類", "遮へい措置／弁護人", "ビデオリンク方式／検察官", "被告人の退廷／裁判所職員"]}, {"id": "H30-q17", "y": "H30", "src": ["H30-25", "H30-26"], "t": "mc", "q": "目撃者CはAの妻で、「Aの面前で証言するのは心苦しいし、復讐も怖い」と言っている。適切な措置はどれか。", "e": "障害は面前であること・復讐の恐れの2点で、遮へいで面前の圧迫が緩和される。", "arts": ["訴157-5"], "c": ["被告人との間の遮へい措置（157条の5第1項）", "傍聴人との間の遮へい措置（157条の5第2項）", "付添い（157条の4）", "被告人の退廷（304条の2）"]}, {"id": "H30-q18", "y": "H30", "src": ["H30-27"], "t": "ox", "q": "被告人との遮へい措置では「被告人の面前で供述すると圧迫を受け精神の平穏を著しく害されるおそれ」が考慮される。傍聴人との遮へい措置では「名誉に対する影響」が考慮される。", "e": "犯罪の性質、証人の年齢、心身の状態は共通。", "arts": ["訴157-5"], "a": true}, {"id": "H30-q19", "y": "H30", "src": ["H30-28", "H30-29"], "t": "ox", "q": "ビデオリンク方式で尋問する場合にも、被告人との遮へい措置をとることができる。", "e": "157条の5第1項のかっこ書「次条第一項及び第二項に規定する方法による場合を含む」。", "arts": ["訴157-5"], "a": true}, {"id": "H30-q20", "y": "H30", "src": ["H30-30", "H30-31"], "t": "mc", "q": "被告人との遮へいと傍聴人との遮へいのどちらの要件が厳しいか。その理由はどれか。", "e": "被告人から証人が見えないようにする措置は、弁護人が出頭している場合に限られる（157条の5第1項ただし書）。", "arts": ["憲37", "憲82"], "c": ["被告人との遮へい。反対尋問権（憲法37条2項）を十分に保障する必要が、裁判の公開（82条）の要請より大きいから", "傍聴人との遮へい。裁判の公開は絶対的な要請だから", "被告人との遮へい。被告人は証人と面識があることが多いから", "どちらも同じ"]}, {"id": "H30-q21", "y": "H30", "src": ["H30-32"], "t": "mc", "q": "駐輪場のVの自転車をAが鍵を壊して乗り去った。翌日、VはA宅前で自分の自転車を見つけ、Aに無断で乗って帰った。Vに成立しうる罪はどれか。", "e": "", "arts": ["刑235", "刑242"], "c": ["窃盗罪（235条・242条）", "占有離脱物横領罪", "横領罪", "犯罪は成立しえない"]}, {"id": "H30-q22", "y": "H30", "src": ["H30-33"], "t": "ox", "q": "窃盗罪の要件は、客観面が「他人の財物」と「窃取」、主観面が故意と不法領得の意思である。", "e": "", "arts": ["刑235"], "a": true}, {"id": "H30-q23", "y": "H30", "src": ["H30-34"], "t": "ox", "q": "Vの自転車は自己の所有物なので、Vにとって「他人の財物」にあたる余地はない。", "e": "242条により、自己の財物でも他人が占有するものは他人の財物とみなされる。", "arts": ["刑242"], "a": false}, {"id": "H30-q24", "y": "H30", "src": ["H30-35"], "t": "ox", "q": "Vの行為が窃盗罪の構成要件に該当しても、自救行為として違法性が阻却される余地がある。", "e": "", "arts": [], "a": true}, {"id": "H30-q25", "y": "H30", "src": ["H30-36"], "t": "mc", "q": "AはVに10万円を貸したが、Vは「そもそも借りていない」と言って返さない。Aは「5万円上乗せして15万円返せ。返さないならぶっ殺す」とすごみ、畏怖したVから15万円を受け取った。Aの罪責はどれか。", "e": "", "arts": ["刑249"], "c": ["15万円全額について恐喝罪", "上乗せした5万円についてのみ恐喝罪", "脅迫罪のみ", "権利行使なので犯罪は成立しない"]}, {"id": "H30-q26", "y": "H30", "src": ["H30-37", "H30-38"], "t": "mc", "q": "恐喝罪の成否で問題になる2点はどれか。（財産犯は個別財産に対する罪との立場）", "e": "", "arts": ["刑249"], "c": ["財産的損害がないのではないか（構成要件該当性）と、正当な権利行使として違法性が阻却されないか", "Vの畏怖の有無と、交付行為の有無", "Aの故意の有無と、不法領得の意思の有無", "債権の存否と、弁済期の到来"]}, {"id": "H30-q27", "y": "H30", "src": ["H30-39"], "t": "ox", "q": "AはVに10万円の債権を持つので、10万円部分については財産的損害がなく、恐喝罪の構成要件に該当しない。", "e": "適法に占有する現金を恐喝で移転させることと、弁済で債務を消滅させることは財産的価値として次元が異なり、同額の債権と現金でも経済的価値が異なる。", "arts": ["刑249"], "a": false}, {"id": "H30-q28", "y": "H30", "src": ["H30-40", "H30-41"], "t": "ox", "q": "権利行使は、違法性の実質（社会倫理規範違反）から、正当な権利行使の範囲内なら違法性が阻却されうる。しかし本件では、生命への加害を告げ5万円の上乗せを求めているので、違法性は阻却されない。", "e": "弁済期を過ぎて借りていないと言い張るV相手で、1対1・凶器なしという点は相当性を基礎づけうる。", "arts": [], "a": true}, {"id": "H30-q29", "y": "H30", "src": ["H30-42", "H30-43"], "t": "ox", "q": "共謀して恐喝したA（否認）とB（自白）が同じ裁判官のもとで分離して審理される。裁判所は自白しているBの公判を先に進めてよい。", "e": "自白しているBの審理を先に進めると、否認するAに不利な心証が生じかねない。公平な裁判所（憲法37条1項）、予断排除（256条6項）の観点から、Aの審理を先行させるべき。", "arts": ["憲37", "訴256-6"], "a": false}, {"id": "H30-q30", "y": "H30", "src": ["H30-44", "H30-45"], "t": "ox", "q": "Aの公判でCが「事件の翌日、Aが『Vを脅して金を出させた』と言っていた」と証言した。要証事実が「AがVを恐喝し金銭を交付させたこと」なら、この証言は伝聞にあたる。", "e": "恐喝の事実を体験したのはAかVで、内容の真実性が問題になる。", "arts": ["訴320", "訴324"], "a": true}, {"id": "H30-q31", "y": "H30", "src": ["H30-46", "H30-47"], "t": "ox", "q": "同じ証言でも、要証事実が「Aがそのような発言をしたこと」なら伝聞にはあたらない。", "e": "Aの発言はCが直接体験した事実で、Cへの反対尋問で吟味できる。", "arts": ["訴320"], "a": true}, {"id": "H30-q32", "y": "H30", "src": ["H30-48", "H30-49"], "t": "mc", "q": "Bは自分の公判で共謀を認めて有罪となった。その後Aの公判で証人となったBが「Aは何もしていないし共謀もない」と供述した。検察官がまず請求する証拠と条文はどれか。", "e": "", "arts": ["訴321-1"], "c": ["Bの公判調書（321条1項1号）", "Bの公判調書（322条1項）", "Bの公判調書（323条2号）", "Bの供述録取書（328条）"]}, {"id": "H30-q33", "y": "H30", "src": ["H30-50"], "t": "mc", "q": "前問で、Bの公判調書以外に請求できる証拠と条文の組合せとして正しいものはどれか。", "e": "", "arts": ["訴321-1"], "c": ["検面調書（321条1項2号後段）と員面調書（321条1項3号）", "検面調書（322条1項）と員面調書（321条1項2号）", "員面調書（321条3項）のみ", "検面調書（321条4項）のみ"]}, {"id": "R1-q01", "y": "R1", "src": ["R1-01"], "t": "ox", "q": "甲乙が暴行を共謀し、甲はVの腹部に、乙は頭部に暴行を加え、Vは急性硬膜下血腫を負った。甲は腹部しか蹴っていないので、頭部の傷害結果について責任を負わない。", "e": "甲乙に傷害罪の共同正犯が成立する。共同正犯まで言わないと、甲が頭部の傷害結果を負う理由を追及される。", "arts": ["刑60", "刑204"], "a": false}, {"id": "R1-q02", "y": "R1", "src": ["R1-02", "R1-03"], "t": "mc", "q": "店内で見ていた丙が、甲乙と意思の連絡なく、うずくまるVの頭部に暴行を加えた。傷害が乙と丙のどちらの暴行によるか判然としない。丙の罪責はどれか。", "e": "要件：①意思の連絡なく2人以上が故意に暴行 ②同一の機会（時間的場所的近接）③各暴行が傷害を生じさせる危険性 ④傷害の原因となった暴行を特定できない。", "arts": ["刑207"], "c": ["同時傷害の特例（207条）により傷害罪の共同正犯の例による", "利益原則により暴行罪にとどまる", "傷害罪の承継的共同正犯", "傷害罪の幇助犯"]}, {"id": "R1-q03", "y": "R1", "src": ["R1-04"], "t": "mc", "q": "同時傷害の特例（207条）の趣旨はどれか。", "e": "", "arts": ["刑207"], "c": ["被害者保護と立証の困難の回避", "共犯の処罰範囲の限定", "責任主義の徹底", "罪刑の均衡"]}, {"id": "R1-q04", "y": "R1", "src": ["R1-05"], "t": "ox", "q": "丙の暴行は甲乙の暴行と同時ではないが、甲乙が店内に戻った直後に、なお店外でうずくまるVに加えたもので、時間的場所的に近接しているので「同一の機会」といえる。", "e": "", "arts": ["刑207"], "a": true}, {"id": "R1-q05", "y": "R1", "src": ["R1-06"], "t": "ox", "q": "甲乙の暴行の途中から丙が共謀して加わり、傷害がいつ・誰の暴行で生じたか判然としない場合、丙は同時傷害の特例により傷害罪の共同正犯の例による。", "e": "", "arts": ["刑207"], "a": true}, {"id": "R1-q06", "y": "R1", "src": ["R1-07", "R1-08", "R1-09"], "t": "ox", "q": "先行者の犯行に途中から加わった者に共同正犯が成立するかという問題（承継的共同正犯）について、本件の傷害罪では丙に承継的共同正犯を認めると答えた。", "e": "成立しない。傷害罪は結果発生で既遂に達し、加担後の行為が先行者の行為と結果に因果性を与えることはない。先行者の行為で傷害が生じた可能性がある以上、利益原則から遡って帰責できない。", "arts": [], "a": false}, {"id": "R1-q07", "y": "R1", "src": ["R1-10"], "t": "mc", "q": "承継的共同正犯が成立しうる例として挙げたものはどれか。", "e": "積極的利用説に立つと「甲乙の暴行でVがうずくまる状況を丙が利用したのでは」と追及される。因果性を基準にする立場の方が説明しやすい。", "arts": [], "c": ["逮捕監禁罪のような継続犯や、強盗罪のような結合犯", "傷害罪", "殺人罪", "暴行罪"]}, {"id": "R1-q08", "y": "R1", "src": ["R1-11"], "t": "ox", "q": "丙は途中から共謀に加わったので、先行者の甲乙には207条なしに傷害罪の共同正犯が成立する。この場合でも、丙に207条を適用できる（最決令2.9.30）。", "e": "肯定説：207条は共犯類似現象に対処する規定。共犯関係のない場合は適用されるのに、より悪質な共謀加担の場合に適用されないのは不均衡。ただし後行者の暴行に傷害を生じさせる危険性が必要。否定説：先行者に帰責できるなら適用不要。", "arts": ["刑207"], "a": true}, {"id": "R1-q09", "y": "R1", "src": ["R1-12", "R1-13"], "t": "ox", "q": "Vが死亡した場合（傷害致死）にも、同時傷害の特例は適用される。", "e": "立証の困難回避・被害者保護の趣旨が及ぶ（最判昭26.9.20）。", "arts": ["刑207"], "a": true}, {"id": "R1-q10", "y": "R1", "src": ["R1-14", "R1-15"], "t": "ox", "q": "同時傷害の特例は、強盗致傷罪にも適用される。", "e": "「傷害した」という文言から離れすぎ、例外規定なので自由保障機能から限定的に解すべき。", "arts": ["刑207"], "a": false}, {"id": "R1-q11", "y": "R1", "src": ["R1-16"], "t": "mc", "q": "公訴事実は「甲が腹部、乙が頭部を蹴った」だが、裁判所は「甲が頭部、乙が腹部を蹴った」との心証を得た。裁判所はどうすべきか。", "e": "", "arts": ["訴312"], "c": ["行為者が異なるので訴因変更が必要。検察官に訴因変更を促す", "心証どおり認定してよい", "無罪を言い渡す", "公訴棄却する"]}, {"id": "R1-q12", "y": "R1", "src": ["R1-17"], "t": "mc", "q": "前問で、裁判所が訴因変更を促す根拠条文はどれか。", "e": "", "arts": ["訴294", "規208"], "c": ["訴訟指揮（294条）、求釈明（規則208条1項）", "訴因変更命令（312条2項）のみ", "公判前整理手続（316条の2）", "証拠調べ（298条）"]}, {"id": "R1-q13", "y": "R1", "src": ["R1-18"], "t": "mc", "q": "訴因変更の要否の判断枠組みとして答えたものはどれか。", "e": "訴因の機能は審判対象画定機能（主）と防御権告知機能。", "arts": ["訴312"], "c": ["①審判対象の画定に不可欠な事項の変動なら必要 ②それ以外でも防御に重要な事項なら原則必要 ③ただし被告人に不利益でも不意打ちでもなければ不要", "事実に少しでも違いがあれば必ず必要", "罰条が変わる場合だけ必要", "検察官が必要と判断した場合だけ必要"]}, {"id": "R1-q14", "y": "R1", "src": ["R1-19"], "t": "ox", "q": "暴行の行為者や部位が入れ替わる本件では、審判対象の画定に不可欠な事項が変動するので訴因変更が必要である。", "e": "同一機会の暴行なので①には当たらない。行為者・部位は②の防御に重要な事項で、情状の点で不利益、争う機会がなく不意打ちになるので必要。", "arts": ["訴312"], "a": false}, {"id": "R1-q15", "y": "R1", "src": ["R1-20", "R1-21"], "t": "ox", "q": "裁判所が、甲と丙の共謀は認められないが同時傷害の特例が適用されるとの心証を得た場合、訴因変更が必要である。", "e": "防御に重要な事項の変更で、不利益かつ不意打ち。60条と207条で罰条が異なるので①の問題とみる立場や、訴訟指揮の問題とみる立場もある。", "arts": ["刑207"], "a": true}, {"id": "R1-q16", "y": "R1", "src": ["R1-22", "R1-23"], "t": "ox", "q": "検察官が同時傷害の特例の適用も訴因で明示し、被告人側もそれについて防御を尽くしていた場合でも、訴因変更が必要である。", "e": "不要。非不利益・非不意打ちといえる。", "arts": [], "a": false}, {"id": "R1-q17", "y": "R1", "src": ["R1-24"], "t": "mc", "q": "宗教団体代表Aが超能力で治すとして重病のVをホテルの一室に連れて来させたが、治療せず放置した。妻Bの提案でAはVを人気のない場所に運んで遺棄した。Vは通行人に救助された。Aに殺意はない。Aの罪責はどれか。", "e": "218条前段が遺棄、後段が不保護。", "arts": ["刑218"], "c": ["保護責任者遺棄罪（218条前段）", "単純遺棄罪（217条）", "保護責任者遺棄致傷罪", "殺人未遂罪"]}, {"id": "R1-q18", "y": "R1", "src": ["R1-25", "R1-26"], "t": "ox", "q": "保護責任の発生根拠には法令・契約・慣習・条理・先行行為などがあり、加えて排他的支配が必要とされる。本件では、Vをホテルの一室に引き受けた先行行為（危険の引受け）と、A以外に保護できる者がいない排他的支配が認められる。", "e": "判例は形式的な作為義務だけでなく、排他的支配がある場合に作為義務を認める傾向。", "arts": ["刑218"], "a": true}, {"id": "R1-q19", "y": "R1", "src": ["R1-27", "R1-28"], "t": "mc", "q": "前問の事例で、遺棄を提案した妻Bの罪責と根拠条文はどれか。", "e": "", "arts": ["刑65", "刑61"], "c": ["単純遺棄罪の教唆犯（65条2項、61条1項）", "保護責任者遺棄罪の教唆犯（65条1項、61条1項）", "保護責任者遺棄罪の共同正犯（60条）", "犯罪は成立しない"]}, {"id": "R1-q20", "y": "R1", "src": ["R1-29", "R1-30"], "t": "ox", "q": "65条1項を真正身分犯、2項を不真正身分犯の規定と解する立場では、保護責任者遺棄罪（移置の場合）は遺棄罪の加重類型なので、保護責任のないBには2項により単純遺棄罪の教唆犯が成立する。", "e": "元のノートは「不真正不作為犯」と表記しているが、趣旨は不真正身分犯。", "arts": ["刑65"], "a": true}, {"id": "R1-q21", "y": "R1", "src": ["R1-31", "R1-32"], "t": "mc", "q": "Bが、遺棄ではなく「Vをホテルの一室に放置する」ことを提案した場合のBの罪責はどれか。", "e": "217条の遺棄は移置のみ、218条の遺棄は置去りも含む。置去りは217条では処罰されない類型なので、真正身分犯として65条1項による。", "arts": ["刑65", "刑218", "刑217"], "c": ["保護責任者遺棄罪の教唆犯（65条1項、61条1項）", "単純遺棄罪の教唆犯（65条2項）", "犯罪は成立しない", "保護責任者遺棄罪の幇助犯"]}, {"id": "R1-q22", "y": "R1", "src": ["R1-33"], "t": "ox", "q": "65条1項を共犯の成立、2項を科刑の規定とする見解では、当初の事例のBには保護責任者遺棄罪の教唆犯が成立し、単純遺棄罪の教唆犯の刑が科される。", "e": "", "arts": ["刑65"], "a": true}, {"id": "R1-q23", "y": "R1", "src": ["R1-34", "R1-35"], "t": "ox", "q": "自説では移置の教唆は単純遺棄罪、置去りの教唆は保護責任者遺棄罪となり不均衡だとの反論には、科刑で調整すると答えた。罪名の違いは、他説でも罪名と科刑の分離が生じるので、やむを得ないとした。", "e": "", "arts": [], "a": true}, {"id": "R1-q24", "y": "R1", "src": ["R1-36", "R1-37"], "t": "ox", "q": "AがVの容態を見てから殺意を抱き、放置した（Vは救助された）場合、殺意を抱いたのは連れて来させた後なので、殺人未遂罪は成立しない。", "e": "放置して必要な医療を受けさせなかった不作為が殺人の実行行為になり、殺人未遂罪が成立する。", "arts": ["刑199", "刑203"], "a": false}, {"id": "R1-q25", "y": "R1", "src": ["R1-38", "R1-39"], "t": "mc", "q": "不作為の実行行為を認める要件はどれか。", "e": "本件：重病のVを密室に引き受けた先行行為と排他的支配で作為義務あり。119番通報して搬送させるのは容易。", "arts": [], "c": ["作為との構成要件的同価値性（作為義務、作為の可能性・容易性）", "結果の予見可能性のみ", "作為義務のみ", "被害者の同意がないこと"]}, {"id": "R1-q26", "y": "R1", "src": ["R1-40"], "t": "mc", "q": "目撃者Cの検面調書（署名押印あり）の証明力を、Aの弁護人として争いたい。検察官の請求証拠開示の後、どの手段をとるか。", "e": "", "arts": ["訴316-15"], "c": ["類型証拠開示請求（316条の15）", "主張関連証拠開示請求（316条の20）", "証拠保全請求（179条）", "裁定請求（316条の26）"]}, {"id": "R1-q27", "y": "R1", "src": ["R1-41"], "t": "mc", "q": "類型証拠開示請求で弁護人が明らかにする必要がないものはどれか（316条の15第3項）。", "e": "", "arts": ["訴316-15"], "c": ["開示を求める証拠と予定主張との関連性", "316条の15第1項各号の類型", "開示を求める証拠を識別するに足りる事項", "検察官請求証拠の証明力判断に重要であることと、防御の準備に必要な理由"]}, {"id": "R1-q28", "y": "R1", "src": ["R1-42", "R1-43"], "t": "mc", "q": "類型証拠開示の後、弁護人がする手続（316条の16第1項）と、その意見の内容の組合せとして正しいものはどれか。", "e": "", "arts": ["訴316-16"], "c": ["検察官請求証拠への意見を明らかにする／証拠物は異議の有無、供述証拠は同意・不同意など", "予定主張を明らかにする／事実の主張と証拠", "検察官に証拠の取調べ順序を求める／順序の希望", "裁定請求をする／開示の時期・方法"]}, {"id": "R1-q29", "y": "R1", "src": ["R1-44"], "t": "ox", "q": "弁護人がCの検面調書に不同意意見を述べたら、検察官は調書の請求をいったん留保し、Cの証人尋問を請求する。", "e": "尋問の結果、供述不能や相反供述なら321条1項2号前段・後段で請求する。", "arts": ["訴321-1"], "a": true}, {"id": "R1-q30", "y": "R1", "src": ["R1-45"], "t": "ox", "q": "主張関連証拠の開示請求に検察官が応じない場合、弁護人は裁判所に開示命令を求める裁定請求をする。", "e": "開示命令は316条の26第1項。元のノートは316条の25（開示の時期・方法の指定）を引いている。", "arts": ["訴316-26"], "a": true}, {"id": "R1-q31", "y": "R1", "src": ["R1-46"], "t": "mc", "q": "証人Cが「よく覚えていない」と供述したので、検察官が主尋問で「AがVを遺棄したのを見たのではないですか」と尋ねた。弁護人の異議の根拠と理由はどれか。", "e": "", "arts": ["訴309", "規205", "規199-3"], "c": ["309条1項・規則205条1項の法令違反／誘導尋問（規則199条の3第3項本文）", "規則205条1項の不相当／重複尋問", "309条2項／裁判長の処分の違法", "異議は申し立てられない"]}, {"id": "R1-q32", "y": "R1", "src": ["R1-47", "R1-48"], "t": "ox", "q": "裁判所は検察官に釈明を求め（規則208条1項）、検察官は「証人の記憶が明らかでない事項について記憶を喚起するため必要がある」などとして、誘導尋問が許される場合にあたると応じる。", "e": "規則199条の3第3項3号。前の供述と相反・実質的に異なる供述をした場合の6号も挙げられる。", "arts": ["規199-3", "規208"], "a": true}, {"id": "R1-q33", "y": "R1", "src": ["R1-49"], "t": "mc", "q": "異議に理由がない場合、裁判所はどうするか。", "e": "", "arts": ["訴309"], "c": ["決定で棄却する（309条3項、規則205条の5）", "却下の判決をする", "異議を記録にとどめるだけでよい", "検察官に尋問のやり直しを命じる"]}, {"id": "R2-q01", "y": "R2", "src": ["R2-01", "R2-02"], "t": "mc", "q": "覚醒剤使用が疑われるAが尿の任意提出を拒んだ。強制採尿のために請求する令状はどれか。", "e": "最決昭55.10.23。", "arts": ["訴218-6"], "c": ["条件付捜索差押許可状（医師をして医学的に相当な方法で行う旨の記載。218条6項準用）", "鑑定処分許可状のみ", "身体検査令状のみ", "逮捕状"]}, {"id": "R2-q02", "y": "R2", "src": ["R2-03"], "t": "ox", "q": "職務質問を開始したAを、警察官4名で取り囲む態様で約5時間半留め置き、尿の任意提出を説得し続けた。体を直接拘束していないので、この留め置きは任意処分として適法である。", "e": "強制処分（意思に反し重要な権利利益を実質的に制約する処分）には至らない。しかし任意処分の相当性を欠き違法。嫌疑があるので必要性、覚醒剤の体内残存期間から緊急性はある。", "arts": ["警職2", "訴197"], "a": false}, {"id": "R2-q03", "y": "R2", "src": ["R2-04", "R2-05"], "t": "ox", "q": "同じ事例で、職務質問開始から20分後の午前0時20分に令状請求していた場合は、その後の留め置きは適法になりうる。", "e": "強制手続への移行段階では、令状執行に備えた所在確保の必要性が非常に高い。令状請求中であることを伝えることを条件に、必要最小限度なら相当程度強くその場に留まるよう求められる（二分論）。", "arts": [], "a": true}, {"id": "R2-q04", "y": "R2", "src": ["R2-06", "R2-07"], "t": "ox", "q": "逮捕状発付後に逃走したAを、逮捕状を持っていない警察官乙が飲食店で偶然見つけた。乙は逮捕状を持っていないので、Aを逮捕できない。", "e": "緊急執行で逮捕できる（201条2項・73条3項）。急速を要するとき、被疑事実の要旨と逮捕状が発せられている旨を告げて逮捕し、逮捕状はできる限り速やかに示す。", "arts": ["訴201", "訴73"], "a": false}, {"id": "R2-q05", "y": "R2", "src": ["R2-08"], "t": "ox", "q": "乙が「覚せい剤取締法違反」で逮捕すると告げただけでも、Aは任意採尿を求められていたので、被疑事実の要旨の告知として足りる。", "e": "", "arts": ["訴73"], "a": true}, {"id": "R2-q06", "y": "R2", "src": ["R2-09"], "t": "mc", "q": "逮捕されそうになったAが乙を突き飛ばして負傷させた。Aの罪責はどれか。", "e": "", "arts": ["刑95", "刑54"], "c": ["公務執行妨害罪（95条1項）と傷害罪の観念的競合", "公務執行妨害罪のみ", "傷害罪のみ", "公務執行妨害罪と傷害罪の併合罪"]}, {"id": "R2-q07", "y": "R2", "src": ["R2-10", "R2-11"], "t": "ox", "q": "Aが「令状を実際に示されなければ逮捕できない」と思い、乙の逮捕を違法だと認識していた場合、職務の適法性について故意がなく公務執行妨害罪は成立しない。", "e": "成立する。職務の適法性を基礎づける事実は認識しており、評価を誤ったにすぎない法律の錯誤（二分説）。違法性の意識の可能性があるので故意は阻却されない。", "arts": ["刑95", "刑38"], "a": false}, {"id": "R2-q08", "y": "R2", "src": ["R2-12", "R2-13"], "t": "ox", "q": "Aが被疑事実の要旨の告知や逮捕状が発せられている旨を聞き漏らしていた場合は、公務執行妨害罪は成立しない。", "e": "職務の適法性を基礎づける事実自体を認識していないので事実の錯誤となり、故意が阻却される。", "arts": ["刑95"], "a": true}, {"id": "R2-q09", "y": "R2", "src": ["R2-14"], "t": "ox", "q": "Aがたまたま聞き取れたかどうかで結論が変わるのは不当だとの批判には、反対動機を形成する可能性すらなかったのだから故意阻却もやむを得ない、と答えた。", "e": "", "arts": [], "a": true}, {"id": "R2-q10", "y": "R2", "src": ["R2-15"], "t": "mc", "q": "10万円を貸したVが「借りていない」と言って返さないので、Aは「5万円追加して15万円返せ。返さないならぶっ殺す」とすごみ、畏怖したVから15万円を受け取った。Aの罪責はどれか。", "e": "", "arts": ["刑249"], "c": ["15万円全額について恐喝罪（249条1項）", "5万円についてのみ恐喝罪", "脅迫罪", "強盗罪"]}, {"id": "R2-q11", "y": "R2", "src": ["R2-16", "R2-17"], "t": "ox", "q": "財産犯を個別財産に対する罪と解する立場で、本件の恐喝罪の成否では、①財産的損害がないのではないか（構成要件該当性）と②正当な権利行使として違法性が阻却されないか、の2点が問題になる。", "e": "", "arts": ["刑249"], "a": true}, {"id": "R2-q12", "y": "R2", "src": ["R2-18"], "t": "mc", "q": "10万円の債権を持つAにも10万円部分の恐喝罪が成立する理由はどれか。", "e": "Vの現金は242条を使わなくても他人の財物。貸していた動産なら242条を使って初めて他人の財物になる。", "arts": ["刑242"], "c": ["適法に占有する現金を恐喝で移転させることは弁済とは次元が異なり、同額の債権と現金でも経済的価値が異なるから", "242条により、Vの現金はAの財物とみなされるから", "債権の弁済期が到来していないから", "AがVに債権を持つことを証明できないから"]}, {"id": "R2-q13", "y": "R2", "src": ["R2-19", "R2-20"], "t": "ox", "q": "本件では、弁済期を過ぎて「借りていない」と言い張るVに1対1で凶器なく請求している点を考慮しても、生命への加害の告知と5万円の上乗せ請求があるので、正当な権利行使とはいえず違法性は阻却されない。", "e": "違法性の実質は社会倫理規範違反にもあるので、正当な権利行使の範囲内なら阻却の余地がある。", "arts": [], "a": true}, {"id": "R2-q14", "y": "R2", "src": ["R2-21"], "t": "mc", "q": "Vを殺したい乙が甲に「Vを殺して金品を奪え」と唆した。甲は殺害目的を隠して丙に金品強奪の計画を伝え、宅配を装ってVを呼び出し、丙が包丁を突きつけて「金を出せ。出さないと殺すぞ」と言い、Vは丙に金品を交付した。甲は外からドアを押さえていた。甲と丙の罪責はどれか。", "e": "", "arts": ["刑236", "刑130"], "c": ["住居侵入罪と1項強盗既遂罪の共同正犯", "甲は強盗殺人未遂罪、丙は強盗罪", "甲は強盗罪の幇助犯、丙は強盗罪", "恐喝罪の共同正犯"]}, {"id": "R2-q15", "y": "R2", "src": ["R2-22", "R2-23", "R2-24"], "t": "mc", "q": "強盗罪の暴行・脅迫の程度とその判断方法はどれか。", "e": "最判昭24.2.8。", "arts": ["刑236"], "c": ["社会通念上一般に被害者の反抗を抑圧するに足りる程度か、人数・体格・凶器の有無・場所などから客観的に判断する", "その被害者が実際に反抗を抑圧されたかで主観的に判断する", "被害者が畏怖すれば足りる", "行為者が反抗抑圧を意図したかで判断する"]}, {"id": "R2-q16", "y": "R2", "src": ["R2-25"], "t": "ox", "q": "丙だけが脅迫したが、甲がドアを押さえて逃げられない密室で包丁を突きつけ生命への加害を告げているので、客観的に反抗を抑圧する程度の脅迫といえる。", "e": "", "arts": ["刑236"], "a": true}, {"id": "R2-q17", "y": "R2", "src": ["R2-26"], "t": "ox", "q": "Vが豪胆な人物で反抗を抑圧されず、借りた金なので仕方ないと10万円を差し出した場合、強盗は未遂にとどまる。", "e": "実行行為の程度は客観的に判断され、判例上、現実に反抗が抑圧されたことは不要なので強盗既遂罪。主観に焦点を当てると論理矛盾を追及される。", "arts": ["刑236"], "a": false}, {"id": "R2-q18", "y": "R2", "src": ["R2-27"], "t": "mc", "q": "Vが特に臆病で、客観的には反抗抑圧に足りない脅迫で反抗が抑圧された場合について、口述で「説明しやすい」とされた見解はどれか。", "e": "行為者の認識を判断の基礎事情に取り込む説もある。", "arts": ["刑236", "刑249"], "c": ["実行行為は客観的に判断すべきで、強盗罪は成立せず恐喝罪になる", "行為者が臆病さを認識していれば強盗罪になる", "被害者が抑圧された以上、常に強盗罪になる", "不可罰となる"]}, {"id": "R2-q19", "y": "R2", "src": ["R2-28", "R2-29"], "t": "mc", "q": "丙が金品を受け取った後さらにVを脅迫し、逃げたVがベランダから隣室へ移ろうとして転落死した。甲（殺意あり）と丙の罪責はどれか。", "e": "丙の脅迫の時点ではまだ殺人の実行行為がなく、甲も強盗殺人罪にはならない。", "arts": ["刑240"], "c": ["住居侵入罪と強盗致死罪の共同正犯", "甲は強盗殺人罪、丙は強盗致死罪", "住居侵入罪と強盗罪の共同正犯、甲に殺人罪", "丙は強盗致死罪、甲は強盗罪"]}, {"id": "R2-q20", "y": "R2", "src": ["R2-30"], "t": "ox", "q": "240条は殺意のある場合（強盗殺人）を含むと解する。強盗の機会に殺傷が伴いやすいことから重い刑を定め、「よって」の文言もない。含まないと解すると、死の二重評価や、過失犯より刑の下限が軽くなる不均衡が生じる。", "e": "", "arts": ["刑240"], "a": true}, {"id": "R2-q21", "y": "R2", "src": ["R2-31"], "t": "mc", "q": "強盗教唆で逮捕状が出ている乙が、弁護士に「甲の弁護人になり、乙の関与を否定する証言をさせてほしい」と依頼した。問題になる規程として答えなかったものはどれか。", "e": "", "arts": ["職14", "職75"], "c": ["秘密保持義務（23条）", "違法行為の助長（14条）", "自由と独立（20条）・正当な利益の実現（21条）", "偽証のそそのかし（75条）"]}, {"id": "R2-q22", "y": "R2", "src": ["R2-32"], "t": "ox", "q": "併合審理・公判前整理手続で、甲の弁護人が丙の検面調書の一部を不同意とした。この時点で、裁判所はその部分を証拠として採用できる。", "e": "326条の同意がなく、321条1項2号後段にあたるかも確定していない。", "arts": ["訴326", "訴321-1"], "a": false}, {"id": "R2-q23", "y": "R2", "src": ["R2-33"], "t": "ox", "q": "共同被告人丙の検面調書は、322条1項の要件を満たせば甲に対する証拠とすることができる。", "e": "共同被告人は第三者なので321条1項2号による。", "arts": ["訴322", "訴321-1"], "a": false}, {"id": "R2-q24", "y": "R2", "src": ["R2-34"], "t": "ox", "q": "併合審理中の共同被告人丙を、甲の事件の証人として尋問することはできない。", "e": "丙も被告人なので証人適格がない。包括的黙秘権（憲法38条1項、刑訴法311条1項）があり、証言を強制（160条）できない。", "arts": ["訴311"], "a": true}, {"id": "R2-q25", "y": "R2", "src": ["R2-35"], "t": "mc", "q": "丙の供述を甲の事件の証拠にしたい場合の方法はどれか。", "e": "", "arts": ["訴311"], "c": ["被告人質問（311条3項）か、弁論を分離して甲の公判で丙を証人尋問する", "併合したまま丙を証人尋問する", "丙の検面調書を322条1項で請求する", "方法はない"]}, {"id": "R2-q26", "y": "R2", "src": ["R2-36", "R2-37", "R2-38"], "t": "ox", "q": "弁論を分離して丙を証人尋問した後、再び甲と丙の審理を併合することはできない。", "e": "証人として証言拒絶事由以外の供述を強制されたのに、併合後に自己に不利益な認定に使われる懸念がある。職業裁判官なら心証を区別できても、本件は裁判員裁判で裁判員に不当な心証を与えるおそれがある。", "arts": [], "a": true}, {"id": "R3-q01", "y": "R3", "src": ["R3-01", "R3-02"], "t": "ox", "q": "過失運転致死罪で取調べを受ける甲が、警察官丙に「自分の車は盗まれたので私は犯人ではない」と虚偽の供述をした。甲に犯人隠避罪が成立する。", "e": "①文言が「隠避させた者」で犯人以外が前提 ②犯人自身が発見・逮捕を免れようとするのは期待可能性がない。", "arts": ["刑103"], "a": false}, {"id": "R3-q02", "y": "R3", "src": ["R3-03", "R3-04", "R3-05"], "t": "ox", "q": "甲が乙に虚偽供述を依頼し、乙が丙にそのとおり虚偽供述した。乙には犯人隠避罪、甲にはその教唆犯が成立する。", "e": "他人を巻き込む場合にまで期待可能性がないとはいえず、防御権の濫用。", "arts": ["刑103", "刑61"], "a": true}, {"id": "R3-q03", "y": "R3", "src": ["R3-07", "R3-08"], "t": "mc", "q": "犯人隠避罪の保護法益と、害される作用の組合せはどれか。", "e": "", "arts": ["刑103"], "c": ["国家の刑事司法作用／犯人特定作用と犯人拘束作用", "個人の生命・身体／被害者の安全", "公共の信用／文書の信用", "国家の存立／統治機構"]}, {"id": "R3-q04", "y": "R3", "src": ["R3-06", "R3-09"], "t": "ox", "q": "甲が逮捕された後に乙が虚偽供述しても、身柄はすでに確保され拘束作用は害されないので、犯人隠避罪は成立しない。", "e": "成立する。犯人特定作用を害する結果、身柄拘束が解かれることもありうる。", "arts": ["刑103"], "a": false}, {"id": "R3-q05", "y": "R3", "src": ["R3-10", "R3-11"], "t": "ox", "q": "乙が丙に口頭で虚偽供述したことについて、証拠偽造罪が成立する。", "e": "「偽造」は証拠自体の偽造。虚偽供述は偽証罪（169条）に限って罰する趣旨。", "arts": ["刑104", "刑169"], "a": false}, {"id": "R3-q06", "y": "R3", "src": ["R3-12", "R3-13", "R3-14"], "t": "mc", "q": "乙に証拠偽造罪が成立するとされたものはどれか。", "e": "供述録取書への署名押印は内容の確認にすぎず、積極的に証拠自体を偽造したわけではない。", "arts": ["刑104"], "c": ["乙が自ら虚偽内容の書面（供述書）を作成して丙に提出した", "乙が丙に口頭で虚偽の供述をした", "乙が虚偽内容の供述録取書に署名押印した", "いずれの場合も成立しない"]}, {"id": "R3-q07", "y": "R3", "src": ["R3-15"], "t": "ox", "q": "虚偽の供述を、供述者と取調官が共同して供述調書にした場合は、供述書と同じく積極的に証拠自体を偽造したといえ、証拠偽造罪の共同正犯が成立する。", "e": "元のノートの設問は「甲と丙が共同して」と表記。", "arts": ["刑104"], "a": true}, {"id": "R3-q08", "y": "R3", "src": ["R3-16"], "t": "mc", "q": "甲が過失運転致死罪で起訴された。検察官が請求した実況見分調書に弁護人が不同意とした。検察官が依拠する伝聞例外の根拠条文はどれか。", "e": "", "arts": ["訴321-3", "訴326"], "c": ["刑訴法321条3項", "刑訴法321条1項3号", "刑訴法321条4項", "刑訴法323条3号"]}, {"id": "R3-q09", "y": "R3", "src": ["R3-17", "R3-18"], "t": "mc", "q": "321条3項の要件を満たすため検察官がすべきことはどれか。", "e": "", "arts": ["訴321-3"], "c": ["作成した警察官を証人尋問請求し、真正作成供述（適正な実施、内容の真正、作成名義の真正）をさせる", "被告人の同意を得る", "調書に被告人の署名押印を得る", "目撃者を証人尋問する"]}, {"id": "R3-q10", "y": "R3", "src": ["R3-19"], "t": "ox", "q": "検察官が作成者の証人尋問ではなく実況見分調書を請求するのは、口頭より書面の方が内容を正確に伝えやすいからである。", "e": "", "arts": [], "a": true}, {"id": "R3-q11", "y": "R3", "src": ["R3-20", "R3-21"], "t": "ox", "q": "調書に記載された「事故発生地点と目撃地点の距離は○m」という測定結果は、実況見分調書の一部として認定に使える。", "e": "現場の観察結果の記載であり、作成者以外の者の伝聞ではない。", "arts": ["訴321-3"], "a": true}, {"id": "R3-q12", "y": "R3", "src": ["R3-22", "R3-23", "R3-24"], "t": "ox", "q": "調書中の、目撃者Aが「イ地点で甲がスマホを見ていた」と説明した記載（Aの署名押印なし）から、甲の脇見運転を認定できる。", "e": "脇見運転の立証なら内容の真実性が問題になり伝聞。Aの署名押印がなく伝聞例外の要件を満たさない。検察官はAを証人尋問すべき。", "arts": ["訴321-1"], "a": false}, {"id": "R3-q13", "y": "R3", "src": ["R3-25"], "t": "mc", "q": "前問の記載から裁判所が認定できる事実はどれか。", "e": "", "arts": ["訴321-3"], "c": ["イ地点が、Aが「甲がスマホを見ていた地点」と説明した地点であること", "甲がイ地点でスマホを見ていたこと", "Aの説明内容が真実であること", "甲に前方注視義務違反があったこと"]}, {"id": "R3-q14", "y": "R3", "src": ["R3-26", "R3-27"], "t": "mc", "q": "ホテル宿泊中のVが入浴中、同宿のAがVの部屋の鍵を盗み、部屋からカメラを換金目的で持ち去った。Aの罪責と、窃盗罪の主観的構成要件の組合せはどれか。", "e": "客観的構成要件は①他人の占有する財物を②窃取すること。", "arts": ["刑235"], "c": ["窃盗既遂罪／故意と不法領得の意思", "窃盗既遂罪／故意のみ", "占有離脱物横領罪／故意と不法領得の意思", "窃盗未遂罪／故意と換金目的"]}, {"id": "R3-q15", "y": "R3", "src": ["R3-28"], "t": "mc", "q": "「窃取」の定義はどれか。", "e": "", "arts": ["刑235"], "c": ["他人の占有する財物を、占有者の意思に反して自己又は第三者の占有に移転すること", "人を欺いて財物を交付させること", "自己の占有する他人の物を不法に領得すること", "暴行・脅迫を用いて他人の財物を奪取すること"]}, {"id": "R3-q16", "y": "R3", "src": ["R3-29", "R3-30"], "t": "ox", "q": "窃盗罪の占有とは物に対する事実上の支配をいい、占有の事実と占有の意思によって判断される。", "e": "", "arts": ["刑235"], "a": true}, {"id": "R3-q17", "y": "R3", "src": ["R3-31"], "t": "ox", "q": "Vは入浴のため部屋を離れていたので、カメラに対するVの占有は認められない。", "e": "鍵はVが所持し第三者の立入りは許されない（占有の事実）。施錠し一時的に離れたにすぎない（占有の意思）。", "arts": ["刑235"], "a": false}, {"id": "R3-q18", "y": "R3", "src": ["R3-32", "R3-33", "R3-34"], "t": "mc", "q": "Vがカメラを客室に置き忘れたままチェックアウトし、その後Aが無施錠の部屋に入ってカメラを持ち去った。Aは誰の占有を侵害したか。", "e": "チェックアウト後の客室は管理者の管理下に移り公開性も低い。占有の意思も室内の物品に包括的に及ぶ。", "arts": ["刑235"], "c": ["ホテル管理者の占有（窃盗既遂罪）", "Vの占有（窃盗既遂罪）", "誰の占有もない（占有離脱物横領罪）", "清掃担当者個人の占有"]}, {"id": "R3-q19", "y": "R3", "src": ["R3-35", "R3-36", "R3-37"], "t": "mc", "q": "Vがホテルのロビーにカメラを置き忘れて帰宅し、Aが持ち去った。Aの罪責はどれか。", "e": "Vは時間的場所的に離れ、占有の意思もない。ロビーは公開性が高く管理者の包括的占有も及ばない。公開性が全くない場所なら窃盗罪になり得る。", "arts": ["刑254", "刑235"], "c": ["占有離脱物横領罪（254条）", "窃盗罪（235条）", "横領罪（252条）", "犯罪は成立しない"]}, {"id": "R3-q20", "y": "R3", "src": ["R3-38", "R3-39"], "t": "ox", "q": "逮捕・勾留されたAが起訴された。検察官は被告人勾留のため改めて勾留請求しなければならない。", "e": "被告人勾留について検察官に請求権限はなく、自動的に被告人勾留へ切り替わる（被疑者勾留は検察官が請求。204条〜208条の2）。", "arts": ["訴60"], "a": false}, {"id": "R3-q21", "y": "R3", "src": ["R3-40", "R3-41", "R3-42"], "t": "mc", "q": "Aの弁護人として身体解放のため保釈を請求する。起訴後3日（第1回公判期日前）の請求先はどこか（公判担当はJ裁判官）。", "e": "280条1項、規則187条1項。", "arts": ["訴280", "規187"], "c": ["受訴裁判所の裁判官のうち、J裁判官以外の裁判官", "J裁判官", "受訴裁判所（合議体）", "勾留状を発付した裁判官"]}, {"id": "R3-q22", "y": "R3", "src": ["R3-43", "R3-44", "R3-45"], "t": "mc", "q": "前問のような扱いをする理由と、憲法上の根拠の組合せはどれか。", "e": "担当裁判官が先に訴訟資料に触れると予断を抱いたまま裁判をすることになる。刑訴法では256条6項。", "arts": ["憲37", "訴256-6"], "c": ["予断排除／憲法37条1項「公平な裁判所」", "迅速な裁判／憲法37条1項「迅速な」", "公開裁判／憲法82条", "適正手続／憲法31条"]}, {"id": "R3-q23", "y": "R3", "src": ["R3-46"], "t": "mc", "q": "冒頭手続の正しい順序はどれか。", "e": "", "arts": [], "c": ["人定質問（規則196条）→ 起訴状朗読（291条1項）→ 権利告知 → 罪状認否", "起訴状朗読 → 人定質問 → 罪状認否 → 権利告知", "人定質問 → 権利告知 → 起訴状朗読 → 罪状認否", "権利告知 → 人定質問 → 起訴状朗読 → 罪状認否"]}, {"id": "R3-q24", "y": "R3", "src": ["R3-47", "R3-48"], "t": "ox", "q": "被告人には包括的黙秘権（311条1項）があるので、人定質問で氏名を黙秘することは原則として認められる。", "e": "氏名は原則として不利益にならない。氏名から犯人との同一性が判明する場合や、前科が明らかになり累犯加重・常習犯が成立する場合などは例外的に黙秘の対象となりうる。", "arts": ["訴311"], "a": false}, {"id": "R3-q25", "y": "R3", "src": ["R3-49", "R3-50"], "t": "mc", "q": "Aが氏名を黙秘し続けた。まず検察官に氏名を聞くが、検察官も知らない場合はどうするか。", "e": "", "arts": ["訴218-3"], "c": ["逮捕時に撮影したAの写真（218条3項）の提供を受けて特定する", "氏名が判明するまで公判を停止する", "公訴を棄却する", "法廷侮辱として制裁を科す"]}, {"id": "R3-q26", "y": "R3", "src": ["R3-51", "R3-52"], "t": "ox", "q": "Aからカメラの弁償金の立替えを頼まれた弁護人は、原則として応じてはならない。", "e": "依頼者との金銭貸借にあたる（規程25条）。特別の事情があれば別。趣旨は弁護士の独立性と依頼者との信頼関係の確保。", "arts": ["職25"], "a": true}], "arts": {"刑38": {"law": "刑法", "no": "38条1項・3項", "cap": "故意", "text": "1　罪を犯す意思がない行為は、罰しない。ただし、法律に特別の規定がある場合は、この限りでない。<br>3　法律を知らなかったとしても、そのことによって、罪を犯す意思がなかったとすることはできない。ただし、情状により、その刑を減軽することができる。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_38"}, "刑43": {"law": "刑法", "no": "43条", "cap": "未遂減免", "text": "犯罪の実行に着手してこれを遂げなかった者は、その刑を減軽することができる。ただし、<mark>自己の意思により</mark>犯罪を中止したときは、その刑を減軽し、又は免除する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_43"}, "刑54": {"law": "刑法", "no": "54条1項", "cap": "一個の行為が二個以上の罪名に触れる場合等の処理", "text": "<mark>一個の行為が二個以上の罪名に触れ</mark>、又は犯罪の手段若しくは結果である行為が他の罪名に触れるときは、その最も重い刑により処断する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_54"}, "刑60": {"law": "刑法", "no": "60条", "cap": "共同正犯", "text": "二人以上共同して犯罪を実行した者は、すべて正犯とする。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_60"}, "刑61": {"law": "刑法", "no": "61条1項", "cap": "教唆", "text": "人を教唆して犯罪を実行させた者には、正犯の刑を科する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_61"}, "刑65": {"law": "刑法", "no": "65条", "cap": "身分犯の共犯", "text": "1　<mark>犯人の身分によって構成すべき犯罪行為</mark>に加功したときは、身分のない者であっても、共犯とする。<br>2　<mark>身分によって特に刑の軽重があるとき</mark>は、身分のない者には通常の刑を科する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_65"}, "刑95": {"law": "刑法", "no": "95条1項", "cap": "公務執行妨害", "text": "公務員が職務を執行するに当たり、これに対して暴行又は脅迫を加えた者は、三年以下の拘禁刑又は五十万円以下の罰金に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_95"}, "刑103": {"law": "刑法", "no": "103条", "cap": "犯人蔵匿等", "text": "罰金以上の刑に当たる罪を犯した者又は拘禁中に逃走した者を蔵匿し、又は<mark>隠避させた者</mark>は、三年以下の拘禁刑又は三十万円以下の罰金に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_103"}, "刑104": {"law": "刑法", "no": "104条", "cap": "証拠隠滅等", "text": "<mark>他人の刑事事件</mark>に関する証拠を隠滅し、<mark>偽造し</mark>、若しくは変造し、又は偽造若しくは変造の証拠を使用した者は、三年以下の拘禁刑又は三十万円以下の罰金に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_104"}, "刑108": {"law": "刑法", "no": "108条", "cap": "現住建造物等放火", "text": "放火して、<mark>現に人が住居に使用し又は現に人がいる</mark>建造物、汽車、電車、艦船又は鉱坑を焼損した者は、死刑又は無期若しくは五年以上の拘禁刑に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_108"}, "刑109": {"law": "刑法", "no": "109条", "cap": "非現住建造物等放火", "text": "1　放火して、現に人が住居に使用せず、かつ、現に人がいない建造物、艦船又は鉱坑を焼損した者は、二年以上の有期拘禁刑に処する。<br>2　前項の物が<mark>自己の所有に係るとき</mark>は、六月以上七年以下の拘禁刑に処する。ただし、<mark>公共の危険を生じなかったときは、罰しない</mark>。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_109"}, "刑112": {"law": "刑法", "no": "112条", "cap": "未遂罪", "text": "第百八条及び第百九条第一項の罪の未遂は、罰する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_112"}, "刑113": {"law": "刑法", "no": "113条", "cap": "予備", "text": "第百八条又は第百九条第一項の罪を犯す目的で、その予備をした者は、二年以下の拘禁刑に処する。ただし、情状により、その刑を免除することができる。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_113"}, "刑115": {"law": "刑法", "no": "115条", "cap": "差押え等に係る自己の物に関する特例", "text": "第百九条第一項及び第百十条第一項に規定する物が自己の所有に係るものであっても、差押えを受け、物権を負担し、賃貸し、配偶者居住権が設定され、又は<mark>保険に付したもの</mark>である場合において、これを焼損したときは、<mark>他人の物を焼損した者の例による</mark>。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_115"}, "刑130": {"law": "刑法", "no": "130条", "cap": "住居侵入等", "text": "正当な理由がないのに、人の住居若しくは人の看守する邸宅、建造物若しくは艦船に<mark>侵入し</mark>、又は要求を受けたにもかかわらずこれらの場所から退去しなかった者は、三年以下の拘禁刑又は十万円以下の罰金に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_130"}, "刑169": {"law": "刑法", "no": "169条", "cap": "偽証", "text": "<mark>法律により宣誓した証人</mark>が虚偽の陳述をしたときは、三月以上十年以下の拘禁刑に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_169"}, "刑199": {"law": "刑法", "no": "199条", "cap": "殺人", "text": "人を殺した者は、死刑又は無期若しくは五年以上の拘禁刑に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_199"}, "刑202": {"law": "刑法", "no": "202条", "cap": "自殺関与及び同意殺人", "text": "人を教唆し若しくは幇助して自殺させ、又は人をその嘱託を受け若しくはその承諾を得て殺した者は、六月以上七年以下の拘禁刑に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_202"}, "刑203": {"law": "刑法", "no": "203条", "cap": "未遂罪", "text": "第百九十九条及び前条の罪の未遂は、罰する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_203"}, "刑204": {"law": "刑法", "no": "204条", "cap": "傷害", "text": "人の身体を傷害した者は、十五年以下の拘禁刑又は五十万円以下の罰金に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_204"}, "刑207": {"law": "刑法", "no": "207条", "cap": "同時傷害の特例", "text": "二人以上で暴行を加えて人を傷害した場合において、それぞれの暴行による傷害の軽重を知ることができず、又はその傷害を生じさせた者を知ることができないときは、<mark>共同して実行した者でなくても、共犯の例による</mark>。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_207"}, "刑210": {"law": "刑法", "no": "210条", "cap": "過失致死", "text": "過失により人を死亡させた者は、五十万円以下の罰金に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_210"}, "刑217": {"law": "刑法", "no": "217条", "cap": "遺棄", "text": "老年、幼年、身体障害又は疾病のために扶助を必要とする者を遺棄した者は、一年以下の拘禁刑に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_217"}, "刑218": {"law": "刑法", "no": "218条", "cap": "保護責任者遺棄等", "text": "老年者、幼年者、身体障害者又は病者を<mark>保護する責任のある者</mark>がこれらの者を遺棄し、又はその生存に必要な保護をしなかったときは、三月以上五年以下の拘禁刑に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_218"}, "刑219": {"law": "刑法", "no": "219条", "cap": "遺棄等致死傷", "text": "前二条の罪を犯し、よって人を死傷させた者は、傷害の罪と比較して、重い刑により処断する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_219"}, "刑235": {"law": "刑法", "no": "235条", "cap": "窃盗", "text": "他人の財物を<mark>窃取</mark>した者は、窃盗の罪とし、十年以下の拘禁刑又は五十万円以下の罰金に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_235"}, "刑236": {"law": "刑法", "no": "236条", "cap": "強盗", "text": "1　暴行又は脅迫を用いて他人の財物を強取した者は、強盗の罪とし、五年以上の有期拘禁刑に処する。<br>2　前項の方法により、<mark>財産上不法の利益を得</mark>、又は他人にこれを得させた者も、同項と同様とする。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_236"}, "刑238": {"law": "刑法", "no": "238条", "cap": "事後強盗", "text": "窃盗が、<mark>財物を得てこれを取り返されることを防ぎ、逮捕を免れ、又は罪跡を隠滅するために</mark>、暴行又は脅迫をしたときは、強盗として論ずる。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_238"}, "刑240": {"law": "刑法", "no": "240条", "cap": "強盗致死傷", "text": "強盗が、人を負傷させたときは無期又は六年以上の拘禁刑に処し、死亡させたときは死刑又は無期拘禁刑に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_240"}, "刑242": {"law": "刑法", "no": "242条", "cap": "他人の占有等に係る自己の財物", "text": "<mark>自己の財物であっても、他人が占有し</mark>、又は公務所の命令により他人が看守するものであるときは、この章の罪については、<mark>他人の財物とみなす</mark>。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_242"}, "刑244": {"law": "刑法", "no": "244条", "cap": "親族間の犯罪に関する特例", "text": "1　配偶者、直系血族又は同居の親族との間で第二百三十五条の罪、第二百三十五条の二の罪又はこれらの罪の未遂罪を犯した者は、<mark>その刑を免除する</mark>。<br>2　前項に規定する親族以外の親族との間で犯した同項に規定する罪は、告訴がなければ公訴を提起することができない。<br>3　前二項の規定は、親族でない共犯については、適用しない。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_244"}, "刑246": {"law": "刑法", "no": "246条", "cap": "詐欺", "text": "1　人を欺いて財物を交付させた者は、十年以下の拘禁刑に処する。<br>2　前項の方法により、財産上不法の利益を得、又は他人にこれを得させた者も、同項と同様とする。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_246"}, "刑249": {"law": "刑法", "no": "249条", "cap": "恐喝", "text": "1　人を恐喝して財物を交付させた者は、十年以下の拘禁刑に処する。<br>2　前項の方法により、財産上不法の利益を得、又は他人にこれを得させた者も、同項と同様とする。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_249"}, "刑252": {"law": "刑法", "no": "252条1項", "cap": "横領", "text": "<mark>自己の占有する他人の物</mark>を横領した者は、五年以下の拘禁刑に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_252"}, "刑253": {"law": "刑法", "no": "253条", "cap": "業務上横領", "text": "<mark>業務上</mark>自己の占有する他人の物を横領した者は、十年以下の拘禁刑に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_253"}, "刑254": {"law": "刑法", "no": "254条", "cap": "遺失物等横領", "text": "遺失物、漂流物その他<mark>占有を離れた他人の物</mark>を横領した者は、一年以下の拘禁刑又は十万円以下の罰金若しくは科料に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_254"}, "刑256": {"law": "刑法", "no": "256条2項", "cap": "盗品譲受け等", "text": "前項に規定する物を運搬し、<mark>保管し</mark>、若しくは有償で譲り受け、又はその有償の処分のあっせんをした者は、十年以下の拘禁刑及び五十万円以下の罰金に処する。", "url": "https://laws.e-gov.go.jp/law/140AC0000000045#Mp-At_256"}, "憲37": {"law": "憲法", "no": "37条1項・2項", "cap": "", "text": "1　すべて刑事事件においては、被告人は、<mark>公平な裁判所</mark>の迅速な公開裁判を受ける権利を有する。<br>2　刑事被告人は、すべての証人に対して<mark>審問する機会を充分に与へられ</mark>、又、公費で自己のために強制的手続により証人を求める権利を有する。", "url": "https://laws.e-gov.go.jp/law/321CONSTITUTION#Mp-At_37"}, "憲38": {"law": "憲法", "no": "38条1項", "cap": "", "text": "何人も、自己に不利益な供述を強要されない。", "url": "https://laws.e-gov.go.jp/law/321CONSTITUTION#Mp-At_38"}, "憲82": {"law": "憲法", "no": "82条1項", "cap": "", "text": "裁判の対審及び判決は、公開法廷でこれを行ふ。", "url": "https://laws.e-gov.go.jp/law/321CONSTITUTION#Mp-At_82"}, "警職2": {"law": "警職法", "no": "2条1項", "cap": "質問", "text": "警察官は、異常な挙動その他周囲の事情から合理的に判断して何らかの犯罪を犯し、若しくは犯そうとしていると<mark>疑うに足りる相当な理由のある者</mark>又は既に行われた犯罪について、若しくは犯罪が行われようとしていることについて知つていると認められる者を<mark>停止させて質問することができる</mark>。", "url": "https://laws.e-gov.go.jp/law/323AC0000000136#Mp-At_2"}, "訴39": {"law": "刑訴法", "no": "39条1項", "cap": "接見交通権", "text": "身体の拘束を受けている被告人又は被疑者は、弁護人又は弁護人を選任することができる者の依頼により弁護人となろうとする者（弁護士でない者にあつては、第三十一条第二項の許可があつた後に限る。）と<mark>立会人なくして接見</mark>し、又は書類若しくは物の授受をすることができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_39"}, "訴60": {"law": "刑訴法", "no": "60条", "cap": "勾留の理由・期間", "text": "1　裁判所は、被告人が罪を犯したことを疑うに足りる相当な理由がある場合で、左の各号の一にあたるときは、これを勾留することができる。<br>一　被告人が定まつた住居を有しないとき。<br>二　被告人が罪証を隠滅すると疑うに足りる相当な理由があるとき。<br>三　被告人が逃亡し又は逃亡すると疑うに足りる相当な理由があるとき。<br>2　勾留の期間は、<mark>公訴の提起があつた日から二箇月</mark>とする。特に継続の必要がある場合においては、具体的にその理由を附した決定で、<mark>一箇月ごとにこれを更新</mark>することができる。（ただし書略）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_60"}, "訴61": {"law": "刑訴法", "no": "61条", "cap": "勾留と被告事件の告知", "text": "被告人の勾留は、被告人に対し被告事件を告げこれに関する陳述を聴いた後でなければ、これをすることができない。但し、被告人が逃亡した場合は、この限りでない。（被疑者の勾留には207条1項で準用）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_61"}, "訴73": {"law": "刑訴法", "no": "73条3項", "cap": "令状を所持しない場合の執行（緊急執行）", "text": "勾引状又は勾留状を所持しないためこれを示すことができない場合において、<mark>急速を要するとき</mark>は、前二項の規定にかかわらず被告人に対して<mark>公訴事実の要旨及び令状が発せられている旨を告げて</mark>、その執行をすることができる。但し、令状は、<mark>できる限り速やかにこれを示さなければならない</mark>。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_73"}, "訴81": {"law": "刑訴法", "no": "81条", "cap": "接見等の禁止", "text": "裁判所は、逃亡し又は罪証を隠滅すると疑うに足りる相当な理由があるときは、検察官の請求により又は職権で、勾留されている被告人と<mark>第三十九条第一項に規定する者以外の者</mark>との接見を禁じ、又はこれと授受すべき書類その他の物を検閲し、その授受を禁じ、若しくはこれを差し押えることができる。但し、糧食の授受を禁じ、又はこれを差し押えることはできない。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_81"}, "訴87": {"law": "刑訴法", "no": "87条1項", "cap": "勾留の取消し", "text": "勾留の理由又は勾留の必要がなくなつたときは、裁判所は、検察官、勾留されている被告人若しくはその弁護人、法定代理人、保佐人、配偶者、直系の親族若しくは兄弟姉妹の請求により、又は職権で、決定を以て勾留を取り消さなければならない。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_87"}, "訴111": {"law": "刑訴法", "no": "111条", "cap": "押収・捜索と必要な処分", "text": "1　差押状、記録命令付差押状又は捜索状の執行については、<mark>錠をはずし、封を開き、その他必要な処分</mark>をすることができる。公判廷で差押え、記録命令付差押え又は捜索をする場合も、同様である。<br>2　前項の処分は、<mark>押収物についても</mark>、これをすることができる。（捜査機関には222条1項で準用）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_111"}, "訴111-2": {"law": "刑訴法", "no": "111条の2", "cap": "電磁的記録の差押えと協力要請", "text": "差し押さえるべき物が電磁的記録に係る記録媒体であるときは、差押状又は捜索状の執行をする者は、処分を受ける者に対し、<mark>電子計算機の操作その他の必要な協力を求める</mark>ことができる。公判廷で差押え又は捜索をする場合も、同様である。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_111_2"}, "訴146": {"law": "刑訴法", "no": "146条", "cap": "自己の刑事責任と証言拒絶権", "text": "何人も、自己が刑事訴追を受け、又は有罪判決を受ける虞のある証言を拒むことができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_146"}, "訴147": {"law": "刑訴法", "no": "147条", "cap": "近親者の刑事責任と証言拒絶権", "text": "何人も、左に掲げる者が刑事訴追を受け、又は有罪判決を受ける虞のある証言を拒むことができる。<br>一　自己の配偶者、三親等内の血族若しくは二親等内の姻族又は自己とこれらの親族関係があつた者<br>二　自己の後見人、後見監督人又は保佐人<br>三　自己を後見人、後見監督人又は保佐人とする者", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_147"}, "訴149": {"law": "刑訴法", "no": "149条", "cap": "業務上秘密と証言拒絶権", "text": "医師、歯科医師、助産師、看護師、弁護士（外国法事務弁護士を含む。）、弁理士、公証人、宗教の職に在る者又はこれらの職に在つた者は、業務上委託を受けたため知り得た事実で他人の秘密に関するものについては、証言を拒むことができる。（ただし書略）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_149"}, "訴157-4": {"law": "刑訴法", "no": "157条の4", "cap": "証人への付添い", "text": "1　裁判所は、証人を尋問する場合において、証人の年齢、心身の状態その他の事情を考慮し、証人が<mark>著しく不安又は緊張を覚えるおそれ</mark>があると認めるときは、検察官及び被告人又は弁護人の意見を聴き、その不安又は緊張を緩和するのに適当であり、かつ、裁判官若しくは訴訟関係人の尋問若しくは証人の供述を妨げ、又はその供述の内容に不当な影響を与えるおそれがないと認める者を、その証人の供述中、証人に付き添わせることができる。<br>2　（付添人の禁止行為。略）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_157_4"}, "訴157-5": {"law": "刑訴法", "no": "157条の5", "cap": "遮へい措置（抄）", "text": "1　裁判所は、証人を尋問する場合において、犯罪の性質、証人の年齢、心身の状態、被告人との関係その他の事情により、証人が<mark>被告人の面前（次条第一項及び第二項に規定する方法による場合を含む。）</mark>において供述するときは圧迫を受け精神の平穏を著しく害されるおそれがあると認める場合であつて、相当と認めるときは、検察官及び被告人又は弁護人の意見を聴き、被告人とその証人との間で、一方から又は相互に相手の状態を認識することができないようにするための措置を採ることができる。ただし、被告人から証人の状態を認識することができないようにするための措置については、<mark>弁護人が出頭している場合に限り</mark>、採ることができる。<br>2　裁判所は、証人を尋問する場合において、犯罪の性質、証人の年齢、心身の状態、<mark>名誉に対する影響</mark>その他の事情を考慮し、相当と認めるときは、検察官及び被告人又は弁護人の意見を聴き、傍聴人とその証人との間で、相互に相手の状態を認識することができないようにするための措置を採ることができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_157_5"}, "訴197": {"law": "刑訴法", "no": "197条1項", "cap": "任意捜査の原則", "text": "捜査については、その目的を達するため必要な取調をすることができる。但し、<mark>強制の処分は、この法律に特別の定のある場合でなければ、これをすることができない</mark>。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_197"}, "訴201": {"law": "刑訴法", "no": "201条", "cap": "逮捕状による逮捕の手続", "text": "1　逮捕状により被疑者を逮捕するには、逮捕状を被疑者に示さなければならない。<br>2　<mark>第七十三条第三項の規定は、逮捕状により被疑者を逮捕する場合にこれを準用する</mark>。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_201"}, "訴205": {"law": "刑訴法", "no": "205条1項", "cap": "検察官の勾留請求の時間制限", "text": "検察官は、第二百三条の規定により送致された被疑者を受け取つたときは、弁解の機会を与え、留置の必要がないと思料するときは直ちにこれを釈放し、留置の必要があると思料するときは<mark>被疑者を受け取つた時から二十四時間以内</mark>に裁判官に被疑者の勾留を請求しなければならない。（2項以下略）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_205"}, "訴210": {"law": "刑訴法", "no": "210条1項", "cap": "緊急逮捕", "text": "検察官、検察事務官又は司法警察職員は、<mark>死刑又は無期若しくは長期三年以上の拘禁刑</mark>にあたる罪を犯したことを<mark>疑うに足りる充分な理由</mark>がある場合で、<mark>急速を要し、裁判官の逮捕状を求めることができないとき</mark>は、その理由を告げて被疑者を逮捕することができる。この場合には、<mark>直ちに裁判官の逮捕状を求める手続</mark>をしなければならない。逮捕状が発せられないときは、直ちに被疑者を釈放しなければならない。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_210"}, "訴212": {"law": "刑訴法", "no": "212条", "cap": "現行犯人・準現行犯人", "text": "1　現に罪を行い、又は現に罪を行い終つた者を現行犯人とする。<br>2　左の各号の一にあたる者が、<mark>罪を行い終つてから間がないと明らかに認められるとき</mark>は、これを現行犯人とみなす。<br>一　犯人として追呼されているとき。<br>二　贓物又は明らかに犯罪の用に供したと思われる兇器その他の物を所持しているとき。<br>三　身体又は被服に犯罪の顕著な証跡があるとき。<br>四　誰何されて逃走しようとするとき。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_212"}, "訴218-3": {"law": "刑訴法", "no": "218条3項", "cap": "身体拘束中の被疑者の写真撮影等", "text": "身体の拘束を受けている被疑者の指紋若しくは足型を採取し、身長若しくは体重を測定し、又は<mark>写真を撮影</mark>するには、被疑者を裸にしない限り、第一項の令状によることを要しない。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_218"}, "訴218-6": {"law": "刑訴法", "no": "218条6項", "cap": "身体検査の条件", "text": "裁判官は、身体の検査に関し、<mark>適当と認める条件を附することができる</mark>。（強制採尿令状では捜索差押許可状にこの規定を準用して条件を記載する。最決昭55.10.23）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_218"}, "訴219": {"law": "刑訴法", "no": "99条1項（222条1項で準用）", "cap": "差押え", "text": "裁判所は、必要があるときは、<mark>証拠物又は没収すべき物と思料するもの</mark>を差し押えることができる。但し、特別の定のある場合は、この限りでない。（捜査機関の差押えには222条1項で準用。令状の記載事項は219条1項）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_99"}, "訴220": {"law": "刑訴法", "no": "220条1項", "cap": "令状によらない差押え・捜索・検証", "text": "検察官、検察事務官又は司法警察職員は、第百九十九条の規定により被疑者を逮捕する場合又は現行犯人を逮捕する場合において必要があるときは、左の処分をすることができる。第二百十条の規定により被疑者を逮捕する場合において必要があるときも、同様である。<br>一　人の住居又は人の看守する邸宅、建造物若しくは船舶内に入り被疑者の捜索をすること。<br>二　<mark>逮捕の現場で差押、捜索又は検証をすること</mark>。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_220"}, "訴221": {"law": "刑訴法", "no": "221条", "cap": "領置", "text": "検察官、検察事務官又は司法警察職員は、<mark>被疑者その他の者が遺留した物</mark>又は所有者、所持者若しくは<mark>保管者が任意に提出した物</mark>は、これを領置することができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_221"}, "訴248": {"law": "刑訴法", "no": "248条", "cap": "起訴便宜主義", "text": "犯人の性格、年齢及び境遇、犯罪の軽重及び情状並びに犯罪後の情況により訴追を必要としないときは、<mark>公訴を提起しないことができる</mark>。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_248"}, "訴256-6": {"law": "刑訴法", "no": "256条6項", "cap": "起訴状一本主義", "text": "起訴状には、裁判官に事件につき<mark>予断を生ぜしめる虞</mark>のある書類その他の物を添附し、又はその内容を引用してはならない。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_256"}, "訴280": {"law": "刑訴法", "no": "280条1項", "cap": "第一回公判期日前の勾留に関する処分", "text": "公訴の提起があつた後第一回の公判期日までは、勾留に関する処分は、<mark>裁判官</mark>がこれを行う。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_280"}, "訴290-2": {"law": "刑訴法", "no": "290条の2（抄）", "cap": "公開の法廷での被害者特定事項の秘匿", "text": "1　裁判所は、次に掲げる事件を取り扱う場合において、当該事件の被害者等若しくは当該被害者の法定代理人又はこれらの者から委託を受けた弁護士から申出があるときは、<mark>被告人又は弁護人の意見を聴き、相当と認めるとき</mark>は、被害者特定事項（氏名及び住所その他の当該事件の被害者を特定させることとなる事項をいう。以下同じ。）を<mark>公開の法廷で明らかにしない旨の決定</mark>をすることができる。（各号略）<br>2　前項の申出は、<mark>あらかじめ、検察官にしなければならない</mark>。この場合において、検察官は、<mark>意見を付して、これを裁判所に通知する</mark>ものとする。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_290_2"}, "訴291": {"law": "刑訴法", "no": "291条1項", "cap": "起訴状の朗読", "text": "検察官は、まず、起訴状を朗読しなければならない。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_291"}, "訴294": {"law": "刑訴法", "no": "294条", "cap": "訴訟指揮", "text": "公判期日における訴訟の指揮は、裁判長がこれを行う。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_294"}, "訴305": {"law": "刑訴法", "no": "305条1項", "cap": "証拠書類の取調べ", "text": "検察官、被告人又は弁護人の請求により、証拠書類の取調をするについては、裁判長は、その取調を請求した者にこれを<mark>朗読</mark>させなければならない。但し、裁判長は、自らこれを朗読し、又は陪席の裁判官若しくは裁判所書記官にこれを朗読させることができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_305"}, "訴309": {"law": "刑訴法", "no": "309条", "cap": "異議の申立て", "text": "1　検察官、被告人又は弁護人は、<mark>証拠調に関し異議を申し立てる</mark>ことができる。<br>2　検察官、被告人又は弁護人は、前項に規定する場合の外、裁判長の処分に対して異議を申し立てることができる。<br>3　裁判所は、前二項の申立について<mark>決定をしなければならない</mark>。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_309"}, "訴311": {"law": "刑訴法", "no": "311条", "cap": "被告人の黙秘権・被告人質問", "text": "1　被告人は、<mark>終始沈黙し、又は個々の質問に対し、供述を拒むことができる</mark>。<br>2　被告人が任意に供述をする場合には、裁判長は、何時でも必要とする事項につき被告人の供述を求めることができる。<br>3　陪席の裁判官、検察官、弁護人、<mark>共同被告人又はその弁護人</mark>は、裁判長に告げて、前項の供述を求めることができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_311"}, "訴312": {"law": "刑訴法", "no": "312条1項・2項", "cap": "訴因・罰条の変更", "text": "1　裁判所は、検察官の請求があるときは、<mark>公訴事実の同一性を害しない限度</mark>において、起訴状に記載された訴因又は罰条の追加、撤回又は変更を許さなければならない。<br>2　裁判所は、審理の経過に鑑み適当と認めるときは、訴因又は罰条を追加又は変更すべきことを命ずることができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_312"}, "訴316-15": {"law": "刑訴法", "no": "316条の15第1項（抄）", "cap": "類型証拠の開示", "text": "検察官は、前条第一項の規定による開示をした証拠以外の証拠であつて、<mark>次の各号に掲げる証拠の類型のいずれかに該当</mark>し、かつ、<mark>特定の検察官請求証拠の証明力を判断するために重要</mark>であると認められるものについて、被告人又は弁護人から開示の請求があつた場合において、その重要性の程度その他の<mark>被告人の防御の準備のために当該開示をすることの必要性</mark>の程度並びに当該開示によつて生じるおそれのある弊害の内容及び程度を考慮し、相当と認めるときは、速やかに、…開示をしなければならない。（各号、以下略。請求時に明らかにする事項は同条3項）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_316_15"}, "訴316-16": {"law": "刑訴法", "no": "316条の16第1項", "cap": "検察官請求証拠に対する意見", "text": "被告人又は弁護人は、第三百十六条の十三第一項の書面の送付を受け、かつ、第三百十六条の十四第一項並びに前条第一項及び第二項の規定による開示をすべき証拠の開示を受けたときは、検察官請求証拠について、<mark>第三百二十六条の同意をするかどうか又はその取調べの請求に関し異議がないかどうかの意見</mark>を明らかにしなければならない。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_316_16"}, "訴316-20": {"law": "刑訴法", "no": "316条の20第1項（抄）", "cap": "主張関連証拠の開示", "text": "検察官は、第三百十六条の十四第一項並びに第三百十六条の十五第一項及び第二項の規定による開示をした証拠以外の証拠であつて、<mark>第三百十六条の十七第一項の主張に関連する</mark>と認められるものについて、被告人又は弁護人から開示の請求があつた場合において、その関連性の程度その他の被告人の防御の準備のために当該開示をすることの必要性の程度並びに当該開示によつて生じるおそれのある弊害の内容及び程度を考慮し、相当と認めるときは、速やかに、…開示をしなければならない。（以下略）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_316_20"}, "訴316-26": {"law": "刑訴法", "no": "316条の26第1項（抄）", "cap": "証拠開示命令", "text": "裁判所は、検察官が…第三百十六条の十五第一項…若しくは<mark>第三百十六条の二十第一項</mark>…の規定による開示をすべき証拠を開示していないと認めるときは、被告人又は弁護人の請求により、決定で、<mark>当該証拠の開示を命じなければならない</mark>。（以下略）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_316_26"}, "訴316-30": {"law": "刑訴法", "no": "316条の30（抄）", "cap": "被告人側の冒頭陳述", "text": "公判前整理手続に付された事件については、被告人又は弁護人は、証拠により証明すべき事実その他の事実上及び法律上の主張があるときは、第二百九十六条の手続に引き続き、<mark>これを明らかにしなければならない</mark>。（以下略）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_316_30"}, "訴320": {"law": "刑訴法", "no": "320条1項", "cap": "伝聞法則", "text": "第三百二十一条乃至第三百二十八条に規定する場合を除いては、公判期日における供述に代えて書面を証拠とし、又は<mark>公判期日外における他の者の供述を内容とする供述</mark>を証拠とすることはできない。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_320"}, "訴321-1": {"law": "刑訴法", "no": "321条1項", "cap": "被告人以外の者の供述書・供述録取書", "text": "被告人以外の者が作成した供述書又はその者の供述を録取した書面で<mark>供述者の署名若しくは押印のあるもの</mark>は、次に掲げる場合に限り、これを証拠とすることができる。<br>一　裁判官の面前（第百五十七条の六第一項及び第二項に規定する方法による場合を含む。）における供述を録取した書面については、その供述者が死亡、精神若しくは身体の故障、所在不明若しくは国外にいるため公判準備若しくは公判期日において供述することができないとき、又は供述者が公判準備若しくは公判期日において前の供述と異なつた供述をしたとき。<br>二　検察官の面前における供述を録取した書面については、その供述者が死亡、精神若しくは身体の故障、所在不明若しくは国外にいるため公判準備若しくは公判期日において供述することができないとき、又は<mark>公判準備若しくは公判期日において前の供述と相反するか若しくは実質的に異なつた供述をしたとき</mark>。ただし、<mark>公判準備又は公判期日における供述よりも前の供述を信用すべき特別の情況の存するときに限る</mark>。<br>三　前二号に掲げる書面以外の書面については、供述者が死亡、精神若しくは身体の故障、所在不明又は国外にいるため公判準備又は公判期日において供述することができず、かつ、その供述が犯罪事実の存否の証明に欠くことができないものであるとき。ただし、その供述が特に信用すべき情況の下にされたものであるときに限る。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_321"}, "訴321-3": {"law": "刑訴法", "no": "321条3項", "cap": "検証調書", "text": "<mark>検察官、検察事務官又は司法警察職員</mark>の検証の結果を記載した書面は、その供述者が公判期日において証人として尋問を受け、<mark>その真正に作成されたものであることを供述</mark>したときは、第一項の規定にかかわらず、これを証拠とすることができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_321"}, "訴321-4": {"law": "刑訴法", "no": "321条4項", "cap": "鑑定書", "text": "<mark>鑑定の経過及び結果を記載した書面で鑑定人の作成したもの</mark>についても、前項と同様である。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_321"}, "訴322": {"law": "刑訴法", "no": "322条", "cap": "被告人の供述書・供述録取書", "text": "1　<mark>被告人が作成した供述書又は被告人の供述を録取した書面</mark>で被告人の署名若しくは押印のあるものは、その供述が被告人に不利益な事実の承認を内容とするものであるとき、又は特に信用すべき情況の下にされたものであるときに限り、これを証拠とすることができる。但し、被告人に不利益な事実の承認を内容とする書面は、その承認が自白でない場合においても、第三百十九条の規定に準じ、任意にされたものでない疑があると認めるときは、これを証拠とすることができない。<br>2　被告人の公判準備又は公判期日における供述を録取した書面は、その供述が任意にされたものであると認めるときに限り、これを証拠とすることができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_322"}, "訴324": {"law": "刑訴法", "no": "324条", "cap": "伝聞供述", "text": "1　被告人以外の者の公判準備又は公判期日における供述で<mark>被告人の供述をその内容とするもの</mark>については、第三百二十二条の規定を準用する。<br>2　被告人以外の者の公判準備又は公判期日における供述で被告人以外の者の供述をその内容とするものについては、第三百二十一条第一項第三号の規定を準用する。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_324"}, "訴326": {"law": "刑訴法", "no": "326条1項", "cap": "同意書面", "text": "検察官及び被告人が証拠とすることに同意した書面又は供述は、その書面が作成され又は供述のされたときの情況を考慮し相当と認めるときに限り、第三百二十一条乃至前条の規定にかかわらず、これを証拠とすることができる。", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_326"}, "訴429": {"law": "刑訴法", "no": "429条1項（抄）", "cap": "準抗告", "text": "裁判官が左の裁判をした場合において、不服がある者は、簡易裁判所の裁判官がした裁判に対しては管轄地方裁判所に、その他の裁判官がした裁判に対してはその裁判官所属の裁判所にその裁判の取消又は変更を請求することができる。<br>…<br>二　<mark>勾留、保釈、押収又は押収物の還付に関する裁判</mark>（以下略）", "url": "https://laws.e-gov.go.jp/law/323AC0000000131#Mp-At_429"}, "規187": {"law": "刑訴規則", "no": "187条1項", "cap": "勾留に関する処分をすべき裁判官", "text": "公訴の提起があつた後第一回の公判期日までの勾留に関する処分は、公訴の提起を受けた裁判所の裁判官がこれをしなければならない。但し、<mark>事件の審判に関与すべき裁判官は、その処分をすることができない</mark>。", "url": ""}, "規189-2": {"law": "刑訴規則", "no": "189条の2", "cap": "証拠の厳選", "text": "証拠調べの請求は、証明すべき事実の立証に必要な証拠を<mark>厳選して</mark>、これをしなければならない。", "url": ""}, "規199-3": {"law": "刑訴規則", "no": "199条の3第3項", "cap": "主尋問と誘導尋問", "text": "主尋問においては、<mark>誘導尋問をしてはならない</mark>。ただし、次の場合には、誘導尋問をすることができる。<br>一　証人の身分、経歴、交友関係等で、実質的な尋問に入るに先だつて明らかにする必要のある準備的な事項に関するとき。<br>二　訴訟関係人に争のないことが明らかな事項に関するとき。<br>三　<mark>証人の記憶が明らかでない事項についてその記憶を喚起するため必要があるとき</mark>。<br>四　証人が主尋問者に対して敵意又は反感を示すとき。<br>五　証人が証言を避けようとする事項に関するとき。<br>六　<mark>証人が前の供述と相反するか又は実質的に異なる供述をした場合</mark>において、その供述した事項に関するとき。<br>七　その他誘導尋問を必要とする特別の事情があるとき。", "url": ""}, "規205": {"law": "刑訴規則", "no": "205条", "cap": "異議申立の事由", "text": "1　法第三百九条第一項の異議の申立は、法令の違反があること又は相当でないことを理由としてこれをすることができる。但し、<mark>証拠調に関する決定に対しては、相当でないことを理由としてこれをすることはできない</mark>。<br>2　法第三百九条第二項の異議の申立は、法令の違反があることを理由とする場合に限りこれをすることができる。", "url": ""}, "規208": {"law": "刑訴規則", "no": "208条1項", "cap": "釈明", "text": "裁判長は、必要と認めるときは、訴訟関係人に対し、<mark>釈明を求め、又は立証を促す</mark>ことができる。", "url": ""}, "職5": {"law": "職務基本規程", "no": "5条", "cap": "信義誠実", "text": "弁護士は、<mark>真実を尊重し</mark>、信義に従い、誠実かつ公正に職務を行うものとする。", "url": ""}, "職14": {"law": "職務基本規程", "no": "14条", "cap": "違法行為の助長", "text": "弁護士は、詐欺的取引、暴力その他<mark>違法若しくは不正な行為を助長し</mark>、又はこれらの行為を利用してはならない。", "url": ""}, "職22": {"law": "職務基本規程", "no": "22条1項", "cap": "依頼者の意思の尊重", "text": "弁護士は、委任の趣旨に関する<mark>依頼者の意思を尊重</mark>して職務を行うものとする。", "url": ""}, "職23": {"law": "職務基本規程", "no": "23条", "cap": "秘密の保持", "text": "弁護士は、正当な理由なく、依頼者について職務上知り得た秘密を他に漏らし、又は利用してはならない。", "url": ""}, "職25": {"law": "職務基本規程", "no": "25条", "cap": "依頼者との金銭貸借等", "text": "弁護士は、<mark>特別の事情がない限り</mark>、依頼者と金銭の貸借をし、又は自己の債務について依頼者に保証を依頼し、若しくは依頼者の債務について保証をしてはならない。", "url": ""}, "職28": {"law": "職務基本規程", "no": "28条", "cap": "職務を行い得ない事件", "text": "弁護士は、前条に規定するもののほか、次の各号のいずれかに該当する事件については、その職務を行ってはならない。ただし、第一号及び第四号に掲げる事件についてその依頼者が同意した場合、第二号に掲げる事件についてその依頼者及び相手方が同意した場合並びに<mark>第三号に掲げる事件についてその依頼者及び他の依頼者のいずれもが同意した場合</mark>は、この限りでない。<br>一　相手方が配偶者、直系血族、兄弟姉妹又は同居の親族である事件<br>二　受任している他の事件の依頼者又は継続的な法律事務の提供を約している者を相手方とする事件<br>三　<mark>依頼者の利益と他の依頼者の利益が相反する事件</mark><br>四　依頼者の利益と自己の経済的利益が相反する事件", "url": ""}, "職32": {"law": "職務基本規程", "no": "32条", "cap": "不利益事項の説明", "text": "弁護士は、同一の事件について複数の依頼者があってその相互間に利害の対立が生じるおそれがあるときは、事件を受任するに当たり、依頼者それぞれに対し、<mark>辞任の可能性その他の不利益を及ぼすおそれのあることを説明</mark>しなければならない。", "url": ""}, "職42": {"law": "職務基本規程", "no": "42条", "cap": "受任後の利害対立", "text": "弁護士は、複数の依頼者があって、その相互間に利害の対立が生じるおそれのある事件を受任した後、依頼者相互間に<mark>現実に利害の対立が生じたとき</mark>は、依頼者それぞれに対し、速やかに、その事情を告げて、<mark>辞任その他の事案に応じた適切な措置</mark>をとらなければならない。", "url": ""}, "職46": {"law": "職務基本規程", "no": "46条", "cap": "刑事弁護の心構え", "text": "弁護士は、被疑者及び被告人の防御権が保障されていることにかんがみ、その権利及び利益を擁護するため、<mark>最善の弁護活動</mark>に努める。", "url": ""}, "職75": {"law": "職務基本規程", "no": "75条", "cap": "偽証のそそのかし", "text": "弁護士は、<mark>偽証若しくは虚偽の陳述をそそのかし</mark>、又は虚偽と知りながらその証拠を提出してはならない。", "url": ""}}};
const YEARS = Object.keys(DATA.years);
const CARD = Object.fromEntries(DATA.cards.map(c => [c.id, c]));
const ITEM = Object.fromEntries(DATA.items.map(i => [i.id, i]));

const store = {
  get(k, d) { try { const v = localStorage.getItem("kj2-" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kj2-" + k, JSON.stringify(v)); } catch {} }
};
const getSet = k => new Set(store.get(k, []));
const putSet = (k, s) => store.set(k, [...s]);
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
const yl = y => DATA.years[y];
const sceneLabel = c => c.sc.replace("場面設定", "場面");

let pref = { years: store.get("years", ["all"]), order: store.get("order", "順番") };
let run = null;
let keyHandler = null;
document.addEventListener("keydown", e => keyHandler && keyHandler(e));

function inYears(y) { return pref.years.includes("all") || pref.years.includes(y); }
function artsHTML(keys) {
  return keys.map(k => {
    const a = DATA.arts[k];
    const link = a.url ? `<a href="${a.url}" target="_blank" rel="noopener">e-Govで${a.no.match(/^\d+条(?:の\d+)?/)[0]}を開く</a>` : "";
    return `<div class="jo"><div class="h"><span>${a.law} ${a.no}${a.cap ? ` <span class="cap">（${a.cap}）</span>` : ""}</span>${link}</div><p>${a.text}</p></div>`;
  }).join("");
}
function checkBox(kind, id) {
  const on = getSet(kind === "item" ? "chkI" : "chkC").has(id);
  return `<label class="check"><input type="checkbox" id="chk" data-kind="${kind}" data-id="${id}" ${on ? "checked" : ""}><span class="box">✓</span><span class="lbl">要確認リストに入れる</span></label>`;
}
function bindCheck() {
  const el = app.querySelector("#chk");
  if (!el) return;
  el.onchange = () => {
    const k = el.dataset.kind === "item" ? "chkI" : "chkC";
    const s = getSet(k);
    el.checked ? s.add(el.dataset.id) : s.delete(el.dataset.id);
    putSet(k, s);
  };
}
function caseBlock(c) {
  if (c.first === c.id) return "";
  return `<details class="case"><summary>前提の事例</summary><div class="dbody">${CARD[c.first].q}</div></details>`;
}

  keyHandler = null;
  const chkI = getSet("chkI"), chkC = getSet("chkC"), miss = getSet("miss");
  const seenI = getSet("seenI"), seenC = getSet("seenC");
  app.innerHTML = `
    <div class="brand"><div class="seal">口述</div><div><h1>予備口述ドリル 刑事</h1><div class="muted small">平成23年〜令和3年・予備試験口述式試験（刑事）</div></div></div>
    <section class="panel">
      <div class="stats">
        <div class="stat"><b>${seenI.size}/${DATA.items.length}</b><span>ゲームで解いた</span></div>
        <div class="stat"><b>${seenC.size}/${DATA.cards.length}</b><span>カードで見た</span></div>
        <div class="stat"><b>${chkI.size + chkC.size}</b><span>要確認</span></div>
      </div>
    </section>
    <button class="course red" data-go="game"><span class="ic">○×</span><span><b>一問一答ゲーム</b><span class="d">○×と4択で決着をつける。年度を選んで挑戦</span></span><span class="n">${DATA.items.length}問</span></button>
    <button class="course" data-go="flash"><span class="ic">札</span><span><b>フラッシュカード</b><span class="d">本番の問答を表→裏でテンポよく見る</span></span><span class="n">${DATA.cards.length}枚</span></button>
    <button class="course star" data-go="check"><span class="ic">★</span><span><b>要確認リスト</b><span class="d">自分でチェックした問題だけを演習</span></span><span class="n">${chkI.size + chkC.size}件</span></button>
    <button class="course" data-go="miss"><span class="ic">×</span><span><b>間違えた問題の復習</b><span class="d">ゲームで間違えた問題だけ。正解すると外れる</span></span><span class="n">${miss.size}問</span></button>
    <p class="note">条文は令和8年時点の現行法（刑法は拘禁刑施行後）として掲載しています。長い条文は抄録です。正確な文言はe-Gov法令検索で確認してください。学習記録とチェックはこの端末のブラウザにだけ保存されます。</p>
    <button class="ghost" id="reset">学習記録とチェックを消す</button>`;
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => setup(b.dataset.go));
  const rs = app.querySelector("#reset");
  rs.onclick = () => {
    if (rs.dataset.armed) { ["chkI","chkC","miss","seenI","seenC"].forEach(k => store.set(k, [])); home(); }
    else { rs.dataset.armed = "1"; rs.textContent = "もう一度押すと消去します"; }
  };
  scrollTo(0, 0);
}

// ───────── 年度選択などの設定画面
const COURSE = {
  game: { title: "一問一答ゲーム", pool: () => DATA.items, unit: "問" },
  flash: { title: "フラッシュカード", pool: () => DATA.cards, unit: "枚" },
  check: { title: "要確認リスト", pool: null, unit: "件" },
  miss: { title: "間違えた問題の復習", pool: () => { const m = getSet("miss"); return DATA.items.filter(i => m.has(i.id)); }, unit: "問" }
};
function setup(course) {
  keyHandler = null;
  const C = COURSE[course];
  const chkI = getSet("chkI"), chkC = getSet("chkC");
  const all = course === "check" ? [...DATA.items.filter(i => chkI.has(i.id)), ...DATA.cards.filter(c => chkC.has(c.id))] : C.pool();
  const cnt = y => all.filter(x => y === "all" || x.y === y).length;
  const yb = y => `<button type="button" data-y="${y}" class="${y === "all" ? "all" : ""}" aria-pressed="${pref.years.includes(y)}">${y === "all" ? "全年度" : yl(y)}<small>${cnt(y)}${C.unit}</small></button>`;
  const fI = DATA.items.filter(i => chkI.has(i.id) && inYears(i.y)).length;
  const fC = DATA.cards.filter(c => chkC.has(c.id) && inYears(c.y)).length;
  const n = course === "check" ? fI + fC : all.filter(x => inYears(x.y)).length;
  app.innerHTML = `
    <button class="back" id="bk">← ホーム</button>
    <h1 style="font-size:22px">${C.title}</h1>
    <section class="panel">
      <h2>年度</h2>
      <div class="years">${["all", ...YEARS].map(yb).join("")}</div>
      <div class="muted small">複数の年度を選べます。</div>
      <h2>出題順</h2>
      <div class="seg">${["順番","シャッフル"].map(v => `<button type="button" data-o="${v}" aria-pressed="${pref.order === v}">${v}</button>`).join("")}</div>
      <div class="muted small">${pref.order === "順番" ? "本番の問答の流れどおりに出します。" : "ランダムに出します。"}</div>
    </section>
    ${course === "check" ? `
      <section class="panel branch">
        <h2>演習のしかた</h2>
        <button class="primary" id="goF" ${fC ? "" : "disabled"}>フラッシュカードで見る（${fC}枚）</button>
        <button class="primary" id="goG" style="background:var(--navy)" ${fI ? "" : "disabled"}>ゲームで解く（${fI}問）</button>
        <div class="muted small">フラッシュカードでチェックした問答はフラッシュカードに、ゲームでチェックした問題はゲームに入ります。</div>
      </section>`
    : `<button class="primary" id="go" ${n ? "" : "disabled"}>${n ? `${n}${C.unit}をはじめる` : (course === "miss" ? "間違えた問題はありません" : "対象がありません")}</button>`}`;
  app.querySelector("#bk").onclick = home;
  app.querySelectorAll("[data-y]").forEach(b => b.onclick = () => {
    const y = b.dataset.y;
    if (y === "all") pref.years = ["all"];
    else {
      let s = pref.years.filter(v => v !== "all");
      s = s.includes(y) ? s.filter(v => v !== y) : [...s, y];
      pref.years = s.length ? s : ["all"];
    }
    store.set("years", pref.years); setup(course);
  });
  app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { pref.order = b.dataset.o; store.set("order", pref.order); setup(course); });
  const order = l => pref.order === "シャッフル" ? shuffle(l) : l;
  if (course === "check") {
    const f = app.querySelector("#goF"), g = app.querySelector("#goG");
    f.onclick = () => startFlash(order(DATA.cards.filter(c => chkC.has(c.id) && inYears(c.y))), "check");
    g.onclick = () => startGame(order(DATA.items.filter(i => chkI.has(i.id) && inYears(i.y))), "check");
  } else {
    const list = () => order(all.filter(x => inYears(x.y)));
    app.querySelector("#go").onclick = () => course === "flash" ? startFlash(list(), course) : startGame(list(), course);
  }
  scrollTo(0, 0);
}

// ───────── ゲーム
function startGame(list, mode) { run = { kind: "game", mode, list, i: 0, score: 0, combo: 0, maxCombo: 0, wrong: [] }; ask(); }
function ask() {
  const q = run.list[run.i], total = run.list.length;
  run.opts = q.t === "mc" ? shuffle(q.c.map((text, idx) => ({ text, idx }))) : null;
  const c0 = CARD[q.src[0]];
  app.innerHTML = `
    <div class="bar"><button class="quit" id="quit">✕ やめる</button><div class="track"><div class="fill" style="width:${run.i / total * 100}%"></div></div><div class="count">${run.i + 1} / ${total}</div></div>
    <div class="combo">${run.combo >= 2 ? `${run.combo} コンボ` : ""}</div>
    <article class="card" id="card">
      <div class="meta"><span class="tag">${yl(q.y)}</span><span class="tag navy">${sceneLabel(c0)}</span><span class="tag navy">${q.t === "ox" ? "○×" : "4択"}</span></div>
      <div class="qtext">${esc(q.q)}</div>
    </article>
    ${q.t === "ox"
      ? `<div class="ox" id="ans"><button data-v="true" aria-label="正しい">○</button><button data-v="false" aria-label="誤り">×</button></div>`
      : `<div class="choices" id="ans">${run.opts.map((o, k) => `<button data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o.text)}</span></button>`).join("")}</div>`}
    <div id="after"></div>`;
  app.querySelector("#quit").onclick = () => run.i ? gameResult() : home();
  app.querySelectorAll("#ans button").forEach(b => b.onclick = () => judge(b));
  keyHandler = e => {
    if (app.querySelector("#ans.answered")) { if (e.key === "Enter" || e.key === "ArrowRight") app.querySelector("#nx")?.click(); return; }
    if (q.t === "ox" && (e.key === "o" || e.key === "1")) app.querySelector('[data-v="true"]').click();
    if (q.t === "ox" && (e.key === "x" || e.key === "2")) app.querySelector('[data-v="false"]').click();
    if (q.t === "mc" && "1234abcd".includes(e.key.toLowerCase())) { const k = "1234".includes(e.key) ? +e.key - 1 : "abcd".indexOf(e.key.toLowerCase()); app.querySelector(`[data-k="${k}"]`)?.click(); }
  };
  scrollTo(0, 0);
}
function judge(btn) {
  const box = app.querySelector("#ans");
  if (box.classList.contains("answered")) return;
  box.classList.add("answered");
  const q = run.list[run.i];
  let ok, rightBtn;
  if (q.t === "ox") { ok = (btn.dataset.v === "true") === q.a; rightBtn = box.querySelector(`[data-v="${q.a}"]`); }
  else { ok = run.opts[+btn.dataset.k].idx === 0; rightBtn = box.querySelector(`[data-k="${run.opts.findIndex(o => o.idx === 0)}"]`); }
  rightBtn.classList.add("is-right");
  if (!ok) btn.classList.add("is-wrong");
  const miss = getSet("miss"), seen = getSet("seenI");
  seen.add(q.id);
  if (ok) { run.score++; run.combo++; miss.delete(q.id); buzz(15); }
  else { run.combo = 0; run.wrong.push(q); miss.add(q.id); buzz([30, 40, 30]); }
  run.maxCombo = Math.max(run.maxCombo, run.combo);
  putSet("miss", miss); putSet("seenI", seen);
  app.querySelector(".combo").textContent = run.combo >= 2 ? `${run.combo} コンボ` : "";
  app.querySelector("#card").classList.add(ok ? "pop" : "shake");
  const correct = q.t === "ox" ? (q.a ? "○" : "×") : q.c[0];
  const oral = q.src.map(id => { const c = CARD[id]; return `<div class="pair"><b>主査</b><div>${c.q}</div><b>受験者</b><div>${c.a}</div></div>`; }).join("");
  app.querySelector("#after").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="verdict ${ok ? "ok" : "ng"}"><span class="mark">${ok ? "○" : "×"}</span><span>${ok ? "正解" : "不正解　正解は「" + esc(correct) + "」"}</span></div>
      ${q.e ? `<div class="exp">${esc(q.e)}</div>` : ""}
      ${checkBox("item", q.id)}
      ${q.arts.length ? `<details open><summary>条文（${q.arts.length}）</summary><div class="dbody">${artsHTML(q.arts)}</div></details>` : ""}
      <details><summary>本番の口述問答（${q.src.length}）</summary><div class="dbody oral">${oral}</div></details>
    </div>
    <div class="next"><div class="row one"><button class="primary" id="nx">${run.i + 1 < run.list.length ? "次の問題へ" : "結果を見る"}</button></div></div>`;
  bindCheck();
  app.querySelector("#nx").onclick = () => { run.i++; run.i < run.list.length ? ask() : gameResult(); };
}
function gameResult() {
  keyHandler = null;
  const n = run.i + (app.querySelector("#ans.answered") ? 1 : 0) || run.list.length;
  const done = Math.min(n, run.list.length), r = done ? run.score / done : 0;
  const rank = r === 1 ? "満点" : r >= .8 ? "合格圏" : r >= .6 ? "あと一歩" : "要復習";
  const chk = getSet("chkI"), marked = run.list.slice(0, done).filter(q => chk.has(q.id)).length;
  app.innerHTML = `
    <section class="panel result">
      <div class="muted">${COURSE[run.mode].title}</div>
      <div class="big">${run.score}<span style="font-size:24px"> / ${done}</span></div>
      <div class="stamp">${rank}</div>
      <div class="muted small">最大 ${run.maxCombo} コンボ ・ 要確認に入っている問題 ${marked}問</div>
    </section>
    ${run.wrong.length ? `<section class="panel"><h2>間違えた問題</h2><div class="misslist">${run.wrong.map(q => `<div>${esc(q.q)}</div>`).join("")}</div></section>
    <button class="primary" id="again">間違えた${run.wrong.length}問をもう一度</button>` : ""}
    <button class="ghost" id="home">ホームに戻る</button>`;
  const ag = app.querySelector("#again");
  if (ag) ag.onclick = () => startGame(shuffle(run.wrong), run.mode);
  app.querySelector("#home").onclick = home;
  scrollTo(0, 0);
}

// ───────── フラッシュカード
function startFlash(list, mode) { run = { kind: "flash", mode, list, i: 0, flipped: false }; card(); }
function card() {
  const c = run.list[run.i], total = run.list.length;
  const seen = getSet("seenC"); seen.add(c.id); putSet("seenC", seen);
  app.innerHTML = `
    <div class="bar"><button class="quit" id="quit">✕ やめる</button><div class="track"><div class="fill" style="width:${(run.i + 1) / total * 100}%"></div></div><div class="count">${run.i + 1} / ${total}</div></div>
    <article class="card flash" id="fc">
      <div class="meta"><span class="tag">${yl(c.y)}</span><span class="tag navy">${sceneLabel(c)}</span></div>
      ${caseBlock(c)}
      <div class="side">問</div>
      <div class="qtext">${c.q}</div>
      <div id="back"></div>
    </article>
    <div id="extra"></div>
    <div class="next"><div class="row"><button class="ghost" id="pv" ${run.i ? "" : "disabled"}>前へ</button><button class="primary" id="fl">裏をめくる</button></div></div>`;
  app.querySelector("#quit").onclick = flashEnd;
  app.querySelector("#pv").onclick = () => { if (run.i) { run.i--; card(); } };
  const flip = () => {
    if (app.querySelector("#back").innerHTML) return;
    app.querySelector("#back").innerHTML = `<div class="ans flipin"><span class="lab">答</span>${c.a}</div>`;
    app.querySelector("#extra").innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${checkBox("card", c.id)}${c.arts.length ? `<details><summary>関連条文（${c.arts.length}）</summary><div class="dbody">${artsHTML(c.arts)}</div></details>` : ""}</div>`;
    bindCheck();
    const fl = app.querySelector("#fl");
    fl.textContent = run.i + 1 < total ? "次のカードへ" : "おわる";
    fl.onclick = next;
  };
  const next = () => { if (run.i + 1 < total) { run.i++; card(); } else flashEnd(); };
  app.querySelector("#fl").onclick = flip;
  app.querySelector("#fc").addEventListener("click", e => { if (!e.target.closest("details, a")) flip(); });
  keyHandler = e => {
    if (e.target.closest && e.target.closest("input")) return;
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); app.querySelector("#back").innerHTML ? next() : flip(); }
    if (e.key === "ArrowLeft" && run.i) { run.i--; card(); }
  };
  scrollTo(0, 0);
}
function flashEnd() {
  keyHandler = null;
  const chk = getSet("chkC"), seenN = run.i + 1;
  const marked = run.list.slice(0, seenN).filter(c => chk.has(c.id)).length;
  app.innerHTML = `
    <section class="panel result">
      <div class="muted">${COURSE[run.mode].title === "要確認リスト" ? "要確認リスト（フラッシュカード）" : "フラッシュカード"}</div>
      <div class="big">${seenN}<span style="font-size:24px"> 枚</span></div>
      <div class="muted small">見たカードのうち要確認に入っているもの ${marked}枚</div>
    </section>
    <button class="primary" id="again">もう一周する</button>
    <button class="ghost" id="home">ホームに戻る</button>`;
  app.querySelector("#again").onclick = () => startFlash(pref.order === "シャッフル" ? shuffle(run.list) : run.list, run.mode);
  app.querySelector("#home").onclick = home;
  scrollTo(0, 0);
}

home();
</script>
</body>
</html>
