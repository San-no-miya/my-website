-36"}, {"id": "H30-41", "y": "H30", "sn": 4, "sc": "場面設定4（2日目）", "q": "本件に当てはめてみよ。", "a": "本件では、Vはすでに弁済期を経過していながら、10万円という一定程度の額につき借りていないと言って弁済していないため、ある程度強めに返還を求めないと返済が得られない上、<br>1対1でなされており、凶器なども使われていないため社会的に相当とも言いうる。しかし、Aは、Vに対してぶっ殺すと生命に対する加害言動をした上、5万円の上乗せを求めて凄んでおり、行為態様の点や正当な権利の範囲を上回る請求をしており、社会的に相当な範囲を逸脱しており、正当な権利行使とは言えないため、違法性阻却されない。", "arts": [], "first": "H30-36"}, {"id": "H30-42", "y": "H30", "sn": 5, "sc": "場面設定5（2日目）", "q": "事例 Vからお金を恐喝しようと、AとBは共謀して、AがVを恐喝して、BはVからお金の交付を受けた。それぞれ恐喝罪の共同正犯として逮捕したところ、Aは容疑を否認し、Bは容疑を認めたとする。そこで、AとBは、同じ裁判所に、審理を別にして起訴された。なお、両裁判の審理は、同じ裁判官が担当することとなった。この場合、裁判所は、Bの公判を優先して進めることはできるか。", "a": "できない。", "arts": ["憲37", "訴256-6"], "first": "H30-42"}, {"id": "H30-43", "y": "H30", "sn": 5, "sc": "場面設定5（2日目）", "q": "理由は?", "a": "公平な裁判所（憲法３７条１項）の理念や、予断排除(刑訴法256条6項)の観点から、自認しているBの裁判から先に進めると、これにより、否認しているAにとって不利益な心証を裁判官が抱いてしまいかねず、予断が生じる。そのため、まずAの審理を先行して行うべきである。", "arts": ["憲37", "訴256-6"], "first": "H30-42"}, {"id": "H30-44", "y": "H30", "sn": 5, "sc": "場面設定5（2日目）", "q": "Aの公判において、Cが「事件翌日に、AがVを恐喝し、お金を交付させたと言っていた。」と証言した。この場合、要証事実を「AがVを恐喝しお金を交付させたこと」とした場合に、先の証言は伝聞になるか。", "a": "伝聞になる。", "arts": ["訴320", "訴324"], "first": "H30-42"}, {"id": "H30-45", "y": "H30", "sn": 5, "sc": "場面設定5（2日目）", "q": "なぜか", "a": "本当にAがVを恐喝してお金を交付させたかどうかは、直接体験したAかVでなければ実際にそのような事実があったかどうか語ることはできないため要証事実との関係で、内容の真実性が問題になる。", "arts": ["訴320", "訴324"], "first": "H30-42"}, {"id": "H30-46", "y": "H30", "sn": 5, "sc": "場面設定5（2日目）", "q": "では、先ほどのCの証言につき、要証事実を「Cが事件翌日に、AがVを恐喝し、お金を交付させたと言っていたのを聞いたこと」とした場合は伝聞になるか。", "a": "伝聞にならない。", "arts": ["訴320"], "first": "H30-42"}, {"id": "H30-47", "y": "H30", "sn": 5, "sc": "場面設定5（2日目）", "q": "なぜか。", "a": "Aがそのような発言をしたかどうかは、Cが直接体験した事実であるため、Cに対して反対尋問すれば良いから内容の真実性が問題にならない。 (Cにヒアすれば、Cはセイできる。)", "arts": ["訴320"], "first": "H30-42"}, {"id": "H30-48", "y": "H30", "sn": 5, "sc": "場面設定5（2日目）", "q": "では、AとBの公判が別々に進み、Bは自らの公判において、AとBの実行行為や、Aとの共謀の事実につき認める供述をした。その後、Bは有罪の判決となった。その後、Aの公判において、検察官がBに証言させたところ、Aは何もしていないし、Aとは共謀もしていないと供述した。この場合、検察官はどうするか。", "a": "Bの公判調書を証拠請求する。", "arts": ["訴321-1"], "first": "H30-48"}, {"id": "H30-49", "y": "H30", "sn": 5, "sc": "場面設定5（2日目）", "q": "その場合の根拠条文は?", "a": "刑訴法321条1項1号", "arts": ["訴321-1"], "first": "H30-48"}, {"id": "H30-50", "y": "H30", "sn": 5, "sc": "場面設定5（2日目）", "q": "他にも請求できる証拠はないか。", "a": "検察官面前調書(321条1項2号後段)、警察官面前調書(321条1項3号)", "arts": ["訴321-1"], "first": "H30-48"}, {"id": "R1-01", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "<b>事例</b><br>甲及び乙は、飲食店の店員であるが、客であったVの言動に腹を立て、暴行を加えることを共謀し、Vが店を出た後を追い、甲はVの腹部に、乙はVの頭部に、それぞれ暴行を加えて、急性硬膜下出血腫の傷害を負わせた。甲と乙の罪責は?", "a": "Vに対する傷害罪の共同正犯<br>(甲は腹部の暴行しか行っておらず、乙との共同正犯にしないと、<b>頭部</b>にかかる傷害結果の責任を負わない事例。そのため、共同正犯まで言わないと、追及される。)", "arts": ["刑60", "刑204"], "first": "R1-01"}, {"id": "R1-02", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "<b>事例</b><br>先ほどの事例において、店内で一部始終を見ていた丙も、Vの態度に腹を立てており、甲及び乙が店内に戻った後、甲及び乙と意思の連絡なく、甲らの暴行を受けてうずくまっているVの頭部に暴行を加え、その結果、Vは急性硬膜下出血腫の傷害を負った。<br>なお、この傷害の結果が乙の加えたものによるか、それとも、丙のものによるものかは判然としなかった。この場合、丙は、どのような罪責を負うか。", "a": "傷害罪の共同正犯。", "arts": ["刑207"], "first": "R1-02"}, {"id": "R1-03", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "本来、乙か丙のいずれかから傷害結果が生じたのか不明であるため、因果関係が不明であり、利益原則から、暴行の限度でしか帰責されないようにも思われる。<br>もっとも<b>同時傷害の特例(刑法207条)</b>により<br>1. <b>意思の連絡なく</b>二人以上の者が<b>故意に</b>暴行を加えたこと<br>2. <b>同一の機会</b>といえる程度に、<b>時間的場所的に近接</b>してなされたこと<br>3. 各暴行が当該傷害結果を生じさせる<b>危険性</b>を有すること<br>4. 傷害の原因となる暴行が<b>特定できない</b>こと<br>でも、傷害罪の共同正犯とみなされる。<br>本件では、同時傷害の特例が適用がされるため、傷害罪の共同正犯となる。<br><b>(同時傷害の特例) &lt;刑法207条&gt;</b><br>二人以上で暴行を加えて人を傷害した場合において、それぞれの暴行による傷害の軽重を知ることができず、又はその傷害を生じさせた者を知ることができないときは、共同して実行した者でなくても、共犯の例による。", "arts": ["刑207"], "first": "R1-02"}, {"id": "R1-04", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "同時傷害の特例の趣旨は?", "a": "被害者保護や立証の困難回避", "arts": ["刑207"], "first": "R1-02"}, {"id": "R1-05", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "本件では、同一の機会といえるのはなぜか。", "a": "甲乙と丙は、全く同じ時にVに暴行を加えた訳ではない。<br>しかし、本件では、甲乙がVに対する暴行を共謀の上で、店外において、甲が腹部、乙が頭部にVに対して暴行を加え、甲乙が店内に戻ってきた後、すぐ、外に出たところ、未だ店外でVがうずくまっていた。この状態のVに対して、丙は頭部に暴行を加えたのだから、時間的場所的に近接しているため、同一の機会といえる。", "arts": ["刑207"], "first": "R1-02"}, {"id": "R1-06", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "<b>事例</b><br>甲及び乙がVに対する暴行を継続している途中で、丙が共謀して暴行に加わった。<br>その後も3名は暴行を加え続けたが、最終的に、Vは頭部に急性硬膜下血腫の傷害を負った。<br>しかし、この傷害結果が、いずれの者による暴行行為から生じたのか、また、丙が加わる前に生じたのか、加わった後に生じたのか判然としなかった。この場合、丙の罪責はどうなるか。", "a": "<b>同時傷害の特例</b>により傷害罪の共同正犯となる。", "arts": ["刑207"], "first": "R1-06"}, {"id": "R1-07", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、先行者の犯行に途中から加わった者に共同正犯が成立するか否かの問題を一般的に何というか。", "a": "承継的共同正犯", "arts": [], "first": "R1-06"}, {"id": "R1-08", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、あなたは、この事例において承継的共同正犯は成立しないと考えるのか。", "a": "成立しない。", "arts": [], "first": "R1-08"}, {"id": "R1-09", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "共犯の処罰根拠が、共犯者の行為が法益侵害結果と因果性を持つ点にあるところ、承継的共同正犯に関して、<b>傷害罪は状態犯という性格から即既遂</b>に達し、<b>先行者の行為から既に傷害結果</b> が発生していた場合には、<b>加担後の自己の行為が、先行者の行為と結果に因果性を与えることは無い</b>。<br>そして、先行者の行為によって傷害結果が生じた可能性がある以上、<b>利益原則</b>の観点から、加担後の行為が因果を遡って、先行者の行為と結果に因果性を与えたとすることはできない。<br>したがって、承継的共同正犯は否定される。", "arts": [], "first": "R1-08"}, {"id": "R1-10", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、事例を離れて、どのようなケースであれば承継的共同正犯が成立するか。", "a": "例えば、<b>継続犯(逮捕監禁罪)</b>の場合や、<b>結合犯(強盗罪)</b>のような場合。<br>* <b>中間説</b>のうち積極的利用説の立場に立っていた場合、下記の質問が来る。<br>* 中間説のうち、因果性があるか否か、という立場の方が、この質問が来ないし、説明が楽。<br>* Q 本件でも、甲と乙の暴行によってVがうずくまっている状況が作出されており、それを利用している訳なので、それを丙が利用したといえるのでは?<br>* A 基本刑法P394によれば、<b>積極的利用説</b>の立場に立つなら、先行者の行為と結果を積極的に利用したといえるなら、<b>傷害結果が先行者か後行者のいずれの暴行から生じたか不明でも</b>承継的共同正犯が<b>成立</b>するとの記載がある。", "arts": [], "first": "R1-10"}, {"id": "R1-11", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、あなたは、同時傷害の特例により、丙は傷害罪の共同正犯となるとの見解ですが、本件では、甲乙と丙は途中でVに対する暴行の共謀をしており、甲と乙には、同時傷害の特例を適用するまでもなく傷害罪の共同正犯が成立します。<br>そうすると、丙に同時傷害の特例を適用せずとも、被害者保護や立証困難の回避という同条の趣旨に反しないのでは?", "a": "(<b>肯定説</b>から)<br>①同時傷害の特例は、共犯類似現象に対処するための規定なので、共犯関係があれば当然適用できる。<br>②また、共同正犯が成立しない場合は同時傷害の特例が適用されて傷害罪の共同正犯となるのに、より悪質な共同正犯が成立する場合には同時傷害の特例が適用されずに罪が軽くなるのは、不均衡。そのため、丙に対して、同時傷害の特例を適用できる。<br>(cf<b>否定説</b> 207条は誰にも傷害の罪責を負わせることができないことを回避する規定なので、少なくとも先行者に帰責できるならば、本条を適用する必要はない。)<br>*R2.9.30最高裁決定は、肯定説をとったので、肯定説で良いかと思われるが、 R3司法試験刑法では、肯定説と否定説の立場から論じる問題が出ているので、両説押える。<br><b>&lt;R2.9.30最高裁決定の判事事項&gt;</b><br>1 他の者が先行して被害者に暴行を加え，これと同一の機会に，後行者が途中から共謀加担したが，被害者の負った傷害が共謀成立後の暴行により生じたとは認められない場合と刑法 207条<br>2 他の者が先行して被害者に暴行を加え，これと同一の機会に，後行者が途中から共謀加担したが，被害者の負った傷害が共謀成立後の暴行により生じたとは認められない場合において，後行者の加えた暴行が当該傷害を生じさせ得る危険性を有しないときに，刑法207条を適用することの可否<br><b>&lt;判旨&gt;</b><br>1について他の者が先行して被害者に暴行を加え，これと同一の機会に，後行者が途中から共謀加担したが，被害者の負った傷害が共謀成立後の暴行により生じたとは認められない場合，その傷害を生じさせた者を知ることができないときは，刑法207条の適用により後行者は当該傷害についての責任を免れない。<br>2について他の者が先行して被害者に暴行を加え，これと同一の機会に，後行者が途中から共謀加担したが，被害者の負った傷害が共謀成立後の暴行により生じたとは認められない場合に，刑法207条の適用により後行者に対して当該傷害についての責任を問い得るのは，後行者の加えた暴行が当該傷害を生じさせ得る危険性を有するものであるときに限られる。", "arts": ["刑207"], "first": "R1-11"}, {"id": "R1-12", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "Vが死亡した場合にも、同時傷害の特例は適用されるか。", "a": "適用される。", "arts": ["刑207"], "first": "R1-11"}, {"id": "R1-13", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。条文には「傷害した」となっており、傷害致死とはなっておらず、適用されないのではないのか?", "a": "<b>立証の困難回避や被害者保護</b>という趣旨はこの場合にも及ぶといえるため。<br>(最高裁判例 S26.9.20)", "arts": ["刑207"], "first": "R1-11"}, {"id": "R1-14", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、強盗致傷罪などには適用されるか。", "a": "適用されない。", "arts": ["刑207"], "first": "R1-11"}, {"id": "R1-15", "y": "R1", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。先ほどの趣旨は、この場合にも当てはまると思うが。", "a": "1. 「傷害した」という<b>条文の文言から乖離</b>しすぎるし、<br>2. 本条は刑法の<b>例外規定</b>であるし、自由保障機能から適用範囲は<b>限定的に解する</b>べき<br>なので、適用されない。", "arts": ["刑207"], "first": "R1-11"}, {"id": "R1-16", "y": "R1", "sn": 2, "sc": "場面設定2（1日目）", "q": "<b>事例</b><br>甲乙丙は、傷害罪の共同正犯の罪責で起訴された。<br>&lt;公訴事実&gt;<br>甲は、乙と共謀の上、平成31年4月1日、午後11時30分頃、東京都○所在○店前路上において、Vに対し、甲が同人の腹部を蹴り、乙が同人の頭部を蹴る暴行を加え、また、丙と共謀の上、丙が同人の頭部を蹴る暴行を加え、よって、同人に急性硬膜下血腫の傷害を負わせた。<br>甲は、乙と共謀してAに暴行を加えたことは認めたが、丙との共謀の事実については争った。<br>裁判所は、審理の結果、甲が頭部を蹴ったとの心証を抱き、他方で乙が腹部を蹴ったとの心証を抱いた。また、甲と丙との共謀については共謀自体が認められないが、同時傷害の特例が適用されるとの心証を抱いた。<br>この場合、裁判所は、心証通りに暴行の部位を認定するために、何か対応する必要があるか。", "a": "公訴事実は甲がVの腹部を蹴るという暴行・乙がVの頭部を蹴るという内容であり、他方、裁判所の心証は、甲がVの頭部を蹴る、乙がVの腹部を蹴るという内容となっており、<b>行為者が異なっている</b>ので、訴因変更(刑訴法312条1項)が必要である。<br>そこで、<b>訴因変更の促し</b>をするべき。", "arts": ["訴312"], "first": "R1-16"}, {"id": "R1-17", "y": "R1", "sn": 2, "sc": "場面設定2（1日目）", "q": "その根拠条文は?", "a": "訴訟指揮(刑訴法294条)、釈明(規則208条1項)", "arts": ["訴294", "規208"], "first": "R1-16"}, {"id": "R1-18", "y": "R1", "sn": 2, "sc": "場面設定2（1日目）", "q": "そもそも、あなたは、訴因変更の要否についてどう考えるか。", "a": "当事者主義的訴訟構造のもと、裁判所の審判対象は、検察官の掲げる訴因を対象とされる。<br>そして、訴因には、審判対象確定機能と防御権告知機能があり、前者が主で、後者は、起訴状提出後に釈明などで柔軟に対応すれば足りる。<br>そこで、<br>①審判対象の確定に不可欠な事項が変動した場合には、訴因変更が必要<br>②①に当たらない場合でも、訴因に記載された事実のうち、被告人の防御にとって重要な事項(訴因としての記載が不可欠ではないもの)につき訴因と異なる事実認定をする場合には、訴因変更が必要。<br>③②に当たる場合でも、認定事実が訴因記載事実よりも、被告人にとって非不利益かつ、非不意打ちならば、訴因変更は不要。", "arts": ["訴312"], "first": "R1-16"}, {"id": "R1-19", "y": "R1", "sn": 2, "sc": "場面設定2（1日目）", "q": "本件では、なぜ訴因変更が必要なのか。", "a": "同一機会の暴行であるため、「①審判対象の確定に不可欠な事項が変動した」わけではない。<br>しかし、行為者の点や、暴行した部位が異なるということは「<b>②被告人の防御にとって重要な事項</b>」と言えるし、情状の点から「不利益」だし、その点につき争う機会がなく「不意打ち」となる。<br>そのため、訴因変更が必要である。", "arts": ["訴312"], "first": "R1-16"}, {"id": "R1-20", "y": "R1", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、裁判所は甲乙と丙の間に共謀は認められないが、同時傷害の特例が適用されるとの心証を抱いた。この場合、訴因変更は必要か。", "a": "必要", "arts": ["刑207"], "first": "R1-16"}, {"id": "R1-21", "y": "R1", "sn": 2, "sc": "場面設定2（1日目）", "q": "なぜか。", "a": "被告人の防御にとって重要な事項の変更であり、不利益かつ不意打ちになるため。<br>※上記①の問題として捉え（６０条と２０７条では罰条が異なるので）、訴訟指揮の問題として捉える立場もある。", "arts": ["刑207"], "first": "R1-16"}, {"id": "R1-22", "y": "R1", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、この場合、検察官が同時傷害の特例についても訴因で明示主張していて、被告人側もそれについての防御を尽くしていた場合はどうか。", "a": "不要。", "arts": [], "first": "R1-16"}, {"id": "R1-23", "y": "R1", "sn": 2, "sc": "場面設定2（1日目）", "q": "なぜか。", "a": "確かに、共謀がなかったのに共謀があったものと扱われるのでは、被告人の防御にとって重要な事項が変動したとも思える。<br>しかし、検察官は当初から訴因で明示主張していた上、被告人側も防御を尽くせたのだから非不利益かつ非不意打ちであるため、訴因変更は不要である。", "arts": [], "first": "R1-16"}, {"id": "R1-24", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "<b>事例</b><br>宗教団体の代表者であるAは、超能力により病気を治癒することができると謳っており、知人を介して、重篤な病気のVの治療を引き受け、ホテルの一室に連れて来させたが、Vに対して治療をせずに放置した。<br>Aは、妻Bに対して電話をして事情を告げたところ、Aの宗教団体の代表者としての威信が失われることを恐れたBは、Vをどこかへ遺棄することを提案し、Aはこれを承諾した。<br>そして、Aは、Vを人気のないところへ運び、遺棄した。<br>しかし、通行人が偶然Vを発見して救助したため、Vは一命をとりとめた。なお、Aには殺意がないことを前提とする。この事例において、Aに何罪が成立するか。", "a": "保護責任者遺棄罪が成立する。(刑法218条前段)<br><b>(保護責任者遺棄等)</b><br><b>第二百十八条</b><br>老年者、幼年者、身体障害者又は病者を保護する責任のある者がこれらの者を遺棄し(*前段が保護責任者遺棄罪)、又はその生存に必要な保護をしなかった(*後段が保護責任者不保護罪)ときは、三月以上五年以下の懲役に処する。", "arts": ["刑218"], "first": "R1-24"}, {"id": "R1-25", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "では保護責任の発生根拠は?", "a": "<b>法令、契約、慣習条理、先行行為、危険の引き受け、社会継続保護関係</b>などに<b>加えて</b>、被侵害者の生命身体が、保護責任者に具体的に依存しているか否かという<b>排他的支配</b>が必要。<br>(判例は、形式的作為義務だけでなく、排他的支配がある場合に作為義務を認める傾向)", "arts": ["刑218"], "first": "R1-24"}, {"id": "R1-26", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "本件では?", "a": "本件では、Aは病気のVを治療のためにホテルの一室に連れて来させるという<b>先行行為または危険の引き受け</b>がある。<br>さらに、ホテルの一室のため、A以外はVの生命身体を保護することができる者が居ないため Vの生命身体がAに具体的に依存しており<b>排他的支配</b>がある。<br>よって保護責任が認められる。", "arts": ["刑218"], "first": "R1-24"}, {"id": "R1-27", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、Bには、何罪が成立するか。", "a": "単純遺棄罪の教唆犯", "arts": ["刑65", "刑61"], "first": "R1-24"}, {"id": "R1-28", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "単純遺棄罪の教唆犯になる根拠条文は?", "a": "1. 刑法65条2項(不真正身分犯)<br>2. 刑法61条1項(教唆)", "arts": ["刑65", "刑61"], "first": "R1-24"}, {"id": "R1-29", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "あなたは、65条の身分犯規定について、どのような立場に立つか。", "a": "条文の文言から、65条1項は真正身分犯の規定、65条2項は不真正身分犯の規定と解する。", "arts": ["刑65"], "first": "R1-24"}, {"id": "R1-30", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、本件についてはどのように考えたのか。", "a": "Aは保護責任者遺棄罪を犯しているが、同罪は、保護責任者という身分があることによる遺棄罪の加重規定であり、<b>不真正不作為犯</b>である。<br>そのため、保護責任がないBには、刑法65条2項が適用されて「通常の刑」である単純遺棄罪が成立し、これの教唆になる。<br><b>(身分犯の共犯)</b><br><b>第六十五条</b><br>犯人の身分によって構成すべき犯罪行為に加功したときは、身分のない者であっても、共犯とする。<br>2 身分によって特に刑の軽重があるときは、身分のない者には通常の刑を科する", "arts": ["刑65"], "first": "R1-24"}, {"id": "R1-31", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、Bが遺棄ではなく、Vを、ホテルの一室へ放置することを提案した場合、Bには何罪が成立するか。", "a": "保護責任者遺棄罪(刑法218条前段)の教唆(刑法65条1項、61条1項)", "arts": ["刑65", "刑218", "刑217"], "first": "R1-24"}, {"id": "R1-32", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "なぜか。", "a": "遺棄罪(刑法217条)の遺棄は、移置のみであるが、刑法218条前段の遺棄には、移置のみならず置き去りも含む。<br>本件では、Aは、置き去りの類型で遺棄したから、217条の遺棄罪では処罰されない類型である。そのため、真正身分犯となり、刑法65条1項が適用される。よって、保護責任者遺棄罪となり、これの教唆となる。", "arts": ["刑65", "刑218", "刑217"], "first": "R1-24"}, {"id": "R1-33", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、あなたの見解とは異なり、65条1項を共犯の成立についての規定、65条2項を共犯の科刑についての規定と考えると、当初の事例において、Bの行為に何罪が成立するか。", "a": "刑法65条1項により保護責任者遺棄罪の教唆犯が成立し、刑は65条2項により単純遺棄罪の教唆犯としての刑が科される。", "arts": ["刑65"], "first": "R1-24"}, {"id": "R1-34", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "あなたの立場では、BがVを積極的に遺棄するように教唆した場合には単純遺棄罪となり、他方で、放置するように教唆した場合には保護責任者遺棄罪が成立するわけですね。<br>それでは、結論が不均衡ではないかとの反論がありうるが、どのように対応すべきか。", "a": "科刑の点で不均衡を調整する。", "arts": [], "first": "R1-34"}, {"id": "R1-35", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、罪名が異なる点はどう考えるか。", "a": "結局、先ほどの異なる見解にたっても、いずれのケースでもAとBの罪名は一致するが、科刑が分離するという問題が生じる。したがって、この点は、やむを得ないと考える。", "arts": [], "first": "R1-34"}, {"id": "R1-36", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、最初の事例で、AはVがホテルに連れて来られてから、Vの容態を見て殺意を抱き、放置することにした。この場合、Aに何罪が成立するか。", "a": "殺人未遂罪が成立する。", "arts": ["刑199", "刑203"], "first": "R1-36"}, {"id": "R1-37", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "Aは、Vの容態を見てから殺意を抱いたが、それでも殺人罪になるのか。", "a": "Aは、Vを<b>放置して必要な医療行為を受けさせなかったという不作為行為</b>をしており、この行為が殺人罪の実行行為になる。", "arts": ["刑199", "刑203"], "first": "R1-36"}, {"id": "R1-38", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "不作為の実行行為を認めるための要件は?", "a": "作為との構成要件的同価値性として、<br>1. 作為義務<br>2. 作為の可能性と容易性", "arts": [], "first": "R1-36"}, {"id": "R1-39", "y": "R1", "sn": 3, "sc": "場面設定3（2日目）", "q": "本件に当てはめると?", "a": "本件では、Aは重篤な病気のVをホテルの一室に引き受けるという先行行為をなしており、さらに、ホテルの一室は密室であり、他にVを保護できる者はいないから排他的支配の設定が認められるため、作為義務が肯定される。<br>また、作為の可能性と容易性としても、救急車を手配するため119番通報し病院に搬送の上医療行為を受けさせることは、Aにとって極めて容易かつ可能な行為である。そのため作為の可能性と容易性も肯定される。その義務違反もある。<br>したがって、作為との構成要件的同価値性があり、殺人の実行行為がある。<br>もっとも、Vは一命をとりとめたから未遂となる。<br>殺意もあるため、故意がある。<br>以上より、殺人未遂罪が成立する。", "arts": [], "first": "R1-36"}, {"id": "R1-40", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "<b>事例</b><br>Cは、AがVを遺棄したのを目撃しており、その旨を検察官に詳細な供述をし、検察官面前調書が作成されたので、Cは署名押印した。その後、Aは起訴された。検察官は、証明予定事実記載書面を提出後、証拠調べ請求し、証拠開示をした。あなたが、Aの弁護人の立場として、Cの検察官面前証拠の証明力を争いたいと考えた。この場合、どのような手段によるべきか。", "a": "類型証拠開示請求(刑訴法316条の15)をする。", "arts": ["訴316-15"], "first": "R1-40"}, {"id": "R1-41", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、請求をした弁護人は、どのような事項を明らかにする必要があるか。", "a": "刑訴法316の15第3項、<br>1号イとして<br>1. 第一項各号に掲げる証拠の類型<br>2. 開示の請求に係る証拠を識別するに足りる事項<br>1号ロとして<br>3. 当該開示の請求に係る証拠が当該検察官請求証拠の証明力を判断するために重要で<br>4. その他の被告人の防御の準備のために当該開示が必要である理由<br>を明らかにする。", "arts": ["訴316-15"], "first": "R1-40"}, {"id": "R1-42", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、類型証拠開示請求が終わった後、次に弁護人はどのような手続きをとるか。", "a": "刑訴法316条の16第1項により、検察官請求証拠について、第326条の同意をするかどうか又はその取調べの請求に関し異議がないかどうかの意見を明らかにする必要がある。", "arts": ["訴316-16"], "first": "R1-40"}, {"id": "R1-43", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "意見というのは、具体的にどのようなものがあるか。", "a": "非供述証拠(証拠物)は、異議なし、異議あり<br>供述証拠は、同意、不同意、同意+異議、任意性なし", "arts": ["訴316-16"], "first": "R1-40"}, {"id": "R1-44", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、Cの検察官面前調書につき弁護人が不同意の意見を述べた場合、検察官はどのように対処すべきか。", "a": "検察官面前調書の請求は一旦留保し、Cの証人尋問請求をする。<br>(*証人尋問の結果、供述不能や、前の供述と異なった・実質的に異なった場合には、伝聞例外 321条1項2号前段・後段で請求する。)", "arts": ["訴321-1"], "first": "R1-40"}, {"id": "R1-45", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "弁護人の主張関連証拠の開示請求に対して、検察官が開示をしなかった場合に、弁護人はどうすれば良いか。", "a": "<b>裁定請求</b>をする。<br><b>&lt;刑訴法316条の25第1項&gt;</b><br>裁判所は、証拠の開示の必要性の程度並びに証拠の開示によつて生じるおそれのある弊害の内容及び程度その他の事情を考慮して、必要と認めるときは、第三百十六条の十四第一項(第三百十六条の二十一第四項において準用する場合を含む。)の規定による開示をすべき証拠については検察官の請求により、第三百十六条の十八(第三百十六条の二十二第四項において準用する場合を含む。)の規定による開示をすべき証拠については被告人又は弁護人の請求により、決定で、当該証拠の開示の時期若しくは方法を指定し、又は条件を付することができる。", "arts": ["訴316-26"], "first": "R1-40"}, {"id": "R1-46", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、Cは公判期日において証人尋問を受けたが、この時Cは、終始「Aの犯行はよく覚えていない。」と供述したことから、検察官は、Cに対して「AがVを遺棄したのを見たのではないですか。」と尋問した。<br>そこで、弁護人は異議を申し立てた。まず、異議の根拠と理由は?", "a": "刑訴法309条1項、規則205条1項にいう法令違反として、誘導尋問(規則199条3 項本文)に当たると述べる。", "arts": ["訴309", "規205", "規199-3"], "first": "R1-46"}, {"id": "R1-47", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "これに対して、裁判所は、どうすべきか。", "a": "検察官に対して釈明(規則208条1項)する。", "arts": ["規199-3", "規208"], "first": "R1-46"}, {"id": "R1-48", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "検察官は、これに対してどう応じるか。", "a": "刑訴法規則199条3項但書の、証人の記憶が明らかでない事項についてその記憶を喚起するため必要があるときに当たる、または、6号の証人が前の供述と相反するか又は実質的に異なる供述をした場合、として、弁護人の異議に理由がないことを述べる。", "arts": ["規199-3", "規208"], "first": "R1-46"}, {"id": "R1-49", "y": "R1", "sn": 4, "sc": "場面設定4（2日目）", "q": "裁判所は、その結果、どのような対応をすべきか。", "a": "異議に理由がないとして、決定で棄却する。 (刑訴法309条3項、規則205の5)<br><b>刑訴法第309条</b><br>1 検察官、被告人又は弁護人は、証拠調に関し異議を申し立てることができる。<br>2 検察官、被告人又は弁護人は、前項に規定する場合の外、裁判長の処分に対して異議を申し立てることができる。<br>3 裁判所は、前二項の申立について決定をしなければならない<br><b>(異議申立の事由)</b><br><b>規則第二百五条</b><br>1 法第三百九条第一項の異議の申立は、法令の違反があること又は相当でないことを理由としてこれをすることができる。但し、証拠調に関する決定に対しては、相当でないことを理由としてこれをすることはできない。<br>2 法第三百九条第二項の異議の申立は、法令の違反があることを理由とする場合に限りこれをすることができる。<br><b>(異議申立が理由のない場合の決定)</b><br><b>第二百五条の五</b><br>異議の申立を理由がないと認めるときは、決定で棄却しなければならない。<br><b>(異議申立が理由のある場合の決定)</b><br><b>第二百五条の六</b><br>1 異議の申立を理由があると認めるときは、異議を申し立てられた行為の中止、撤回、取消又は変更を命ずる等その申立に対応する決定をしなければならない。<br>2 取り調べた証拠が証拠とすることができないものであることを理由とする異議の申立を理由があると認めるときは、その証拠の全部又は一部を排除する決定をしなければならない。<br><b>第百九十九条の三</b><br>3 主尋問においては、誘導尋問をしてはならない。ただし、次の場合には、誘導尋問をすることができる。<br>一証人の身分、経歴、交友関係等で、実質的な尋問に入るに先だつて明らかにする必要のある準備的な事項に関するとき。<br>二訴訟関係人に争のないことが明らかな事項に関するとき。<br>三証人の記憶が明らかでない事項についてその記憶を喚起するため必要があるとき。<br>四証人が主尋問者に対して敵意又は反感を示すとき。<br>五証人が証言を避けようとする事項に関するとき。<br>六証人が前の供述と相反するか又は実質的に異なる供述をした場合において、その供述した事項に関するとき。<br>七その他誘導尋問を必要とする特別の事情があるとき。", "arts": ["訴309"], "first": "R1-46"}, {"id": "R2-01", "y": "R2", "sn": 1, "sc": "場面設定1（1日目）", "q": "<b>事例</b><br>警察官甲は、令和2年5月1日午前0時00分、繁華街において、のらりくらりとして明らかに覚せい剤を使用していると思われる様相を呈したAを発見した。そこで同時刻、甲は、Aに対する職務質問を開始したところ、Aには覚せい剤使用歴があることもわかった。<br>甲は、午前0時30分、Aに対して、尿の任意提出を求めたが、Aはこれに応じず、その場から立ち去ろうとしたため甲はAの肩を掴んで再度、尿の任意提出を求めた。そこで、甲は、応援の警察官3名を呼び、4名の警察官で、Aを取り囲むようにして説得を続けた。<br>しかし、Aは尿の任意提出には応じないとの意思を明確に示したため、甲は、午前3時00分、強制採尿を行うために必要な令状の請求手続きを行った。<br>その後、午前5時00分に令状が発布され、午前5時30分に、令状を執行した。<br>まず、甲は、強制採尿を行うために、どのような令状を請求するか。", "a": "条件付き捜索差押許可状", "arts": ["訴218-6"], "first": "R2-01"}, {"id": "R2-02", "y": "R2", "sn": 1, "sc": "場面設定1（1日目）", "q": "条件付きとは?", "a": "<b>医師をして医学的に相当な方法で行う</b>、との記載があるもの。(刑訴法218条6項準用)", "arts": ["訴218-6"], "first": "R2-01"}, {"id": "R2-03", "y": "R2", "sn": 1, "sc": "場面設定1（1日目）", "q": "甲の留め置き行為は適法か。", "a": "1. まず、Aは、覚せい剤使用の様相を呈していたことから、警察官職務執行法2条1項にいう「異常な挙動その他周囲の事情から合理的に判断して何らかの犯罪を犯し」たと「疑うに足りる相当な理由のある者」にあたるため、「停止させて質問することができる。」次に、強制の処分にあたらないかであるが、強制の処分については、個人の明示または黙示の意思に反して、重要な権利利益を実質的に侵害制約する処分をいうと解する。確かに、職務質問に関して、5時間半もの間留め置かれ、警察官4名に取り囲まれるようにしていたため行動の自由は一定程度制約がある上、Aの黙示の意思に反する。しかし、体を直接拘束されたりしておらず、また、殊更に滞留を強制するような発言も受けていないため重要な権利利益を実質的に侵害制約するものに至っていない。よって、強制の処分にはあたらない。<br>2. 次いで、任意処分として適法であるかであるが、任意処分は、警察比例の原則から、必要性緊急性などを考慮して具体的状況において相当ならば許容される。本件のAは、覚せい剤の使用の嫌疑があるため説得して留め置く必要性があり、覚せい剤の体内残存日数に限りがあることから緊急性もある。しかし、尿の任意提出を明確に拒み続けるAに対して、甲以下4名の警察官がAの周囲を取り囲む態様で延べ5時間にわたり説得を継続しており、留め置きは具体的状況において相当ではない。よって任意処分として違法である。", "arts": ["警職2", "訴197"], "first": "R2-01"}, {"id": "R2-04", "y": "R2", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、事例を少し変更して、令状請求が午前3時00分ではなく、午前0時20分に行われていたとした場合はどうか。", "a": "適法になる。", "arts": [], "first": "R2-04"}, {"id": "R2-05", "y": "R2", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "<b>強制移行段階</b>については、任意段階と比べて、その後の令状執行に備えて被疑者の所在確保の必要性は非常に高くなる。<br>そこで令状請求が行われていることを対象者に伝えることを条件として、所在確保のため必要最小限度ならば、被疑者に対して相当程度強くその場に留まるよう求めることができる。 (基本刑訴法論点理解編P100参照)<br>本件では、午前0時20分の時点で、強制移行段階に移行したから、その後の令状執行に備えて被疑者の所在確保の必要性は非常に高くなる。そのため、令状請求が行われていることを対象者に伝えることを条件に、警察官らがAを取り囲んで、一定時間の留め置き継続することも必要最小限度といえ、適法になる。", "arts": [], "first": "R2-04"}, {"id": "R2-06", "y": "R2", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、事案を少し追加・変更します。<br>先ほどの令状請求があった後、令状は発布されたが、Aは現場から逃走していた。後日、飲食店で警察官乙が、偶然Aを発見した場合、逮捕状を所持していない乙は、 Aを逮捕することができるか。", "a": "<b>緊急執行</b>により逮捕できる。", "arts": ["訴201", "訴73"], "first": "R2-06"}, {"id": "R2-07", "y": "R2", "sn": 2, "sc": "場面設定2（1日目）", "q": "要件は?", "a": "1. 逮捕状が発布されているものの、逮捕状を所持しないためこれを示すことができない場合<br>2. 急速を要するとき<br>3. 被疑者に対し、被疑事実の要旨及び逮捕状が発せられている旨を告げる<br>4. ただし、逮捕状は、逮捕後にできる限り速やかに示す<br><b>&lt;刑訴法の条文&gt;</b><br><b>第二百一条</b><br>2 第七十三条第三項の規定は、逮捕状により被疑者を逮捕する場合にこれを準用する。<br><b>第七十三条</b><br>3 勾引状又は勾留状を所持しないためこれを示すことができない場合において、急速を要するときは、前二項の規定にかかわらず被告人に対して公訴事実の要旨及び令状が発せられている旨を告げて、その執行をすることができる。但し、令状は、できる限り速やかにこれを示さなければならない。", "arts": ["訴201", "訴73"], "first": "R2-06"}, {"id": "R2-08", "y": "R2", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、乙は、Aに対して「覚せい剤取締法違反」で逮捕する旨告げて逮捕したが、これだけで被疑事実の要旨を告知したことになるのか。<br>これだけでは、要旨を告知したことにならないのではないか。", "a": "甲は、Aから職務質問を受けた際に任意採尿を求められており、その覚せい剤使用にかかる嫌疑で逮捕されたことを<b>知ることができる</b>ため、覚せい剤取締り法違反という限度でも、被疑事実の要旨の告知として十分である。", "arts": ["訴73"], "first": "R2-06"}, {"id": "R2-09", "y": "R2", "sn": 2, "sc": "場面設定2（1日目）", "q": "先ほどの事案で、Aが乙に逮捕されそうになった際に、乙を突き飛ばして怪我を負わせたという事情があった。この場合、Aの罪責は?", "a": "公務執行妨害罪(刑法95条1項)と傷害罪(204条)の観念的競合(54条1項前段)", "arts": ["刑95", "刑54"], "first": "R2-06"}, {"id": "R2-10", "y": "R2", "sn": 2, "sc": "場面設定2（1日目）", "q": "公務執行妨害罪では、職務の適法性が要件になる。では、Aが、乙の行為を違法だと思っていた場合、具体的には、令状を現実に示されなければ逮捕できないと思っており、乙の行為は違法だと認識していた場合、同罪は成立するか。", "a": "成立する。", "arts": ["刑95", "刑38"], "first": "R2-10"}, {"id": "R2-11", "y": "R2", "sn": 2, "sc": "場面設定2（1日目）", "q": "なぜか。", "a": "まず、職務の適法性要件は、規範的構成要件要素として、故意の対象となる。<br>そして、Aの認識では、職務の適法性に関して錯誤があるようにも思われるので、故意が阻却されると思える。しかし、これは、事実の錯誤ではなく法律の錯誤に過ぎない。<br>事実の錯誤と法律の錯誤の違いは、前者が、職務の適法性を基礎づける事実すら認識できていない場合をいい、後者は、職務の適法性を基礎づける認識はあるが、評価を誤った場合をいう。<br>まず、違法性の意識は不要である。もっとも、違法性の意識の可能性すらない場合、つまり違法性の意識を持つために必要な事実の認識を欠く場合が事実の錯誤となり、故意が阻却される。他方、違法性の意識の可能性がある場合、つまり違法性の意識を持つために必要な事実の認識はある場合が法律の錯誤であり、故意が阻却されない。(二分説)<br>本件では、Aは、<b>職務の適法性を基礎づける事実は認識できており</b>、<b>違法性の意識の可能性</b>があったから、職務の適法性についての法的評価を誤ったに過ぎず、<b>法律の錯誤</b>になる。", "arts": ["刑95", "刑38"], "first": "R2-10"}, {"id": "R2-12", "y": "R2", "sn": 2, "sc": "場面設定2（1日目）", "q": "では、Aが、被疑事実の要旨の告知や逮捕状が発布されている旨を聞き漏らした。この状況で、Aに公務執行妨害罪は成立するか。", "a": "成立しない。", "arts": ["刑95"], "first": "R2-10"}, {"id": "R2-13", "y": "R2", "sn": 2, "sc": "場面設定2（1日目）", "q": "なぜか。", "a": "被疑事実の要旨の告知や逮捕状が発布されている旨は、職務の適法性を基礎づける事実である。この事実すら認識できていないのならば、違法性の意識を持つために必要な事実の認識を欠くため、<b>事実の錯誤にあたり、故意が阻却</b>される。", "arts": ["刑95"], "first": "R2-10"}, {"id": "R2-14", "y": "R2", "sn": 2, "sc": "場面設定2（1日目）", "q": "しかし、それでは、Aが偶然認識できたか否かに左右され不当ではないか。", "a": "反対動機の形成可能性すらなかったのだから、故意が阻却されると考えても止むを得ない。", "arts": [], "first": "R2-10"}, {"id": "R2-15", "y": "R2", "sn": 3, "sc": "場面設定3（2日目）", "q": "<b>事例</b><br>甲は、Vに対して10万円を貸したところ、返済時期が来たのに、返済してくれなかった。<br>そのため、Aは、Vに対して何度も電話をかけて会おうとしたが、電話に出なかった。そこで、Aは、Vの自宅へ赴いて弁済を求めたところ「Vは返さない、そもそも借りていない。」と言って来た。<br>そのため、Aは「この野郎、返さないというのであれば5万円を追加して15万円を返せ。返さないならぶっ殺す。」と凄んだところ、VはAの態度に畏怖して、15万円を支払った。<br>この場合にAに成立する犯罪は何か。", "a": "15万円全部に、恐喝罪が成立する。(刑法249条)<br><b>（恐喝）</b><br><b>第二百四十九条</b><br>人を恐喝して財物を交付させた者は、十年以下の拘禁刑に処する。<br>２　前項の方法により、財産上不法の利益を得、又は他人にこれを得させた者も、同項と同様とする。", "arts": ["刑249"], "first": "R2-15"}, {"id": "R2-16", "y": "R2", "sn": 3, "sc": "場面設定3（2日目）", "q": "あなたは、財産的損害についてどのような立場に立つのか。", "a": "個別的財産の罪。", "arts": ["刑249"], "first": "R2-15"}, {"id": "R2-17", "y": "R2", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、恐喝罪の成否に関して、どのような点が問題になると考えるか。", "a": "1. 構成要件該当性(<b>財産的損害がないのではないか</b>)<br>2. 違法性阻却(正当な権利行使の範囲内といえるのではないか)<br>の2点が問題になる。", "arts": ["刑249"], "first": "R2-15"}, {"id": "R2-18", "y": "R2", "sn": 3, "sc": "場面設定3（2日目）", "q": "Aは、Vに対して、10万円の債権を有しているが、その場合でも、なぜ、10万円部分に関して恐喝罪が成立するのか。", "a": "10万円についてVという「他人の財物」であるにせよ、本来Vは、Aに対して10万円の返還債務を負うため、財産的損害がないのではないか問題になる。 (1構成要件該当性の問題)<br>適法に占有している現金を違法な恐喝行為により移転することと、弁済により消滅させることは財産的価値として次元が異なるし(基本刑法各論より。)同額の債権と現金とでは経済的価値が異なる。よって、財産的損害が認められる。<br>(*他人が別の原因で得た現金は、242条の適用せずに、他人の財物に当たる。)<br>(*他人に貸していた動産については、242条を適用して初めて、他人の財物に当たる。)<br><b>（他人の占有等に係る自己の財物）</b><br><b>第二百四十二条</b><br>自己の財物であっても、他人が占有し、又は公務所の命令により他人が看守するものであるときは、この章の罪については、他人の財物とみなす。", "arts": ["刑242"], "first": "R2-15"}, {"id": "R2-19", "y": "R2", "sn": 3, "sc": "場面設定3（2日目）", "q": "では、違法性阻却される余地があるのはなぜか。", "a": "違法性の実質は社会倫理規範違反にもあるため、<b>正当な権利行使の範囲と言えるならば</b>、 <b>社会的に相当</b>といえ、違法性阻却の余地があると言えるため。", "arts": [], "first": "R2-15"}, {"id": "R2-20", "y": "R2", "sn": 3, "sc": "場面設定3（2日目）", "q": "本件に当てはめてみよ。", "a": "本件では、Vはすでに弁済期を経過していながら、10万円という一定程度の額につき借りていないと言って弁済していないため、ある程度強めに返還を求めないと返済が得られない上、<br>1対1でなされており、凶器なども使われていないため社会的に相当とも言いうる。<br>しかし、Aは、Vに対してぶっ殺すと生命に対する加害言動をした上、5万円の上乗せを求めて凄んでおり、行為態様の点や正当な権利の範囲を上回る請求をしており、<b>社会的に相当な範囲を逸脱しており、正当な権利行使とは言えない</b>ため、違法性阻却されない。", "arts": [], "first": "R2-15"}, {"id": "R2-21", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "<b>事例</b><br>甲は、Vに対して10万円を貸していましたが、Vはこれを返済せずに夜逃げしてしまったため、甲は、Vを探し回っていた。<br>一方、乙は、Vに対しては以前から恨みを持っており、同人を殺したいと思っていた。<br>そこで、甲に対してVの住むマンションの部屋の場所を伝え、Vを殺害して金品を奪うように唆した。これを受けて甲は、知り合いである丙に対して、殺害をする目的であることを隠して、金品を奪う計画を伝えて、同人とともにVの部屋へ向かった。<br>そこで、甲と丙は、宅急便の配達を装ってVを呼び出し、応対したVに対して丙が包丁を突きつけて「金を出せ。出さないと殺すぞ。」と言い、これを恐れたVは、丙に金品を交付した。<br>この間、甲は部屋の外で、Vの部屋のドアを押さえ続けていた。甲と丙には、何罪が成立するか。", "a": "甲と丙には、住居侵入罪及び1項強盗既遂罪の共同正犯が成立する。", "arts": ["刑236", "刑130"], "first": "R2-21"}, {"id": "R2-22", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、強盗罪の客観的構成要件は?", "a": "暴行又は脅迫、他人の財物、強取つまり反抗抑圧程度の暴行脅迫を用いて財物奪取すること。", "arts": ["刑236"], "first": "R2-21"}, {"id": "R2-23", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "暴行・脅迫の程度はどの程度か。", "a": "客観的に、相手方の反抗を抑圧する程度<br><b>&lt;判例&gt;</b><br>反抗を抑圧するに足りる程度の暴行・脅迫であるか否かは、その暴行又は脅迫が「社会通念上一般に被害者の反抗を抑圧するに足る程度のものであるかどうかと云う客観的基準によって決せされるのであって、具体的事案の被害者の主観を基準としてその被害者の反抗を抑圧する程度であったかどうかと云うことによって決せられるものではない。」(最高裁判例S24.2.8)", "arts": ["刑236"], "first": "R2-21"}, {"id": "R2-24", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "どのように判断するか。", "a": "客観的に判断する。<br>具体的には、人数、体格、性別、凶器使用の有無、使用方法、行われた場所などから判断", "arts": ["刑236"], "first": "R2-21"}, {"id": "R2-25", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "本件に当てはめてみよ。", "a": "本件では、直接の実行行為を行なったのは丙のみである。<br>しかし、甲がVの部屋の<b>玄関ドアを外から押さえていたためVが逃げ出せない状況</b>となったV の部屋内という<b>密室</b>で、丙は、Vに<b>包丁という殺傷性の高い凶器</b>を突きつけながら「金を出せ出さないと<b>殺すぞ。」迫り生命加害の脅迫</b>をしている。<br>そのため、客観的に反抗抑圧する程度の脅迫を加えたと言える。", "arts": ["刑236"], "first": "R2-21"}, {"id": "R2-26", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、仮にVが豪胆な人物であり、全く反抗抑圧されなかったが、借りた金なので止むを得ないから返済しようと考えて10万円を差し出した場合はどうか。", "a": "強盗罪の実行行為である暴行・脅迫は、相手方の主観によって左右されるのではなく、客観的に反抗抑圧する程度の暴行・脅迫だったかが問題になるので、本問では、結論が左右されず、強盗既遂罪が成立する。<br>*ここでは、主観的な点に焦点を当ててしまうと、豪胆な人物のケースで、反抗抑圧されていない→未遂という結論になってしまいかねず、この場合客観説からは論理矛盾のため追及される。実際に相手方が反抗抑圧されたことが必要なのは、通説の立場からであり、判例からは反抗が実際に抑圧されたことは不要なので注意。", "arts": ["刑236"], "first": "R2-21"}, {"id": "R2-27", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、Vが特に臆病な性格であり、客観的には反抗抑圧に足りない程度の脅迫だったのに、反抗が抑圧された場合はどうか。", "a": "客観説→争いがある。<br>- <b>1説：</b><br>被害者が臆病であることを行為者が認識して軽微な暴行・脅迫を加えた場合には犯行を抑圧するに足りる暴行・脅迫になるとの説<br>- <b>〔理由〕</b><br>- 暴行・脅迫の程度を客観的に判断することと，その判断の基礎事情に行為者の認識内容を取り込むこととは必ずしも矛盾しない。<br>- <b>2説：</b><br>強盗罪の実行行為としての暴行・脅迫の存否は客観的に判断されるべきであり，強盗罪は成立しないとする説(恐喝罪が成立する)<br>- <b>〔理由〕</b><br>- 行為者の主観により結論に差を設けるべきではなく，強盗手段としての定型性を欠く軽微な暴行・脅迫については構成要件該当性を認めることはできない。<br>*ここは、結論がどちらでも良いと思われるが、論理矛盾しにくい2説の方が説明は楽。", "arts": ["刑236", "刑249"], "first": "R2-21"}, {"id": "R2-28", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、最初の事例に戻り、丙の脅迫に応じて、Vが金品を交付した後、丙がさらにお金が欲しいと思い、再度Vを脅迫したところ、動揺したVがベランダの方へ逃げて行き、ベランダ伝いに隣の部屋へ移ろうとしたが足を滑らせて地上に落下し、死亡した。この場合、甲と丙の罪責はどうなるか。", "a": "甲と丙は住居侵入罪及び強盗致死罪の共同正犯となる。", "arts": ["刑240"], "first": "R2-28"}, {"id": "R2-29", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "甲には殺意があるのでは?", "a": "丙が脅迫した時点では、<b>未だ、殺人の実行行為があったとはいえず</b><b>、</b>強盗殺人にならない。", "arts": ["刑240"], "first": "R2-28"}, {"id": "R2-30", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、強盗殺人罪は、刑法240条の文言から、殺人の故意がある場合は含まれないという立場があるが、これについてどう考えるか。", "a": "刑法240条の趣旨は、強盗の機会には人の殺傷の結果が伴いやすいことが刑事学上顕著であるため死刑又は無期という極めて重い刑罰を定めている。<br>また、条文の文言も、結果的加重犯にみられる「よって」がない。<br>仮に、故意形態を含まないと解して故意形態は殺人と強盗致死罪の観念的競合になるとすると、死の二重評価という問題がある。<br>さらに、殺人と強盗罪の観念的競合とすると、過失犯より罪の下限がかえって軽くなるという不均衡がある。そのため、故意犯形態を包含すると解する。<br><b>（強盗致死傷）</b><br><b>第二百四十条</b><br>強盗が、人を負傷させたときは無期又は六年以上の拘禁刑に処し、死亡させたときは死刑又は無期拘禁刑に処する。", "arts": ["刑240"], "first": "R2-28"}, {"id": "R2-31", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "結局甲と丙は、住居侵入罪と強盗致死罪の被疑事実で身柄拘束され、その後、同じ事実で起訴された。そして、乙についても、強盗の教唆犯として逮捕状が発布されており、捜査機関がその所在を探していた。<br>弁護士であるあなたは、乙から、甲の弁護人となり、乙の関与を否定する証言をさせるように依頼を受けたとする。<br>この依頼を受任することについて問題はあるか。", "a": "弁護士職務基本規程の違法行為の助長(14条)にあたりうる。<br>また、正当な利益の実現(21条)、自由と独立(20条)との関係でも問題がある。<br>なお、実際に虚偽の証言をさせることは、偽証のそそのかし(75条)に当たるため問題がある。<br><b>（偽証のそそのかし）</b><br><b>第七十五条</b><br>弁護士は、偽証若しくは虚偽の陳述をそそのかし、又は虚偽と知りながらその証拠を提出してはならない。", "arts": ["職14", "職75"], "first": "R2-31"}, {"id": "R2-32", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "甲と丙は、いずれも公訴事実を全て認めていた。<br>両者の事件については、併合審理されることとなり、公判前整理手続に付されることとなった。そこで、甲の弁護人は、検察官請求証拠のうち、丙の検察官面前調書の一部につき不同意とし、その他の証拠については同意した。<br>この場合、裁判所は、この丙の検察官面前調書について証拠とすることができるか。", "a": "この時点では、伝聞例外の同意(刑訴法326条)がなく、刑訴法321条1項2号後段にも当たるか否か確定しないから、この時点で証拠として採用することはできない。", "arts": ["訴326", "訴321-1"], "first": "R2-32"}, {"id": "R2-33", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、伝聞例外の該当性につき、丙は、共同被告人なのだから、322条1項の要件を満たせば証拠とすることができるという見解があるが、これについてどう考えるか。", "a": "共同被告人は、あくまで第三者である。<br>よって、322条1項によることはできず、321条1項2号によるべきである。<br><b>第三百二十一条　</b><br>被告人以外の者が作成した供述書又はその者の供述を録取した書面で供述者の署名若しくは押印のあるものは、次に掲げる場合に限り、これを証拠とすることができる。<br>一　裁判官の面前（第百五十七条の六第一項及び第二項に規定する方法による場合を含む。）における供述を録取した書面については、その供述者が死亡、精神若しくは身体の故障、所在不明若しくは国外にいるため公判準備若しくは公判期日において供述することができないとき、又は供述者が公判準備若しくは公判期日において前の供述と異なつた供述をしたとき。<br>二　検察官の面前における供述を録取した書面については、その供述者が死亡、精神若しくは身体の故障、所在不明若しくは国外にいるため公判準備若しくは公判期日において供述することができないとき、又は公判準備若しくは公判期日において前の供述と相反するか若しくは実質的に異なつた供述をしたとき。ただし、公判準備又は公判期日における供述よりも前の供述を信用すべき特別の情況の存するときに限る。<br><b>第三百二十二条</b><br>被告人が作成した供述書又は被告人の供述を録取した書面で被告人の署名若しくは押印のあるものは、その供述が被告人に不利益な事実の承認を内容とするものであるとき、又は特に信用すべき情況の下にされたものであるときに限り、これを証拠とすることができる。但し、被告人に不利益な事実の承認を内容とする書面は、その承認が自白でない場合においても、第三百十九条の規定に準じ、任意にされたものでない疑があると認めるときは、これを証拠とすることができない。<br>２　被告人の公判準備又は公判期日における供述を録取した書面は、その供述が任意にされたものであると認めるときに限り、これを証拠とすることができる。", "arts": ["訴322", "訴321-1"], "first": "R2-32"}, {"id": "R2-34", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、322条1項によることができないとして、丙を証人として尋問できるか。", "a": "できない。<br>なぜなら、甲と丙の審理は、併合審理されており、丙も被告人である以上は証人適格がない。また、被告人である以上は包括的な黙秘権がある(憲法38条1項、刑訴法311条1項) ため、証人のように証言拒絶事由(刑訴法144から149条)がない限り証言を強制(刑訴法160条)させることができないため。", "arts": ["訴311"], "first": "R2-32"}, {"id": "R2-35", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、丙の証言を証拠として用いたい場合、どのような方法をとるか。", "a": "1. <b>被告人質問</b>として行う方法(刑訴法311条3項)<br>2. 甲と丙の審理を分離して、甲の公判において丙を証人として尋問する方法がある。<br><b>第三百十一条　</b><br>被告人は、終始沈黙し、又は個々の質問に対し、供述を拒むことができる。<br>２　被告人が任意に供述をする場合には、裁判長は、何時でも必要とする事項につき被告人の供述を求めることができる。<br>３　陪席の裁判官、検察官、弁護人、共同被告人又はその弁護人は、裁判長に告げて、前項の供述を求めることができる。", "arts": ["訴311"], "first": "R2-32"}, {"id": "R2-36", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "では、一度分離した甲と丙の審理を、再度併合することができるか。", "a": "できない。", "arts": [], "first": "R2-32"}, {"id": "R2-37", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "なぜか。", "a": "丙は本来であれば包括的な黙秘権がありながら、分離によって証人となった場合には、証言拒絶事由以外の証言を強制される。<br>そして、これが<b>事後になって併合された場合は、証人となった際に、証言拒絶事由以外で不利益な事実の供述が強制され、この供述について、自己に不利益な認定をされる懸念</b>がある。<br>そのため、再度併合することはできない。", "arts": [], "first": "R2-32"}, {"id": "R2-38", "y": "R2", "sn": 4, "sc": "場面設定4（2日目）", "q": "しかし、弁論併合されたからといっても、直ちに証拠として採用されるわけではないのだからさほど問題はないのでは?", "a": "裁判官であれば、職業的な経験から心証形成を区別しうるため弊害はないようにも思える。<br>しかし、本件は、<b>裁判員裁判事件</b>であるため<b>裁判員たちに不当な心証を与える懸念</b>がある。よって、できない。", "arts": [], "first": "R2-32"}, {"id": "R3-01", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "甲が、自動車を運転して他人を死亡させたとして過失運転致死罪により警察官丙からの取り調べを受けることになった。<br>この時に甲は、警察官丙に対して「自分の車は盗まれたので、私は犯人ではない。」と虚偽の供述をした。<br>この場合、甲に犯人隠避罪は成立するか。", "a": "成立しない。", "arts": ["刑103"], "first": "R3-01"}, {"id": "R3-02", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "理由は?", "a": "1：<b>条文の文言</b>が「隠避させた者」となっており、犯人以外を前提。<br>2：犯人自身の場合、官憲による発見逮捕を免れる行為は<b>期待可能性がない</b>。", "arts": ["刑103"], "first": "R3-01"}, {"id": "R3-03", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "甲が乙に対し、警察官丙へ「甲は1年前に車を盗まれたと言っていた」と虚偽供述をして欲しい旨依頼し、実際に乙は丙に対してその通りの虚偽供述をした。この場合、乙に犯人隠避罪は成立するか。", "a": "成立する。", "arts": ["刑103", "刑61"], "first": "R3-01"}, {"id": "R3-04", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、この場合に甲には犯罪は成立するか。", "a": "犯人隠避罪の教唆犯が成立する。", "arts": ["刑103", "刑61"], "first": "R3-01"}, {"id": "R3-05", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "それはなぜか。", "a": "1：他人を巻き込む場合にまで<b>期待可能性がないとは言えない</b>。<br>2：<b>防御権の濫用</b>だからである。", "arts": ["刑103", "刑61"], "first": "R3-01"}, {"id": "R3-06", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、甲が逮捕された後、乙が警察官丙に対して先ほどと同じ内容で虚偽供述をした。この場合、乙に犯人隠避罪は成立するか。", "a": "成立する。", "arts": ["刑103"], "first": "R3-01"}, {"id": "R3-07", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "犯人隠避罪の保護法益は何か。", "a": "国家の刑事司法作用", "arts": ["刑103"], "first": "R3-01"}, {"id": "R3-08", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "この場合、どのような作用が害されるのか。", "a": "<b>犯人特定作用</b>と、<b>犯人拘束作用</b>が害される。", "arts": ["刑103"], "first": "R3-01"}, {"id": "R3-09", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "すでに甲の身柄は確保されており拘束作用は害されないようにも思われるが、この場合でも成立するのか。", "a": "犯人特定作用を害する結果、身柄拘束が解かれてしまうこともありうるから成立する。", "arts": ["刑103"], "first": "R3-01"}, {"id": "R3-10", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、乙が丙に虚偽供述したことについて、証拠偽造罪は成立するか。", "a": "成立しない。", "arts": ["刑104", "刑169"], "first": "R3-01"}, {"id": "R3-11", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "証拠偽造罪の偽造は、<b>証拠自体の偽造</b>を指す。<br><b>虚偽供述については偽証罪(169)に限って罰する</b> 趣旨だから、この場合に証拠偽造罪を成立させると、虚偽供述を偽証罪以外のケースで罰することになってしまうため。", "arts": ["刑104", "刑169"], "first": "R3-01"}, {"id": "R3-12", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "供述録取書に署名押印した場合はどうか。", "a": "成立しない。", "arts": ["刑104"], "first": "R3-01"}, {"id": "R3-13", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "内容に誤りがないことを確認する意味しかなく、<b>積極的に証拠自体を偽造したわけではない</b>ため。", "arts": ["刑104"], "first": "R3-01"}, {"id": "R3-14", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、乙が自ら虚偽内容の書面を作成して警察官丙に提出した場合はどうか。", "a": "供述書(供述調書ではなく、作成者が直筆で記載した文書)は、積極的に証拠自体を偽造したことになるので、証拠偽造罪が成立する。", "arts": ["刑104"], "first": "R3-01"}, {"id": "R3-15", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、甲と丙が共同して虚偽供述を供述調書にした場合はどうか。", "a": "この場合には、供述調書の形をとっているだけで、供述書のように積極的に証拠自体を偽造したことと同じなので、証拠偽造罪の共同正犯が成立する。", "arts": ["刑104"], "first": "R3-01"}, {"id": "R3-16", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "警察官は、甲を過失運転致死罪で起訴した。<br>この場合、検察官は、交通事故に関する実況見分調書を証拠調べ請求した。<br>これに対して弁護人は、証拠調べに不同意(刑訴法326)とした。では、検察官はこれを証拠とするため伝聞例外に当たると反論したい。<br>この場合の伝聞例外の根拠条文は何か。", "a": "刑訴法<b>321条3項</b>", "arts": ["訴321-3", "訴326"], "first": "R3-16"}, {"id": "R3-17", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "検察官は、321条3項により伝聞例外が認められるようにするため何をすべきか。", "a": "作成した<b>警察官を証人尋問請求</b>し、その警察官に<b>公判廷において真正作成証言</b>をしてもらう。", "arts": ["訴321-3"], "first": "R3-16"}, {"id": "R3-18", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "真正作成証言とは?", "a": "実況見分が適正に実施され、その実施結果の内容真正、作成名義の真正", "arts": ["訴321-3"], "first": "R3-16"}, {"id": "R3-19", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜ検察官は実況見分を作成した捜査官を証人尋問請求するのではなく、<b>実況見分調書</b>を証拠調べ請求したのか。", "a": "口頭よりも<b>書面の方が内容を正確に伝えやすい</b>ため。", "arts": [], "first": "R3-16"}, {"id": "R3-20", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "実況見分調書が証拠採用されたとする。<br>この場合、裁判所は、交通事故発生地点Xと目撃者Aの目撃地点A間が⚪メートルだったと認定することができるか。", "a": "できる。", "arts": ["訴321-3"], "first": "R3-16"}, {"id": "R3-21", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "この場合の測定結果は、<b>実況見分調書の一部として証拠能力</b>が認められるから。 (要するに現場の観察結果を記載したものだから作成者以外の者の伝聞ではないから)", "arts": ["訴321-3"], "first": "R3-16"}, {"id": "R3-22", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、実況見分に、イ地点が甲がスマートフォンを見ていた地点であるとして、目撃者Aが説明供述したことが記載されているが、これをもって甲の脇見運転事実を認定することができるか。", "a": "できない。", "arts": ["訴321-1"], "first": "R3-16"}, {"id": "R3-23", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "なぜか。", "a": "甲が脇見運転したかどうかは立証趣旨との関係で内容真実性が問題となり伝聞となる。そして、Aの署名押印が実況見分調書にないため、伝聞例外の署名押印要件を満たさない。", "arts": ["訴321-1"], "first": "R3-16"}, {"id": "R3-24", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "これを認定してもらうために検察官はどうすべきか。", "a": "目撃者Aにより証人として証言してもらう。", "arts": ["訴321-1"], "first": "R3-16"}, {"id": "R3-25", "y": "R3", "sn": 1, "sc": "場面設定1（1日目）", "q": "では、裁判所は、この実況見分調書からどのような事実が認定できるのか。", "a": "イの地点が、目撃者Aが、甲がスマートフォンを見ていた地点と説明した地点であること。 (これであれば、Aからの伝聞にならない。)", "arts": ["訴321-3"], "first": "R3-16"}, {"id": "R3-26", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "事例 Vは、ホテルに宿泊し、部屋に一眼レフカメラを置き、浴場で入浴していた。同ホテルに宿泊していたAは、浴場の脱衣所でVの部屋のを盗み、Vの部屋からカメラを換金目的で持ち去った。<br>この場合、AがVのカメラを持ち去った行為について罪責を述べよ。", "a": "窃盗既遂罪(刑法235条)", "arts": ["刑235"], "first": "R3-26"}, {"id": "R3-27", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "窃盗罪の客観的構成要件を述べよ。", "a": "1：他人の占有する財物を<br>2：窃取すること<br>(Q：主観的構成要件は?→A：<b>不法領得の意思と故意</b>)", "arts": ["刑235"], "first": "R3-26"}, {"id": "R3-28", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "窃取とは何か。", "a": "他人の占有する財物を占有者の意思に反して自己または第三者の占有に移転すること。", "arts": ["刑235"], "first": "R3-26"}, {"id": "R3-29", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "この場合(窃盗における)の占有とは何か。", "a": "物に対する事実上の支配", "arts": ["刑235"], "first": "R3-26"}, {"id": "R3-30", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "占有はどのように判断される?", "a": "1：占有の事実と<br>2：占有の意思", "arts": ["刑235"], "first": "R3-26"}, {"id": "R3-31", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "今回の事例で、Vの、カメラに対する占有は認められるか、今述べた基準に沿って当てはめよ。", "a": "部屋のはVが一応所持しており、第三者の立ち入りは許されておらず占有の事実がある。<br>施錠していること、入浴のために一時的に部屋を離れたにすぎないから占有の意思もある。よって、占有が認められる。", "arts": ["刑235"], "first": "R3-31"}, {"id": "R3-32", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "では事例を変更する。<br>Vは、部屋にカメラを置き忘れたことに気づかない状態でホテルをチェックアウトした。その後、Vが宿泊した部屋の前を通りかかったAが、その部屋のドアから侵入してカメラを持ち去った。なお部屋のドアは無施錠とする。<br>この場合のAの罪責を述べよ。", "a": "窃盗既遂罪が成立する。", "arts": ["刑235"], "first": "R3-32"}, {"id": "R3-33", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "誰の占有が侵害されているのか。", "a": "ホテル管理者の占有", "arts": ["刑235"], "first": "R3-32"}, {"id": "R3-34", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "ホテル管理者はカメラが置き忘れられていることに気づいていないが、それでも占有は認められるのか。先ほどの基準で当てはめてみよ。", "a": "ホテルの客室はチェックアウト後はホテル管理者の管理下に移る。また、ホテルの客室は他者の出入りを予定しておらず公開性が低い。そのため、Aのチェックアウト後は部屋内にある物品に対してホテル管理者の占有の事実が認められる。占有の意思も、チェックアウトと同時に部屋内の物品に対し包括的に及ぶため認められる。よって、占有が認められる。", "arts": ["刑235"], "first": "R3-32"}, {"id": "R3-35", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "では事例を変更する。<br>Vがホテルのロビーにカメラを置き忘れて帰宅したとする。この場合、Aがカメラを持ち去ったとして、Aの罪責を述べよ。", "a": "占有離脱物横領罪(254条)", "arts": ["刑254", "刑235"], "first": "R3-35"}, {"id": "R3-36", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜか", "a": "占有の事実に関し、Aはすでに時間的場所的に離隔しているため認められない。<br>また、<b>Aは置き忘れて</b>いることから<b>占有の意思もない</b>。<br>次に、<b>ホテルのロビーは</b>、ホテル客室と比べて一般的に公開性が高く、カメラも大きくないことから<b>ホテル管理者の包括的占有は及ばない</b>。<br>そのためホテル管理者の占有の事実も認められないことから、占有離脱物に当たる。<br>これを換金目的で持ち去っているため、横領といえ、占有離脱物横領罪になる。", "arts": ["刑254", "刑235"], "first": "R3-35"}, {"id": "R3-37", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "この場合、どういう構造なら窃盗罪になり得るのか。", "a": "<b>公開性が全くないような場所</b>と言える場合。", "arts": ["刑254", "刑235"], "first": "R3-35"}, {"id": "R3-38", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "事例を変更する。<br>Aが、ホテルのロビーからカメラを持ち去ったという事案で、Aが逮捕された。そして、罪証隠滅のおそれ及び逃亡のおそれがあるとの理由で勾留され、その後起訴された。この事件をJ裁判官が公判の担当をすることになったが、検察官は改めて<b>勾留請求</b>する必要があるのか。", "a": "ない。", "arts": ["訴60"], "first": "R3-38"}, {"id": "R3-39", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "理由は?", "a": "<b>被告人勾留</b>については、<b>検察官に請求権限はない</b>。<br>この場合には、自動的に被告人勾留へ切り替わるため。<br>(※起訴前の被疑者勾留は検察官に請求権限あり刑訴法204~208の2)", "arts": ["訴60"], "first": "R3-38"}, {"id": "R3-40", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "あなたがAの弁護人であるとして、Aの身体を解放する手段は何が考えられるか。", "a": "<b>保釈請求</b>", "arts": ["訴280", "規187"], "first": "R3-38"}, {"id": "R3-41", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、起訴後3日の段階(第一回公判期日前)の時、保釈の請求先はどこになるのか。", "a": "当該事件を受訴した裁判所の、当該事件を担当する裁判官以外の裁判官 (刑訴法280条1項、規則187条1項)", "arts": ["訴280", "規187"], "first": "R3-38"}, {"id": "R3-42", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "本件では?", "a": "受訴裁判所の、J裁判官以外の裁判官", "arts": ["訴280", "規187"], "first": "R3-38"}, {"id": "R3-43", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "なぜ、そのような裁判官に対してでないと、保釈の請求ができないのか。", "a": "<b>予断排除</b>のため", "arts": ["憲37", "訴256-6"], "first": "R3-38"}, {"id": "R3-44", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "予断排除というと具体的には?", "a": "受訴裁判所を構成する裁判官があらかじめ訴訟資料に触れてしまうと、その者が犯人であるかもしれないとの予断が生じた状態で裁判をすることとなり<b>「公平な」裁判ができなくなる</b>。<br>そのため、そのような問題を排除すること。", "arts": ["憲37", "訴256-6"], "first": "R3-38"}, {"id": "R3-45", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "それは憲法上だと、どの条文の要請か。", "a": "<b>憲法37条1項</b>「公平な裁判所」の要請 (刑訴法は、256条6項)", "arts": ["憲37", "訴256-6"], "first": "R3-38"}, {"id": "R3-46", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "公判の冒頭手続きでは、何をするか。", "a": "1：人定質問(<b>規則196</b>)<br>2：起訴状朗読(<b>刑訴法291条1項</b>)<br>3：権利告知(刑訴法291条<b>4項</b>、<b>規則197</b>)<br>4：罪状認否(刑訴法291条<b>4項)</b>", "arts": [], "first": "R3-38"}, {"id": "R3-47", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "人定質問において、Aが氏名を黙秘することは認められるか。", "a": "認められない。", "arts": ["訴311"], "first": "R3-38"}, {"id": "R3-48", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "包括的な黙秘権が認められているから(刑訴法311条1項)認められるのでは?", "a": "氏名を述べることは、原則として不利益にならないから、認められない。<br>※氏名によって被告人と犯人との同一性が認められるような場合や、氏名が明らかになると前科が明らかとなり累犯加重や常習犯が成立する場合には、例外的に氏名も黙秘の対象となりうる。 (『基本刑訴』手続き理解p.111)", "arts": ["訴311"], "first": "R3-38"}, {"id": "R3-49", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、それでもなおAが氏名を黙秘する場合はどうか。", "a": "<b>検察官に氏名を聞く</b>。", "arts": ["訴218-3"], "first": "R3-38"}, {"id": "R3-50", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "検察官もAの氏名を知らない場合はどうするのか。", "a": "検察官は、<b>逮捕時点にAの容姿写真を撮影した写真</b>を持っている(<b>刑訴法218条3項</b>)ので、この提供を受けて人物特定する。", "arts": ["訴218-3"], "first": "R3-38"}, {"id": "R3-51", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "では、Aが弁護人にカメラの弁償金を立て替えて欲しいと言ってきた場合、立て替えできるか。", "a": "原則はできない。 <b>弁護士職務基本規定25条</b>の依頼者との金銭貸借に当たるため。<br>(ただし困窮などで「特別の事情」があれば別である。)<br><b>（依頼者との金銭貸借等）</b><br><b>第二十五条</b><br>弁護士は、特別の事情がない限り、依頼者と金銭の貸借をし、又は自己の債務について依頼者に保証を依頼し、若しくは依頼者の債務について保証をしてはならない。", "arts": ["職25"], "first": "R3-38"}, {"id": "R3-52", "y": "R3", "sn": 2, "sc": "場面設定2（2日目）", "q": "この条文の趣旨は？", "a": "弁護士が<b>独立性を確保</b>し、依頼者との<b>信頼関係を確保</b>すること(大島本入門P445)", "arts": ["職25"], "first": "R3-38"}], "items": [{"id": "H23-q01", "y": "H23", "src": ["H23-01"], "t": "mc", "q": "共犯事件で勾留された甲乙（犯行は認めている）。弁護人Aが釈放のためにとる不服申立てはどれか。", "e": "逃亡のおそれ・罪証隠滅のおそれ（60条1項2号・3号）や勾留の必要性がないことを主張する。", "arts": ["訴429", "訴60"], "c": ["勾留の裁判に対する準抗告（刑訴法429条1項2号）", "抗告（刑訴法419条）", "勾留理由開示請求（刑訴法82条）", "控訴"]}, {"id": "H23-q02", "y": "H23", "src": ["H23-02"], "t": "mc", "q": "甲に接見禁止決定がされたが、弁護人として甲と連絡を取る必要が生じた。どうするか。", "e": "81条の接見禁止は「第三十九条第一項に規定する者以外の者」との接見が対象。", "arts": ["訴81", "訴39"], "c": ["接見禁止は弁護人に及ばないので、そのまま接見する", "接見禁止の一部解除を申し立てる", "接見禁止決定に準抗告を申し立てる", "裁判所の許可を得て接見する"]}, {"id": "H23-q03", "y": "H23", "src": ["H23-03"], "t": "ox", "q": "接見禁止中の甲の母親が緊急に甲と連絡を取りたい場合、弁護人は接見禁止決定に対する不服申立てや、接見禁止の一部解除の申立てをすることができる。", "e": "起訴前に裁判官がした接見禁止なら不服申立ては準抗告（429条1項2号）、起訴後に裁判所がしたものなら抗告（419条）になる。", "arts": ["訴81"], "a": true}, {"id": "H23-q04", "y": "H23", "src": ["H23-04"], "t": "mc", "q": "共謀して傷害を加えた甲乙が共同正犯として起訴された。両名の弁護人としてどうすべきと答えたか。", "e": "弁護士職務基本規程28条3号・ただし書（元のノートは「28条3項」と表記）。刑事弁護では42条、46条（最善弁護）も問題になる。", "arts": ["職28", "職42", "職46"], "c": ["利益相反のおそれがあるので原則として辞任すべき。ただし双方が同意すれば継続できる", "同一事件なので当然に両名の弁護を続けてよい", "先に依頼を受けた者の弁護だけを続ける", "裁判所の許可があれば続けてよい"]}, {"id": "H24-q01", "y": "H24", "src": ["H24-01"], "t": "mc", "q": "Aが火災保険金をだまし取る目的で、A一人が住む自宅に放火した。放火について成立する罪はどれか。", "e": "保険に付した自己所有物は115条により他人所有とみなされる。欺罔行為がないので詐欺罪は実行の着手もない。", "arts": ["刑109", "刑115"], "c": ["他人所有非現住建造物等放火罪（109条1項・115条）", "現住建造物等放火罪（108条）", "自己所有非現住建造物等放火罪（109条2項）", "詐欺未遂罪のみ"]}, {"id": "H24-q02", "y": "H24", "src": ["H24-02"], "t": "ox", "q": "A一人が住む家への放火が現住建造物等放火罪にならないのは、108条の「人」に犯人自身は含まれないと解されるからである。", "e": "108条の保護法益は人の生命・身体・財産。犯人の自己加害は保護範囲に含まれない。", "arts": ["刑108"], "a": true}, {"id": "H24-q03", "y": "H24", "src": ["H24-03"], "t": "ox", "q": "Aが家族と同居する自宅に放火した。家族が一時外出中であったときは、現住性が失われ、現住建造物等放火罪は成立しない。", "e": "現住建造物は人の起臥寝食に使われる建物。一時的な外出なら現住性は失われない（判例）。", "arts": ["刑108"], "a": false}, {"id": "H24-q04", "y": "H24", "src": ["H24-04"], "t": "mc", "q": "消防士として15年勤務し、約20年火災原因調査に携わってきたBが、検察官の依頼で火災原因報告書を作成した。弁護人が不同意とした場合、検察官が主張する伝聞例外の根拠はどれか。", "e": "特別の学識経験に基づく報告書で、正確性・信用性が高く、書面の方が報告しやすい。私人に依頼した場合は321条4項の準用とする判例がある。", "arts": ["訴321-4"], "c": ["刑訴法321条4項", "刑訴法321条3項", "刑訴法321条1項3号", "刑訴法323条3号"]}, {"id": "H24-q05", "y": "H24", "src": ["H24-05"], "t": "ox", "q": "Bの火災原因報告書に321条3項が使えないのは、3項が作成主体を検察官・検察事務官・司法警察職員に限っているからである。", "e": "", "arts": ["訴321-3"], "a": true}, {"id": "H24-q06", "y": "H24", "src": ["H24-06"], "t": "mc", "q": "弁護人自身が現場に行って図面などを作成し、証拠として提出した。伝聞例外の根拠条文はどれか。", "e": "弁護人は特別の学識経験に基づいて図面を作成したわけではない。", "arts": ["訴321-1"], "c": ["刑訴法321条1項3号", "刑訴法321条4項", "刑訴法321条3項", "刑訴法323条3号"]}, {"id": "H24-q07", "y": "H24", "src": ["H24-07", "H24-08"], "t": "mc", "q": "321条4項で伝聞例外が認められる要件はどれか。", "e": "作成の真正＝B自身が作成したこと。内容の真正＝Bの記憶どおり偽りなく正確に記載したこと（実験過程の適正も含む）。", "arts": ["訴321-4", "訴321-3"], "c": ["作成者が証人尋問を受け、作成の真正と内容の真正について供述すること", "作成者の署名又は押印があること", "被告人が証拠とすることに同意すること", "特に信用すべき情況の下で作成されたこと"]}, {"id": "H24-q08", "y": "H24", "src": ["H24-09"], "t": "ox", "q": "Bは鑑定人として公判に呼び出すことになる。", "e": "証人として呼ぶ（刑訴法143条以下）。", "arts": [], "a": false}, {"id": "H24-q09", "y": "H24", "src": ["H24-10"], "t": "mc", "q": "火災原因報告書の採用決定があった。証拠書類の取調べ方法はどれか。", "e": "", "arts": ["訴305"], "c": ["朗読（305条）又は要旨の告知（規則203条の2）", "展示（306条）", "証人尋問", "裁判官による閲読のみ"]}, {"id": "H24-q10", "y": "H24", "src": ["H24-11"], "t": "ox", "q": "報告書に図や写真が添付されている場合、訴訟関係人に示す展示（306条）の方法によることも考えられる。", "e": "", "arts": [], "a": true}, {"id": "H24-q11", "y": "H24", "src": ["H24-12"], "t": "mc", "q": "裁判所の証拠決定に弁護人が不服を申し立てる方法はどれか。", "e": "", "arts": ["訴309", "規205"], "c": ["異議の申立て（309条1項、規則205条1項）", "抗告（419条）", "準抗告（429条）", "控訴でしか争えない"]}, {"id": "H24-q12", "y": "H24", "src": ["H24-13"], "t": "ox", "q": "証拠決定に対する異議は、決定が相当でないことを理由としても申し立てることができる。", "e": "証拠決定に対する異議は法令違反を理由とする場合に限られる（規則205条1項ただし書）。証拠能力のない伝聞証拠を採用したなら法令違反として異議を述べられる。", "arts": ["規205"], "a": false}, {"id": "H24-q13", "y": "H24", "src": ["H24-14"], "t": "mc", "q": "公判前整理手続で、検察官が火災原因報告書の要旨をまとめた捜査報告書を証拠調べ請求した。弁護人が元の火災原因報告書を見る手段はどれか。", "e": "元のノートでは同項4号（鑑定書類型）を挙げている。", "arts": ["訴316-15"], "c": ["類型証拠開示請求（316条の15第1項）", "主張関連証拠開示請求（316条の20）", "証拠保全請求（179条）", "公務所照会（279条）"]}, {"id": "H24-q14", "y": "H24", "src": ["H24-15"], "t": "mc", "q": "類型証拠開示請求の要件として求められないものはどれか。", "e": "予定主張との関連性は主張関連証拠開示（316条の20）の要件。", "arts": ["訴316-15"], "c": ["予定主張（316条の17）と請求証拠との関連性", "316条の15第1項各号の類型に該当すること", "検察官請求証拠の証明力を判断するために重要であること", "被告人の防御の準備のために開示が必要であること"]}, {"id": "H24-q15", "y": "H24", "src": ["H24-16"], "t": "ox", "q": "本件で類型証拠開示請求の基準となる「検察官請求証拠」は、火災原因報告書そのものである。", "e": "検察官請求証拠は要旨をまとめた捜査報告書。元の報告書と比べれば誤記載や重要事項の欠落がわかるので、証明力判断に重要といえる。", "arts": ["訴316-15"], "a": false}, {"id": "H24-q16", "y": "H24", "src": ["H24-17"], "t": "mc", "q": "弁護人が火災原因そのものも争おうと考えている。類型証拠開示以外に、火災原因報告書の開示を請求する方法はどれか。", "e": "予定主張（316条の17第1項）との関連性、防御の準備に必要な理由などを示して請求する。", "arts": ["訴316-20"], "c": ["主張関連証拠開示請求（316条の20）", "証拠保全請求（179条）", "弁護人による閲覧（40条）", "勾留理由開示請求（82条）"]}, {"id": "H24-q17", "y": "H24", "src": ["H24-18"], "t": "ox", "q": "類型証拠開示請求と主張関連証拠開示請求のどちらもできる場合、手続的に先行する類型証拠開示請求をすべきである。", "e": "先に開示されるので防御方針を立てやすい。", "arts": [], "a": true}, {"id": "H25-q01", "y": "H25", "src": ["H25-01"], "t": "mc", "q": "Aが金目の物を盗む目的で深夜B宅に侵入し、財布を懐中に入れたところBが目を覚ましたので、反抗を抑圧する程度の暴行を加えて逃走した。成立する罪はどれか。", "e": "占有の取得と確保を分けて強盗罪とする見解もある。", "arts": ["刑238", "刑130"], "c": ["住居侵入罪と事後強盗罪", "住居侵入罪と窃盗罪と暴行罪", "住居侵入罪と強盗致傷罪", "窃盗罪のみ"]}, {"id": "H25-q02", "y": "H25", "src": ["H25-02"], "t": "mc", "q": "事後強盗罪で、Aの暴行の目的として必要とされるものはどれか。", "e": "", "arts": ["刑238"], "c": ["逮捕を免れる・罪跡を隠滅する・財物の取返しを防ぐ、のいずれか", "財物を新たに奪取する目的", "被害者を傷害する目的", "単に現場から立ち去る目的"]}, {"id": "H25-q03", "y": "H25", "src": ["H25-03"], "t": "ox", "q": "事後強盗罪の暴行・脅迫は、窃盗の機会の継続中に、相手方の反抗を抑圧する程度のものでなければならない。", "e": "客観面：①窃盗が ②逃亡の障害となる者に反抗抑圧程度の暴行・脅迫を ③窃盗の機会に加えること。主観面：④238条の目的 ⑤故意 ⑥不法領得の意思。", "arts": ["刑238"], "a": true}, {"id": "H25-q04", "y": "H25", "src": ["H25-04"], "t": "mc", "q": "Aが財布とキャッシュカードを窃取した後、暗証番号を聞き出すため反抗抑圧程度の暴行を加え、暗証番号を聞き出した。成立する罪はどれか。", "e": "", "arts": ["刑236"], "c": ["2項強盗罪（236条2項）", "1項強盗罪（236条1項）", "事後強盗罪（238条）", "恐喝罪"]}, {"id": "H25-q05", "y": "H25", "src": ["H25-05"], "t": "ox", "q": "この事例でAが得た「財産上不法の利益」は、カードと暗証番号によってBの口座から容易に預金を引き出せる地位である。", "e": "", "arts": ["刑236"], "a": true}, {"id": "H25-q06", "y": "H25", "src": ["H25-06"], "t": "ox", "q": "事後強盗を被疑事実とする捜索差押許可状でA宅を捜索中に覚せい剤を発見した。この令状で覚せい剤を差し押さえることができる。", "e": "事後強盗罪と覚せい剤所持罪には被疑事実との関連性がない。", "arts": ["訴219"], "a": false}, {"id": "H25-q07", "y": "H25", "src": ["H25-07"], "t": "mc", "q": "前問の覚せい剤を押収する他の手段はどれか。", "e": "", "arts": ["訴221"], "c": ["保管者であるAの母親から任意提出を受けて領置する（221条）", "令状なしに差し押さえる（220条）", "遺留物として領置する", "押収する方法はない"]}, {"id": "H25-q08", "y": "H25", "src": ["H25-08"], "t": "ox", "q": "A宅のAの部屋で発見された覚せい剤は「遺留物」にあたる。", "e": "遺留物は占有離脱物や占有を放棄した物。覚せい剤はなおAの支配領域内にある。", "arts": ["訴221"], "a": false}, {"id": "H25-q09", "y": "H25", "src": ["H25-09"], "t": "ox", "q": "捜索中に発見した覚せい剤を、立会人であるAの母親の同意なく差し押さえた場合、違法収集証拠として証拠能力が問題になる。", "e": "", "arts": [], "a": true}, {"id": "H25-q10", "y": "H25", "src": ["H25-10"], "t": "mc", "q": "違法収集証拠の証拠能力が否定される判断基準はどれか（判例）。", "e": "最判昭53.9.7。", "arts": [], "c": ["令状主義の精神を没却する重大な違法があり、将来の違法捜査抑止の見地から排除が相当な場合", "手続に何らかの違法がある場合", "被告人が証拠とすることに同意しない場合", "供述の任意性に疑いがある場合"]}, {"id": "H25-q11", "y": "H25", "src": ["H25-11"], "t": "ox", "q": "本件では、適法な令状による捜索中に発見されたもので、覚せい剤所持の令状を得て差し押さえることもできた（手続の選択ミス）ので、違法の程度は高くなく、証拠能力を認めてよいと答えた。", "e": "覚せい剤事件では覚せい剤自体が不可欠な証拠でもある。", "arts": [], "a": true}, {"id": "H25-q12", "y": "H25", "src": ["H25-12"], "t": "mc", "q": "AがXに暴行して畏怖させ、金を渡すよう要求した。その後AはBに「5万円やるからXから金を取ってこい」と命じ、BはXから金銭の交付を受けた。A・Bの罪責はどれか。", "e": "", "arts": ["刑249", "刑60"], "c": ["A・Bに恐喝既遂罪の共同正犯", "Aに恐喝既遂罪、Bに恐喝罪の幇助犯", "Aに恐喝未遂罪、Bは無罪", "Aに恐喝既遂罪、Bに占有離脱物横領罪"]}, {"id": "H25-q13", "y": "H25", "src": ["H25-13"], "t": "ox", "q": "前問でBに恐喝罪の承継的共同正犯が成立するのは、Aが生じさせたXの畏怖状態を利用して金銭交付を受け、結果に因果性を与えたからである。", "e": "Aは共謀共同正犯として、一部実行全部責任によりBの受領分も帰責される。Bは5万円を得るので正犯性もある。", "arts": ["刑60"], "a": true}, {"id": "H25-q14", "y": "H25", "src": ["H25-14"], "t": "mc", "q": "Aは暴行でXに顔面打撲を負わせて畏怖させた。その後Aの指示を受けたBがXに暴行して右上腕骨折を負わせ、金銭の交付を受けた。Bに成立する罪はどれか。", "e": "Aには顔面打撲・右上腕骨折の傷害罪と恐喝既遂罪が成立する。", "arts": ["刑204", "刑249"], "c": ["右上腕骨折の傷害罪と恐喝既遂罪", "顔面打撲と右上腕骨折の傷害罪と恐喝既遂罪", "恐喝既遂罪のみ", "強盗致傷罪"]}, {"id": "H25-q15", "y": "H25", "src": ["H25-15", "H25-16"], "t": "ox", "q": "Bが顔面打撲について責任を負わないのは、傷害罪は結果発生時点で既遂に達しており、後から加担しても因果性を遡って及ぼせないからである。", "e": "恐喝罪は先行する畏怖状態が継続し、その後の交付で既遂になるので因果性を及ぼせる。", "arts": ["刑60"], "a": true}, {"id": "H25-q16", "y": "H25", "src": ["H25-17"], "t": "ox", "q": "A・Bが恐喝罪の共同被告人として起訴され、両名とも犯行を認めている。現に対立はないので、両名の弁護を何の手当もなく受任してよい。", "e": "後に利益相反が生じれば規程28条3号に抵触して辞任する可能性があるので、あらかじめ受任すべきでないと答えた。", "arts": ["職28"], "a": false}, {"id": "H25-q17", "y": "H25", "src": ["H25-18"], "t": "mc", "q": "前問で、両名の弁護を受任できるのはどのような場合か。", "e": "", "arts": ["職32", "職28"], "c": ["利害対立が生じれば辞任することなどを説明し（規程32条）、双方の同意を得た場合", "裁判所の許可を得た場合", "一方の同意を得た場合", "いかなる場合も受任できない"]}, {"id": "H25-q18", "y": "H25", "src": ["H25-19"], "t": "ox", "q": "審理の途中で両名が否認に転じ、互いに相手が犯人だと主張した。この場合も弁護を継続すべきである。", "e": "攻撃防御が矛盾し最善の弁護活動ができない（規程42条、46条）。", "arts": ["職42", "職46"], "a": false}, {"id": "H25-q19", "y": "H25", "src": ["H25-20"], "t": "ox", "q": "Aから「Cにアリバイがあるように証言してほしいと伝えてくれ」と頼まれた弁護人は、伝えてよい。", "e": "偽証のそそのかしにあたる（規程75条）。偽証罪の教唆犯にもなりうる。", "arts": ["職75"], "a": false}, {"id": "H25-q20", "y": "H25", "src": ["H25-21"], "t": "ox", "q": "Aが犯行を認めBが否認している。Bの供述を証拠とするには、Bの捜査段階の供述調書を証拠調べ請求する方法が考えられる。", "e": "", "arts": [], "a": true}, {"id": "H25-q21", "y": "H25", "src": ["H25-22"], "t": "mc", "q": "共同被告人Bを証人尋問したところ、Bが検察官面前調書と相反する供述をした。検察官は検面調書をどう使うか。", "e": "", "arts": ["訴321-1"], "c": ["321条1項2号後段の書面として証拠調べ請求する", "322条1項の書面として証拠調べ請求する", "321条1項3号の書面として証拠調べ請求する", "328条の弾劾証拠としてのみ使う"]}, {"id": "H25-q22", "y": "H25", "src": ["H25-23"], "t": "ox", "q": "共同被告人Bの検面調書に322条を使わないのは、322条が被告人本人の供述書面に関する規定だからである。", "e": "共同被告人は第三者。322条の不利益供述＋任意性という緩やかな要件で認めるべきではない。", "arts": ["訴322"], "a": true}, {"id": "H25-q23", "y": "H25", "src": ["H25-24"], "t": "mc", "q": "321条1項2号後段書面の要件はどれか。", "e": "", "arts": ["訴321-1"], "c": ["前の供述と相反するか実質的に異なる供述をしたこと＋相対的特信情況", "供述不能＋絶対的特信情況", "供述者の署名押印＋任意性", "被告人の同意"]}, {"id": "H25-q24", "y": "H25", "src": ["H25-25", "H25-26"], "t": "mc", "q": "相対的特信情況はどのように判断するか。", "e": "公判では相手方に見られ心理的圧迫がある。密室の検察官との会話なら冷静に供述できる。理路整然か否かも考慮する。", "arts": ["訴321-1"], "c": ["主に供述時の外部的付随事情（供述状況）から判断し、そのために供述内容も考慮しうる", "供述内容が真実かどうかだけで判断する", "検察官の判断に委ねる", "被告人の同意の有無で判断する"]}, {"id": "H25-q25", "y": "H25", "src": ["H25-27"], "t": "ox", "q": "検面調書は公判証言より前に作成され記憶が新鮮だったことも、相対的特信情況を基礎づける事情になる。", "e": "", "arts": [], "a": true}, {"id": "H26-q01", "y": "H26", "src": ["H26-01"], "t": "mc", "q": "XはAに印鑑と預金通帳を預け、預金を引き出す権限を与えていた。Aはこれを使って預金を引き出し、自分のものにした。Aの罪責はどれか。", "e": "", "arts": ["刑252"], "c": ["横領罪", "窃盗罪", "1項詐欺罪", "背任罪"]}, {"id": "H26-q02", "y": "H26", "src": ["H26-02"], "t": "ox", "q": "通帳と印鑑を預かっているだけでも、Aには預金について横領罪の「占有」が認められる。", "e": "横領罪の占有は濫用のおそれのある支配力をいい、事実上の占有だけでなく法律上の占有も含む。通帳と印鑑があれば払戻しを受けられるので、預金について法律上の占有がある。", "arts": ["刑252"], "a": true}, {"id": "H26-q03", "y": "H26", "src": ["H26-03", "H26-04"], "t": "mc", "q": "XはBに通帳と印鑑を盗まれ、Bがそれを使って銀行窓口で払戻しを受けた。銀行との関係でBに成立する罪と、Aの事例との違いの組合せはどれか。", "e": "", "arts": ["刑246"], "c": ["1項詐欺罪／正当な払戻し権限の有無", "横領罪／占有の有無", "窃盗罪／行員の錯誤の有無", "2項詐欺罪／財物か利益か"]}, {"id": "H26-q04", "y": "H26", "src": ["H26-05"], "t": "ox", "q": "預金の「占有」について、横領罪では法律上の占有が、詐欺罪では事実上の占有が問題になる。", "e": "", "arts": [], "a": true}, {"id": "H26-q05", "y": "H26", "src": ["H26-06"], "t": "mc", "q": "Cの口座に身に覚えのない振込みがあり、Cは気づいたのに窓口で何も告げずにその金を引き出した。Cの罪責はどれか。", "e": "", "arts": ["刑246"], "c": ["1項詐欺罪", "占有離脱物横領罪", "横領罪", "犯罪は成立しない"]}, {"id": "H26-q06", "y": "H26", "src": ["H26-07", "H26-08"], "t": "ox", "q": "誤振込みでも預金債権は有効に成立する（民事判例）ので、Cに預金の占有があり、銀行の占有は認められない。", "e": "Cにあるのは法律上の占有（横領罪の占有）。詐欺罪で問題になる事実上の占有はあくまで銀行にあるので、矛盾しない。", "arts": [], "a": false}, {"id": "H26-q07", "y": "H26", "src": ["H26-09"], "t": "mc", "q": "誤振込み事例でのCの「欺く行為」は何か。", "e": "継続的取引を行う者として誤振込みを告げる義務がある。作為義務とその違反、作為の可能性・容易性を検討する。", "arts": ["刑246"], "c": ["信義則上の告知義務に反して、誤振込みの事実を告げなかった不作為", "払戻請求書に虚偽の金額を書いたこと", "他人になりすましたこと", "欺く行為はない"]}, {"id": "H26-q08", "y": "H26", "src": ["H26-10"], "t": "ox", "q": "誤振込みの事実を告げずに払戻しを受けても、Cは民事上の払戻請求権を持つので、銀行には財産的損害がない。", "e": "銀行実務では誤振込みの指摘があれば事実確認し組戻しをする。告げずに引き出すと銀行は組戻しの機会を奪われるので、社会通念上別個の支払として財産的損害と評価できる。", "arts": [], "a": false}, {"id": "H26-q09", "y": "H26", "src": ["H26-11"], "t": "ox", "q": "Bの詐欺罪の捜索差押許可状（差し押さえるべき物：預金通帳、印鑑）でB宅を捜索中、本件と無関係の他人名義の通帳や印鑑が多数見つかった。この令状で差し押さえることができる。", "e": "被疑事実との関連性がない。", "arts": ["訴219"], "a": false}, {"id": "H26-q10", "y": "H26", "src": ["H26-12"], "t": "ox", "q": "捜索中、居合わせたBの友人Dが「その書類は自分の物だ」と言ってポケットに入れた。この令状で、その書類を捜索・差押えできる。", "e": "「必要な処分」として現場の原状回復が認められる（222条1項が準用する111条1項）。", "arts": ["訴111"], "a": true}, {"id": "H26-q11", "y": "H26", "src": ["H26-13"], "t": "mc", "q": "B宅に第三者Fが鍵をかけた金庫があった。この令状で金庫の中を捜索できるか。", "e": "Fが鍵を管理していれば、中身はB宅とは別のFの管理権に属する。", "arts": [], "c": ["鍵をBが管理していればできる。Fが管理していればできない", "Fの金庫なので常にできない", "B宅にある以上常にできる", "Fの同意があるときに限りできる"]}, {"id": "H26-q12", "y": "H26", "src": ["H26-14"], "t": "ox", "q": "Bの金庫で、Bが鍵の任意提出や協力を拒んだ場合、「必要な処分」として錠を開けることができる（鍵屋を呼ぶ、壊すなど）。", "e": "", "arts": ["訴111"], "a": true}, {"id": "H26-q13", "y": "H26", "src": ["H26-15", "H26-16", "H26-17"], "t": "mc", "q": "B宅の捜索差押許可状で、Bの車の中を捜索できる場合はどれか。", "e": "庭の車はB宅と同一の管理権に属する。他人名義の車は金庫と同じく鍵の管理が問題になる。公道上の車は同一管理権に属さない。", "arts": [], "c": ["Bの車がB宅の庭にある場合", "Bの車が公道上にある場合", "他人名義の車がB宅の庭にあり、その鍵を他人が管理している場合", "いずれの場合もできない"]}, {"id": "H26-q14", "y": "H26", "src": ["H26-18"], "t": "ox", "q": "起訴後の接見でBが「窃盗や詐欺をしたのは事実だが、無罪になる方法を教えてくれ」と言った。弁護人は無罪主張をすると答えた。", "e": "", "arts": [], "a": true}, {"id": "H26-q15", "y": "H26", "src": ["H26-19"], "t": "mc", "q": "Bは当初公判で有罪を認めていたが、審理が相当進んでから無罪主張を始めた。弁護人の対応として口述で答えた内容はどれか。", "e": "真実義務（規程5条）、守秘義務（23条）、最善弁護（46条）の抵触。立証責任は検察官にあり、弁護人は不当な証言・証拠を出さない限度の消極的真実義務を負うにすぎない。", "arts": ["職5", "職23", "職46"], "c": ["消極的真実義務にとどまるので、見通しを説明して説得を試みつつ、意思が固ければ検察官の証拠を弾劾して証明不十分の無罪を争う", "真実義務があるので、無罪主張はできないと告げて辞任する", "Bの犯行を裁判所に告げる", "Bの意思にかかわらず有罪を前提に情状弁護をする"]}, {"id": "H26-q16", "y": "H26", "src": ["H26-20"], "t": "ox", "q": "説得してもBが無罪主張を続ける場合、明らかに被告人の利益にならない例外を除き、その意思を尊重して証明不十分による無罪を主張する。", "e": "", "arts": ["職22"], "a": true}, {"id": "H26-q17", "y": "H26", "src": ["H26-21", "H26-22"], "t": "ox", "q": "Aが前方不注視で車を運転してVをはね、発覚を恐れて逃走し、Vが死亡した。Aには道路交通法上の救護義務があるので、保護責任者遺棄致死罪が成立する。", "e": "不作為犯には作為との構成要件的同価値性（作為義務、作為の可能性・容易性）が必要で、作為義務には排他的支配が要る。法令上の救護義務だけでは足りない。元のノートの設問は「Aは死亡」と表記。", "arts": ["刑219"], "a": false}, {"id": "H26-q18", "y": "H26", "src": ["H26-23"], "t": "mc", "q": "AがVをはねた後、死んでも仕方ないと考えてそのまま放置し、Vが死亡した。（作為義務を認めない前提で）放置について成立する罪はどれか。", "e": "作為義務を認めた場合は、保護責任者遺棄致死罪と殺人罪の区別（①死の認識・認容の有無 ②生命侵害の現実的・具体的危険のある状況で作為義務を怠ったか）が問題になる。", "arts": ["刑210"], "c": ["過失致死罪（不作為の故意犯は成立しない）", "殺人罪", "保護責任者遺棄致死罪", "犯罪は成立しない"]}, {"id": "H26-q19", "y": "H26", "src": ["H26-24"], "t": "mc", "q": "AがVをはねた後、Vを車輪に巻き込んだと認識しつつ、死んでも構わないと思って約1時間引きずって走行し、Vが死亡した。罪責はどれか。", "e": "引きずりは作為なので作為義務は問題にならない。意思の継続がなく別個の行為（熊撃ち事件参照）。", "arts": ["刑199"], "c": ["事故について過失運転致死罪、引きずり行為について殺人既遂罪（併合罪）", "過失運転致死罪のみ", "殺人既遂罪のみ", "保護責任者遺棄致死罪"]}, {"id": "H26-q20", "y": "H26", "src": ["H26-25", "H26-26"], "t": "ox", "q": "最初の事故と引きずり行為のどちらでVが死亡したか判然としない場合、過失運転致死罪と殺人未遂罪が成立する。", "e": "どちらかで死亡したことは証明されているので、軽い方の限度で死亡結果を帰責できる（択一的認定）。", "arts": ["刑203"], "a": true}, {"id": "H26-q21", "y": "H26", "src": ["H26-27"], "t": "mc", "q": "Aが過失運転致傷罪で逮捕され、実況見分でAが「Vを初めて認識した地点はここ」と述べたことが調書に記載された。弁護人が不同意とした場合、検察官はどうするか。", "e": "作成の真正＝作成名義がその警察官であること。内容の真正＝記載内容と実施過程が適正であること。", "arts": ["訴321-3"], "c": ["作成した警察官を証人尋問請求し、作成の真正・内容の真正を供述させる（321条3項）", "Aの署名押印を後から得る", "Aを証人として尋問する", "322条1項により証拠請求する"]}, {"id": "H26-q22", "y": "H26", "src": ["H26-28", "H26-29"], "t": "ox", "q": "実況見分調書が採用されれば、Aの指示説明部分を「Aがその地点で初めてVを認識した」ことの立証に使うことができる。", "e": "内容の真実性が問題になるので独立に伝聞。被告人の供述なので322条1項の署名押印が必要だが、それがない（元のノートは321条1項柱書と表記）。捜査段階でAの供述調書を作っておくべきだった。", "arts": ["訴322"], "a": false}, {"id": "H26-q23", "y": "H26", "src": ["H26-30"], "t": "ox", "q": "前方不注視の過失で起訴されたが、裁判所はスピード違反の過失の心証を得た。訴因変更をせずにスピード違反の過失を認定できる。", "e": "過失犯では①注意義務の発生根拠となる具体的事実 ②注意義務の内容 ③注意義務違反行為が審判対象を画定する。防御の観点からも訴因変更が必要。", "arts": ["訴312"], "a": false}, {"id": "H26-q24", "y": "H26", "src": ["H26-31"], "t": "ox", "q": "前方不注視かスピード違反のどちらかの過失があるという心証の場合、情状の軽い方の過失を認定することができる。", "e": "同一構成要件内なので罪刑法定主義に反しない。ただし利益原則の本来の使い方ではないとの批判もある。", "arts": [], "a": true}, {"id": "H26-q25", "y": "H26", "src": ["H26-32", "H26-33"], "t": "mc", "q": "過失運転致死罪で起訴した後、検察官はAがVを車に乗せた後に放置した保護責任者遺棄致死罪で問うべきだと考え直した。どうすべきか。", "e": "", "arts": ["訴312"], "c": ["訴因変更をする（同一客体の死は2回生じないので公訴事実の同一性がある）", "新たに別の公訴を提起する", "公訴を取り消して再起訴しなければならない", "変更はできない"]}, {"id": "H27-q01", "y": "H27", "src": ["H27-01", "H27-02", "H27-03"], "t": "ox", "q": "ホテルに泊まった甲が、チェックアウト時に所持金がないと気づき、支配人Aに「トイレに行ってくる」と言って逃走した。甲には2項詐欺罪が成立する。", "e": "犯罪は成立しない。窃盗は利益窃盗として不可罰。詐欺はAが「トイレに行く」ことを認めたにすぎず、債務免除などの処分行為がない。", "arts": ["刑246"], "a": false}, {"id": "H27-q02", "y": "H27", "src": ["H27-04"], "t": "ox", "q": "甲が逃走するつもりで、Aに「5キロほど離れた街に行って数時間後に戻り、その時に払う」と言って立ち去った。この場合は2項詐欺罪が成立する。", "e": "Aは戻らない可能性も含めて認識しつつ、支払の猶予を与えている（処分行為あり）。", "arts": ["刑246"], "a": true}, {"id": "H27-q03", "y": "H27", "src": ["H27-05", "H27-06", "H27-07"], "t": "mc", "q": "支払意思がないのにホテルで食事の提供を受け、宿泊した。成立する罪と罪数はどれか。", "e": "飲食物は財物、宿泊は財産上の利益。同一法益に対し近接した日時・場所で行われている。", "arts": ["刑246"], "c": ["飲食は1項詐欺罪、宿泊は2項詐欺罪で、包括一罪", "いずれも2項詐欺罪で併合罪", "いずれも1項詐欺罪で包括一罪", "飲食は1項詐欺罪、宿泊は2項詐欺罪で、併合罪"]}, {"id": "H27-q04", "y": "H27", "src": ["H27-08", "H27-09"], "t": "mc", "q": "支払わずに逃げる甲を支配人Aが追いかけて支払を求めたので、甲はAの右腕をナイフで切りつけて逃走した。成立する罪はどれか。", "e": "", "arts": ["刑240", "刑236"], "c": ["2項強盗による強盗致傷罪（240条前段）", "事後強盗罪", "1項強盗致傷罪", "傷害罪と2項詐欺罪"]}, {"id": "H27-q05", "y": "H27", "src": ["H27-10", "H27-11"], "t": "ox", "q": "2項強盗では、処罰範囲を限定するため利益移転の直接性・具体性が求められる。本件では、Aが甲の所在を突き止めて履行を求めるのは困難なので、それが認められる。", "e": "限定しないと、債務者が債権者を殺した場合などに無条件で強盗利得罪が成立しかねない。", "arts": ["刑236"], "a": true}, {"id": "H27-q06", "y": "H27", "src": ["H27-12"], "t": "mc", "q": "先の詐欺罪と2項強盗罪（強盗致傷罪）の罪数はどれか。", "e": "", "arts": [], "c": ["包括一罪", "併合罪", "観念的競合", "牽連犯"]}, {"id": "H27-q07", "y": "H27", "src": ["H27-13"], "t": "ox", "q": "午前10時半にAを負傷させた甲を、Aが午後5時ごろ駅で見つけて110番した。駆けつけた警察官は、甲の身体や着衣に血液が付着しているのを確認した。警察官は甲を逮捕できる。", "e": "", "arts": [], "a": true}, {"id": "H27-q08", "y": "H27", "src": ["H27-14", "H27-15"], "t": "mc", "q": "前問で、警察官がとるべき逮捕の種別はどれか。", "e": "準現行犯逮捕も考えられるが、6時間半経過しており「罪を行い終つてから間がない」とはいえない。Aは一度見失っており追跡の継続もない。", "arts": ["訴210", "訴212"], "c": ["緊急逮捕（210条1項）", "準現行犯逮捕（212条2項）", "現行犯逮捕（212条1項）", "通常逮捕（199条1項）"]}, {"id": "H27-q09", "y": "H27", "src": ["H27-16"], "t": "ox", "q": "警察官が緊急逮捕ではなく準現行犯逮捕をしてしまった。身柄送致を受けた検察官は、いったん釈放したうえで緊急逮捕すべきである。", "e": "", "arts": [], "a": true}, {"id": "H27-q10", "y": "H27", "src": ["H27-17"], "t": "mc", "q": "緊急逮捕の要件に含まれないものはどれか。", "e": "理由の告知、逮捕の必要性も必要。時間的接着性は準現行犯逮捕の要件。元のノートの「懲役又は禁錮」は拘禁刑の施行で「拘禁刑」に改められている。", "arts": ["訴210"], "c": ["被疑者が犯行後間がないと明らかに認められること", "死刑・無期又は長期3年以上の拘禁刑にあたる罪を犯したことを疑うに足りる充分な理由", "急速を要し、裁判官の逮捕状を求めることができないこと", "逮捕後直ちに逮捕状を請求すること"]}, {"id": "H27-q11", "y": "H27", "src": ["H27-18"], "t": "ox", "q": "6時間半後に被害者A自身が甲を見つけ、甲の身体や着衣に血液が付着していたことは、緊急逮捕の「充分な理由」を基礎づける。", "e": "記憶の減退が少なく、Aの供述と甲の状態が一致するので信用性が高い。", "arts": ["訴210"], "a": true}, {"id": "H27-q12", "y": "H27", "src": ["H27-19"], "t": "ox", "q": "違法な準現行犯逮捕の後に、同じ被疑事実で再逮捕（緊急逮捕）することは許されない。", "e": "許される（199条3項、規則142条1項8号参照）。手続の選択を誤ったにすぎず不当な蒸し返しではなく、罪の重さや逃走のおそれから再逮捕の必要性もある。", "arts": [], "a": false}, {"id": "H27-q13", "y": "H27", "src": ["H27-20"], "t": "mc", "q": "勾留・勾留延長された甲が釈放を望んでいる。弁護人がとる手段として答えたものはどれか。", "e": "", "arts": ["訴429", "訴87"], "c": ["勾留の取消請求と、勾留延長の裁判に対する準抗告（429条1項2号）", "控訴", "勾留理由開示請求のみ", "抗告（419条）のみ"]}, {"id": "H27-q14", "y": "H27", "src": ["H27-21"], "t": "mc", "q": "甲は「その時間は彼女の家にいた」と主張している。検察官手持ちのアリバイ証拠を主張関連証拠として開示請求する際、明らかにすべきでないものはどれか。", "e": "証明力判断に重要であることは類型証拠開示（316条の15）の要件。", "arts": ["訴316-20"], "c": ["その証拠が検察官請求証拠の証明力判断に重要であること", "アリバイの予定主張", "開示を求める証拠を識別するに足りる事項", "主張と証拠との関連性と、防御の準備に必要な理由"]}, {"id": "H27-q15", "y": "H27", "src": ["H27-22", "H27-23"], "t": "mc", "q": "B社の代引き集金担当Aが、パチンコ代に使う意図で、Cから受け取った代金5万円を自分の財布に入れ、パチンコに使った。成立する罪と、あわせて検討すべき罪の組合せはどれか。", "e": "", "arts": ["刑253"], "c": ["業務上横領罪が成立／1項詐欺罪を検討", "窃盗罪が成立／横領罪を検討", "1項詐欺罪が成立／業務上横領罪を検討", "背任罪が成立／横領罪を検討"]}, {"id": "H27-q16", "y": "H27", "src": ["H27-24"], "t": "ox", "q": "1項詐欺罪の構成要件は、欺く行為→錯誤→財産的処分行為→財物の占有移転と、その間の因果関係、そして故意と不法領得の意思である。", "e": "", "arts": ["刑246"], "a": true}, {"id": "H27-q17", "y": "H27", "src": ["H27-25", "H27-26"], "t": "ox", "q": "Aが自己費消の目的を隠して代金を受け取ったことは、Cに対する欺く行為にあたる。", "e": "欺く行為は財産的処分の判断の基礎となる重要な事実を偽ること。Aには集金権限があり、5万円を払えばCのB社への債務は消滅するので、Aの目的は重要な事実ではない。詐欺罪は不成立。", "arts": ["刑246"], "a": false}, {"id": "H27-q18", "y": "H27", "src": ["H27-27"], "t": "ox", "q": "横領とは不法領得の意思の発現たる一切の行為をいい、Aが集金した5万円をパチンコに使ったことは、所有者B社でなければできない処分にあたる。", "e": "", "arts": ["刑253"], "a": true}, {"id": "H27-q19", "y": "H27", "src": ["H27-28", "H27-29"], "t": "mc", "q": "検察官が横領行為を認定する時点として最も適切だと答えたのはどれか。", "e": "財布に入れた時点では、後で戻すつもりだったという反論があると不法領得の意思の発現が認められない可能性がある。", "arts": [], "c": ["パチンコで費消した時点", "財布に入れた時点", "集金に向かった時点", "B社に報告しなかった時点"]}, {"id": "H27-q20", "y": "H27", "src": ["H27-30"], "t": "ox", "q": "集金した金は直ちに集金袋に入れるルールがあるのに、Aが財布に入れる様子が防犯カメラに映っていた場合は、財布に入れた時点で横領を認めてもよい。", "e": "", "arts": [], "a": true}, {"id": "H27-q21", "y": "H27", "src": ["H27-31", "H27-32"], "t": "ox", "q": "Aが「パチンコで儲けて返すつもりだった」と反論すれば、横領罪は成立しない。", "e": "確実に補填できるなら格別、ギャンブルでは確実に補填できるとは限らない。", "arts": [], "a": false}, {"id": "H27-q22", "y": "H27", "src": ["H27-33"], "t": "ox", "q": "Aが、使い込んだCの代金をDから受け取った代金で補填していた場合、Cの代金については損害がないので横領罪は成立しない。", "e": "横領罪は個別財産に対する罪（背任罪は全体財産に対する罪）。", "arts": [], "a": false}, {"id": "H27-q23", "y": "H27", "src": ["H27-34"], "t": "ox", "q": "Dから受け取った代金でCの分を補填した行為にも、横領罪が成立する。", "e": "補填も所有者でなければできない処分であり、自己の費消の穴埋めのためにしている。", "arts": [], "a": true}, {"id": "H27-q24", "y": "H27", "src": ["H27-35", "H27-36"], "t": "ox", "q": "業務上横領罪の捜索差押許可状でAの元の自宅を捜索中、大麻が発見された。この令状で大麻を差し押さえることができる。", "e": "通常、業務上横領罪と大麻との間に被疑事実との関連性はない（222条1項本文、99条1項）。", "arts": ["訴219"], "a": false}, {"id": "H27-q25", "y": "H27", "src": ["H27-37", "H27-38"], "t": "mc", "q": "前問の大麻を押収する方法として適切でないものはどれか。", "e": "", "arts": ["訴221"], "c": ["Aの母が立会人なので、その承諾があれば令状なしに差し押さえる", "大麻所持罪で別途差押許可状の発付を受ける", "保管者であるAの母から任意提出を受けて領置する（221条）", "Aが占有を放棄したといえるなら遺留物として領置する"]}, {"id": "H27-q26", "y": "H27", "src": ["H27-39"], "t": "ox", "q": "差し押さえるべき物として記載されたCD-Rが発見された。内容を確認せずに差し押さえることは、例外なく許されない。", "e": "原則は確認が必要だが、証拠が存在する蓋然性があり、その場で確認していてはデータを消される危険がある場合は、確認せずに差し押さえられる。", "arts": [], "a": false}, {"id": "H27-q27", "y": "H27", "src": ["H27-40"], "t": "mc", "q": "CD-Rの中身を確認する方法として答えたものはどれか。", "e": "", "arts": ["訴111-2"], "c": ["処分を受ける者に必要な協力を求める（111条の2）", "Aの弁護人に開示させる", "裁判官に鑑定を嘱託する", "確認する方法はない"]}, {"id": "H27-q28", "y": "H27", "src": ["H27-41"], "t": "ox", "q": "Aが行方不明のまま国選弁護人が選任された場合、Aの弁解を聞けず、意思の尊重（規程22条）や最善の弁護（46条）が果たせない可能性があることが問題になる。", "e": "", "arts": ["職22", "職46"], "a": true}, {"id": "H27-q29", "y": "H27", "src": ["H27-42"], "t": "mc", "q": "Aに逮捕状が発付されていたが、捜査員が街中でAを見つけたとき逮捕状を持っていなかった。どうすべきか。", "e": "201条2項、73条3項。", "arts": ["訴201", "訴73"], "c": ["被疑事実の要旨と逮捕状が発せられている旨を告げて逮捕し、逮捕状はできる限り速やかに示す（緊急執行）", "緊急逮捕する", "逮捕状を取りに戻るまで任意同行を求める", "現行犯逮捕する"]}, {"id": "H27-q30", "y": "H27", "src": ["H27-43", "H27-44"], "t": "ox", "q": "逮捕後、最寄りの警察署に連行してからAの身体や着衣を捜索した。これは「逮捕の現場」での捜索とはいえず許されない。", "e": "被疑者の名誉や交通の支障、抵抗などでその場で行うのが不適当なら、捜索に適する最寄りの場所へ移動して行える（逮捕の現場と同視できる）。身体については場所によって証拠存在の蓋然性は変わらず、令状による場合との均衡もある。", "arts": ["訴220"], "a": false}, {"id": "H28-q01", "y": "H28", "src": ["H28-01"], "t": "ox", "q": "Aが実母Vの留守中にVの家に侵入し、V所有の宝石を盗んだ。Aには窃盗罪が成立しない。", "e": "窃盗罪は成立するが、親族相盗例（244条1項）により刑が免除される。", "arts": ["刑244"], "a": false}, {"id": "H28-q02", "y": "H28", "src": ["H28-02", "H28-03"], "t": "mc", "q": "親族相盗例（244条1項）の効果と趣旨について、判例の立場はどれか。", "e": "", "arts": ["刑244"], "c": ["犯罪は成立するが刑を免除する一身的処罰阻却事由。親族間の自律に委ねる政策的考慮（法は家庭に入らず）による", "違法性を阻却する。親族間では財産が共有されているから", "責任を阻却する。親族間では期待可能性がないから", "構成要件該当性がない。親族の物は「他人の財物」でないから"]}, {"id": "H28-q03", "y": "H28", "src": ["H28-04", "H28-05"], "t": "ox", "q": "Aが盗んだ宝石が、実母Vの占有するVの知人W所有の物だった場合も、親族相盗例が適用され、Aは処罰されない。", "e": "親族関係は所有者と占有者の双方との間に必要（判例）。窃盗罪の保護法益は占有と所有権の双方なので、所有者との親族関係がなければ家庭外の問題になる。", "arts": ["刑244"], "a": false}, {"id": "H28-q04", "y": "H28", "src": ["H28-06"], "t": "mc", "q": "AがVから盗んだ宝石を、事情を知るBが頼まれて2週間保管し、その後Aに無断でCに売却した。Bの罪責はどれか。", "e": "", "arts": ["刑256", "刑252"], "c": ["盗品等保管罪（256条2項）と委託物横領罪（252条）", "盗品等有償処分あっせん罪のみ", "委託物横領罪のみ", "盗品等保管罪と窃盗罪"]}, {"id": "H28-q05", "y": "H28", "src": ["H28-07"], "t": "ox", "q": "窃盗犯人Aとの委託信任関係は法的に保護されないので、Bに委託物横領罪は成立しない。", "e": "窃盗犯人の占有も窃盗罪で保護されることとの均衡から、窃盗犯人との委託信任関係も保護される。所有者はVなので「他人の物」、無断売却は不法領得の意思の発現。", "arts": ["刑252"], "a": false}, {"id": "H28-q06", "y": "H28", "src": ["H28-08"], "t": "mc", "q": "Bの盗品等保管罪と委託物横領罪の罪数はどれか。", "e": "保管罪は継続犯、横領罪は状態犯で線と点の関係。保管罪は追求権侵害、横領罪は委託信任関係も保護するので、一方だけでは評価し尽くせない。", "arts": [], "c": ["併合罪", "包括一罪", "観念的競合", "横領罪は不可罰的事後行為"]}, {"id": "H28-q07", "y": "H28", "src": ["H28-09"], "t": "mc", "q": "A（実行者）とB（共謀のみ）が窃盗罪で起訴され、公判前整理手続を経て併合審理される。冒頭手続の順序はどれか。", "e": "", "arts": [], "c": ["人定質問 → 起訴状朗読 → 権利告知 → 罪状認否", "起訴状朗読 → 人定質問 → 権利告知 → 罪状認否", "人定質問 → 権利告知 → 起訴状朗読 → 罪状認否", "権利告知 → 人定質問 → 罪状認否 → 起訴状朗読"]}, {"id": "H28-q08", "y": "H28", "src": ["H28-10", "H28-11"], "t": "ox", "q": "証拠調べ手続は検察官の冒頭陳述から始まる。被告人側の冒頭陳述は通常は任意的だが、公判前整理手続に付された事件では必要的である。", "e": "316条の30。", "arts": ["訴316-30"], "a": true}, {"id": "H28-q09", "y": "H28", "src": ["H28-12", "H28-13"], "t": "mc", "q": "Aは公訴事実を認め、Bは共謀を否認している。検察官が「AとBが話し合っていた」旨の記載を含む検面調書を請求した。Bの弁護人の対応はどれか。", "e": "争いのない部分は同意し、争点を明確にして立証を効率化する。", "arts": ["訴326"], "c": ["Aが窃盗したことの部分は同意し、共謀の部分は不同意とする（一部同意）", "全部同意する", "全部不同意とする", "証拠意見を留保する"]}, {"id": "H28-q10", "y": "H28", "src": ["H28-14"], "t": "ox", "q": "検面調書と相当程度重複する員面調書も請求された場合、裁判官が一方の取調べは不要と考えるのは、証拠の厳選（規則189条の2）の観点からである。", "e": "", "arts": ["規189-2"], "a": true}, {"id": "H28-q11", "y": "H28", "src": ["H28-15"], "t": "mc", "q": "検面調書（証拠書類）の取調べ方法はどれか。", "e": "", "arts": ["訴305"], "c": ["朗読（305条）又は要旨の告知（規則203条の2）", "展示（306条）", "証人尋問", "閲覧"]}, {"id": "H28-q12", "y": "H28", "src": ["H28-16", "H28-17"], "t": "ox", "q": "起訴されたA・Bがともに全面自白している。現時点で利益相反はないので、A・B双方の弁護を受任してよいと答えた。", "e": "後に利益が相反する可能性があり、規程28条3号に反し、最善弁護（46条）ができなくなるおそれがあるので受任しない。", "arts": ["職28", "職46"], "a": false}, {"id": "H28-q13", "y": "H28", "src": ["H28-18", "H28-19"], "t": "mc", "q": "A・B双方の弁護を受任した後、Bだけが否認を始めた。どうすべきか。", "e": "一方に有利な証拠が他方に不利になりうるなど、矛盾した弁護活動を迫られ最善弁護ができない。", "arts": ["職42", "職46"], "c": ["現実に利害対立が生じたので辞任する（規程42条）", "Aの弁護だけを続ける", "Bを説得して自白を維持させる", "そのまま双方の弁護を続ける"]}, {"id": "H28-q14", "y": "H28", "src": ["H28-20", "H28-21"], "t": "ox", "q": "第三者に譲渡する意思を隠して銀行で口座を開設し、通帳とキャッシュカードの交付を受けた行為は、銀行に対する1項詐欺罪にあたる。", "e": "銀行は他人への譲渡目的があれば口座開設に応じない。譲渡目的を秘して自己使用を装うのは、交付の判断の基礎となる重要な事実を偽る挙動による欺く行為。", "arts": ["刑246"], "a": true}, {"id": "H28-q15", "y": "H28", "src": ["H28-22"], "t": "ox", "q": "他人に譲渡する目的での口座開設で、銀行に財産的損害はないので詐欺罪は成立しない。", "e": "銀行は暴力団排除などの関係で他人名義口座の防止を求められており、社会的信用の低下による経済的損失が生じうる。", "arts": [], "a": false}, {"id": "H28-q16", "y": "H28", "src": ["H28-23", "H28-24"], "t": "ox", "q": "通帳やキャッシュカードは、単なる証明手段ではなく預金の出し入れという経済的機能を持つので、詐欺罪の「財物」にあたる（最決平26.4.7）。", "e": "元のノートの判例表示による。", "arts": ["刑246"], "a": true}, {"id": "H28-q17", "y": "H28", "src": ["H28-25", "H28-26"], "t": "mc", "q": "AがBにA名義のクレジットカードを渡し「50万円の範囲なら使ってよい」と告げた。Bは加盟店でカードを使い商品の交付を受けた。Bの罪責と客体の組合せはどれか。", "e": "", "arts": ["刑246"], "c": ["1項詐欺罪／購入した商品", "2項詐欺罪／代金債務の免脱", "窃盗罪／商品", "犯罪は成立しない／名義人の承諾がある"]}, {"id": "H28-q18", "y": "H28", "src": ["H28-27", "H28-28"], "t": "ox", "q": "名義人Aが承諾していれば、Bが名義人になりすましてカードを使っても、加盟店に対する欺く行為にはあたらない。", "e": "加盟店は名義人本人かを確認する義務があり、怠れば立替払いを受けられない可能性がある。利用者が本人かは重要な事実。規約上本人しか使えないので承諾は意味をなさない。", "arts": [], "a": false}, {"id": "H28-q19", "y": "H28", "src": ["H28-29", "H28-30"], "t": "ox", "q": "他人の暗証番号を盗撮する目的で、ATMのある銀行支店に入った。一般に公開された場所なので建造物侵入罪は成立しない。", "e": "侵入＝管理者の意思に反する立入り。目的・態様・場所の性質・管理者の態度から、管理者が立入りを拒むといえれば侵入にあたる（最決平19.7.2）。", "arts": ["刑130"], "a": false}, {"id": "H28-q20", "y": "H28", "src": ["H28-31"], "t": "ox", "q": "侵入を管理者の意思に反する立入りと解すると、万引き目的で店に入るだけでも建造物侵入罪が成立するが、起訴便宜主義（248条）による不起訴で処罰範囲を調整できる。", "e": "", "arts": ["訴248"], "a": true}, {"id": "H28-q21", "y": "H28", "src": ["H28-32"], "t": "ox", "q": "住居侵入罪で逮捕された被疑者を、全く別の機会の詐欺罪で勾留することはできない。", "e": "公訴事実の同一性がなければ別個の事件で、逮捕が前置されていない。", "arts": [], "a": true}, {"id": "H28-q22", "y": "H28", "src": ["H28-33"], "t": "mc", "q": "逮捕前置主義の趣旨と、前置の有無の判断単位の組合せはどれか。", "e": "", "arts": [], "c": ["二重の司法審査で不必要な身体拘束を避ける／事件（被疑事実）ごとに判断する（事件単位説）", "捜査の効率化／被疑者ごとに判断する（人単位説）", "起訴前の身体拘束期間を短くする／被疑者ごとに判断する", "裁判官の負担軽減／罪名ごとに判断する"]}, {"id": "H28-q23", "y": "H28", "src": ["H28-34"], "t": "mc", "q": "勾留の手続的要件に含まれないものはどれか。", "e": "", "arts": ["訴205"], "c": ["被疑者の自白", "適法な逮捕の前置", "時間制限の厳守（203条〜206条）", "検察官の勾留請求"]}, {"id": "H28-q24", "y": "H28", "src": ["H28-35", "H28-36"], "t": "mc", "q": "勾留質問（61条）の手続に含まれないものはどれか。", "e": "人定質問から始まる。", "arts": ["訴61"], "c": ["検察官の意見陳述", "被疑事実の要旨の告知", "黙秘権の告知と弁解の機会の付与", "弁護人選任権の告知と勾留通知先の聴取"]}, {"id": "H28-q25", "y": "H28", "src": ["H28-37"], "t": "ox", "q": "勾留質問で被疑事実の要旨を告げるのは、身体拘束の理由がわからなければ十分に防御権を行使できないからである。", "e": "", "arts": ["訴61"], "a": true}, {"id": "H28-q26", "y": "H28", "src": ["H28-38", "H28-39"], "t": "ox", "q": "住居侵入罪で逮捕・勾留中、もっぱら無関係の殺人罪の取調べが行われていた。この勾留は違法になりうるが、住居侵入と殺人が実体法上一罪の関係にあるなら適法な逮捕前置があるといえる。", "e": "本件である殺人について二重の司法審査を経ていない。", "arts": [], "a": true}, {"id": "H29-q01", "y": "H29", "src": ["H29-10", "H29-11"], "t": "ox", "q": "成人Bが自殺を望み、頼まれたAが毒薬を飲料に入れて渡し、Bはそれを飲んで死亡した。自殺は違法ではないので、Bには犯罪が成立しない。", "e": "Bに犯罪が成立しない点は正しいが、理由は「自殺は違法だが、自殺者本人には期待可能性がなく責任が阻却される」と答えた。", "arts": [], "a": false}, {"id": "H29-q02", "y": "H29", "src": ["H29-12"], "t": "mc", "q": "前問でAに成立する罪はどれか。", "e": "", "arts": ["刑202"], "c": ["自殺幇助罪（202条前段）", "同意殺人罪（202条後段）", "殺人罪（199条）", "犯罪は成立しない"]}, {"id": "H29-q03", "y": "H29", "src": ["H29-13"], "t": "ox", "q": "自殺者Bは罪に問われないのに関与したAが処罰されるのは、違法は連帯するが責任は個別に判断されるからである。", "e": "自殺が違法であることを前提に、個別に責任阻却する立場に立たないと詰められる。", "arts": [], "a": true}, {"id": "H29-q04", "y": "H29", "src": ["H29-14", "H29-15"], "t": "mc", "q": "3歳の娘が「お母さんと一緒に死ぬ」と言ったので、母Aが毒薬を飲ませて娘が死亡した。Aの罪責と理由の組合せはどれか。", "e": "", "arts": ["刑199", "刑202"], "c": ["殺人罪／3歳児には自殺の意味を理解する能力がなく同意が無効", "自殺幇助罪／娘の自殺の意思がある", "同意殺人罪／娘の同意がある", "保護責任者遺棄致死罪／母親として保護責任がある"]}, {"id": "H29-q05", "y": "H29", "src": ["H29-16", "H29-17"], "t": "ox", "q": "医師Aが恨みを抱く健康な患者Bに「余命3か月で、死ぬときは耐え難い苦痛がある。この薬を飲めば楽になる」と偽って毒薬を渡し、Bが飲んで死亡した。Aには自殺関与罪が成立する。", "e": "殺人罪。Bは自殺の判断の基礎となる重要な事実に錯誤があり、真意を知れば自殺しなかった。真意に沿わない重大な瑕疵ある意思なので同意は無効。", "arts": ["刑199"], "a": false}, {"id": "H29-q06", "y": "H29", "src": ["H29-18", "H29-19"], "t": "mc", "q": "「人生に疲れた」と言うBに対し、Bだけを死なせようと考えたAが「自分も追死する」と偽った。Bはこれを信じて自殺した。Aの罪責はどれか。", "e": "追死はBが死を決意した決定的事情で、虚偽と知れば自殺しなかった。", "arts": ["刑199"], "c": ["殺人罪（間接正犯）", "自殺教唆罪", "自殺幇助罪", "同意殺人罪"]}, {"id": "H29-q07", "y": "H29", "src": ["H29-20", "H29-21"], "t": "ox", "q": "偽装心中について、判例は「被害者は被告人の欺罔の結果、追死を予期して死を決意したもので、その決意は真意に沿わない重大な瑕疵ある意思」として殺人罪を認めた。", "e": "最判昭33.11.21。", "arts": [], "a": true}, {"id": "H29-q08", "y": "H29", "src": ["H29-22"], "t": "mc", "q": "冒頭手続はどの順序で進むか。", "e": "", "arts": [], "c": ["人定質問 → 起訴状朗読 → 権利告知 → 罪状認否", "起訴状朗読 → 権利告知 → 人定質問 → 罪状認否", "人定質問 → 罪状認否 → 起訴状朗読 → 権利告知", "権利告知 → 起訴状朗読 → 人定質問 → 罪状認否"]}, {"id": "H29-q09", "y": "H29", "src": ["H29-23"], "t": "ox", "q": "起訴状朗読では、人定事項を含め起訴状の記載をすべて読み上げなければならない。", "e": "人定事項はすでに明らかなので省略でき、公訴事実・罪名・罰条を読み上げる。", "arts": ["訴291"], "a": false}, {"id": "H29-q10", "y": "H29", "src": ["H29-24"], "t": "mc", "q": "起訴状を朗読する主な理由はどれか。", "e": "起訴状は裁判所に提出済み（256条1項）、被告人にも謄本が送達済み（271条1項）。", "arts": ["憲82"], "c": ["裁判の公開（憲法82条）と口頭主義から、傍聴人にも起訴状の内容を明らかにするため", "裁判所が起訴状の内容を初めて知るため", "被告人が起訴状の内容を初めて知るため", "検察官の訴追意思を確認するため"]}, {"id": "H29-q11", "y": "H29", "src": ["H29-25", "H29-26"], "t": "ox", "q": "被害者保護のため、公開の法廷で起訴状記載の被害者の氏名を明らかにしない決定ができる（刑訴法290条の2）。手続は、被害者等の申出→検察官が意見を付して裁判所に通知→裁判所が被告人・弁護人の意見を聴いて相当と認めれば決定、という流れである。", "e": "起訴状への記載自体を省くことはできない（この点に注意）。なお令和5年改正で、起訴状の抄本等の送達で被告人にも氏名等を秘匿する制度（271条の2以下）が新設されている。", "arts": ["訴290-2"], "a": true}, {"id": "H29-q12", "y": "H29", "src": ["H29-27"], "t": "ox", "q": "検察官は、自分では非公開の必要がないと考える場合、被害者等の申出を裁判所に通知しなくてよい。", "e": "通知は必要。必要がないという意見を付して通知する。", "arts": ["訴290-2"], "a": false}, {"id": "H29-q13", "y": "H29", "src": ["H29-28"], "t": "ox", "q": "被害者特定事項が被告人の防御に極めて重要な場合は、記載されたままの起訴状を被告人に示す方法によればよい。", "e": "", "arts": [], "a": true}, {"id": "H29-q14", "y": "H29", "src": ["H29-29", "H29-30"], "t": "mc", "q": "被告人の黙秘権の根拠条文はどれか。", "e": "", "arts": ["憲38", "訴311"], "c": ["憲法38条1項、刑訴法311条1項", "憲法31条、刑訴法198条2項", "憲法37条1項、刑訴法291条", "憲法38条2項、刑訴法319条1項"]}, {"id": "H29-q15", "y": "H29", "src": ["H29-31", "H29-32"], "t": "ox", "q": "証人にも黙秘権が保障されるので、証人は答えたくない事項について証言を拒むことができる。", "e": "証人に黙秘権はない。144条〜147条、149条の証言拒絶事由がある限度でのみ拒める。", "arts": [], "a": false}, {"id": "H29-q16", "y": "H29", "src": ["H29-33"], "t": "mc", "q": "証言拒絶事由として挙げられていないものはどれか。", "e": "ほかに公務員の職務上の秘密（144条）、議員（145条）。", "arts": ["訴146", "訴147", "訴149"], "c": ["自己の名誉を害するおそれがある場合", "自己が刑事訴追を受けるおそれがある場合（146条）", "配偶者や3親等内の血族が刑事訴追を受けるおそれがある場合（147条）", "弁護士などの業務上の秘密（149条）"]}, {"id": "H29-q17", "y": "H29", "src": ["H29-34", "H29-35"], "t": "ox", "q": "証言拒絶権は事由がある限度でしか認められないが、黙秘権は包括的なので範囲が広い。被告人には防御権を最大限行使させる必要があり、証人は供述を義務づけても不利益が乏しく真実発見の要請が強いからである。", "e": "", "arts": [], "a": true}, {"id": "H29-q18", "y": "H29", "src": ["H29-36", "H29-37"], "t": "mc", "q": "Aが包丁を突きつけ（反抗抑圧程度）Vのバッグを強取した。目撃者Wに追跡され、50m先で追いつかれたAは、逮捕を免れるためWを突き飛ばして負傷させた。強盗致傷罪の対象となる行為はどれか。", "e": "", "arts": ["刑240"], "c": ["Wを突き飛ばした行為", "Vに包丁を突きつけた行為", "バッグを強取した行為", "いずれにもならず、Wへの傷害罪が別に成立する"]}, {"id": "H29-q19", "y": "H29", "src": ["H29-38"], "t": "ox", "q": "240条の「強盗の機会」は、強盗の暴行・脅迫との時間的場所的近接性を踏まえ、犯意の継続性の有無で判断する。被害者には財物の占有者だけでなく追跡者も含まれる。", "e": "強盗の機会には致死傷結果が伴いやすいことが刑事学上顕著。事後強盗の「窃盗の機会」（被害者の支配領域を脱したか）とは判断が異なる。", "arts": ["刑240"], "a": true}, {"id": "H29-q20", "y": "H29", "src": ["H29-39", "H29-40"], "t": "ox", "q": "追いつかれたAがWの面前に包丁を突きつけ、畏怖したWが逃げる途中、10m先で石につまずいて転び負傷した。Wの転倒は自らの不注意なので、強盗致傷罪は成立しない。", "e": "追跡継続中の脅迫で強盗の機会にあたる。必死に逃げたのは脅迫で畏怖したからで、転倒は脅迫行為の危険の現実化。なお最初の財物奪取の手段としての暴行・脅迫から生じた場合は、機会性を論じる必要はない。", "arts": ["刑240"], "a": false}, {"id": "H29-q21", "y": "H29", "src": ["H29-41", "H29-42"], "t": "ox", "q": "前問で、Wが逃げようとして公道に飛び出し、車にひかれて負傷した場合も、強盗致傷罪が成立する。", "e": "強度の脅迫で冷静な判断ができず、公道に飛び出さざるを得ない心理状態に陥った（介在事情は異常でない）。結果はAの脅迫の危険の現実化。これは機会性ではなく因果関係の問題。", "arts": ["刑240"], "a": true}, {"id": "H29-q22", "y": "H29", "src": ["H29-43"], "t": "ox", "q": "Wが500m逃げたところで石につまずいて負傷した場合、Aはその場から動いていないので逃走は完了しており、因果関係は否定される。", "e": "Wは脅迫による驚愕・畏怖の心理状態が続いていたから逃げ続けた。脅迫に誘発された結果で、危険の現実化といえる。距離だけで機会性を否定する答えは誤り。", "arts": [], "a": false}, {"id": "H29-q23", "y": "H29", "src": ["H29-44", "H29-45"], "t": "mc", "q": "公道上の車上ねらい事件で、被害車両の直近にガラスを割るのに使ったと思われるバールが落ちていた。警察官がとるべき押収手続はどれか。", "e": "", "arts": ["訴221"], "c": ["遺留物として領置する（221条）", "令状により差し押さえる", "被害者Vから任意提出を受ける", "押収はできない"]}, {"id": "H29-q24", "y": "H29", "src": ["H29-46"], "t": "mc", "q": "バールが被害車両の直近に遺留されていたことを証明する証拠として挙げなかったものはどれか。", "e": "", "arts": [], "c": ["バールの販売店の売上記録", "被害者Vの供述（被害前はなかった、自分の物ではない）を録取した調書", "遺留状況の写真撮影", "バールのガラス付着箇所の写真撮影"]}, {"id": "H29-q25", "y": "H29", "src": ["H29-47"], "t": "ox", "q": "公道上の遺留状況の写真撮影は、実況見分（197条1項本文、犯罪捜査規範104条）として無令状でできる。", "e": "", "arts": ["訴197"], "a": true}, {"id": "H29-q26", "y": "H29", "src": ["H29-48", "H29-49"], "t": "ox", "q": "DNA鑑定の対照資料とするため、A宅近くの公道上のゴミ置場にAが出したゴミ袋を、警察官が無令状で持ち帰った。この行為は違法である。", "e": "適法。ゴミは不要物として占有が放棄された遺留物。他人に中を見られないという期待はあっても、捜査の必要があれば221条で領置できる（最決平20.4.15）。", "arts": ["訴221"], "a": false}, {"id": "H29-q27", "y": "H29", "src": ["H29-50"], "t": "mc", "q": "Aがマンション敷地内のゴミ置場に出したゴミ袋を押収したい。どうすべきか。", "e": "敷地内のゴミには管理者の占有がある。", "arts": ["訴221"], "c": ["保管者であるマンション管理者から任意提出を受けるか、捜索差押許可状を得て差し押さえる", "公道上と同じく遺留物として領置する", "Aの同意がなければ押収できない", "管理者の承諾を得れば令状なく差し押さえられる"]}, {"id": "H29-q28", "y": "H29", "src": ["H29-51", "H29-52", "H29-53"], "t": "ox", "q": "適法に押収したゴミ袋の中身を確認してDNA鑑定に使える物を探すには、別に令状が必要である。", "e": "無令状でできる。押収に伴う「必要な処分」（領置なら222条1項・111条2項準用、差押えなら同111条1項準用）。中身を確認しなければ証拠物か、占有を続ける必要があるか判断できない。", "arts": ["訴111"], "a": false}, {"id": "H29-q29", "y": "H29", "src": ["H29-54"], "t": "ox", "q": "逮捕・勾留されたAが同一の公訴事実で起訴された場合、検察官が勾留請求をしなくても被告人勾留に切り替わる。", "e": "検察官には被告人勾留の請求権限がない（208条の期間の定め、60条2項参照）。", "arts": ["訴60"], "a": true}, {"id": "H29-q30", "y": "H29", "src": ["H29-55", "H29-56"], "t": "mc", "q": "被告人勾留の期間はどれか。", "e": "", "arts": ["訴60"], "c": ["公訴提起の日から2か月。特に継続の必要があれば、理由を付した決定で1か月ごとに更新できる", "勾留請求の日から10日。やむを得ない事由があれば10日延長できる", "公訴提起の日から1か月。2か月ごとに更新できる", "期間の制限はない"]}, {"id": "H29-q31", "y": "H29", "src": ["H29-57", "H29-58"], "t": "mc", "q": "保釈の請求先について正しいものはどれか。", "e": "280条1項、規則187条1項。予断排除（起訴状一本主義、256条6項）のため。規則187条4項ただし書も参照。", "arts": ["訴280", "規187", "訴256-6"], "c": ["第1回公判期日前は受訴裁判所を構成する裁判官以外の裁判官、期日後は受訴裁判所", "常に受訴裁判所", "常に受訴裁判所を構成しない裁判官", "第1回公判期日前は検察官、期日後は裁判所"]}, {"id": "H29-q32", "y": "H29", "src": ["H29-59", "H29-60"], "t": "ox", "q": "接見禁止中のAに父親が電話で励ましたいと言うので、弁護人は接見の際に電話をつないでAと父親を直接話させた。これは許される。", "e": "接見禁止（81条）を実質的に無にする行為で、違法行為の助長（規程14条）にあたり、公正な職務（5条）ともいえない。", "arts": ["訴81", "職14", "職5"], "a": false}, {"id": "H30-q01", "y": "H30", "src": ["H30-01", "H30-02"], "t": "mc", "q": "Aが、夫Bが外出中に、Bが所有し生活の用に供している木造建物にガソリンをまいて火をつけ、全焼させた。成立する罪と条文はどれか。", "e": "Bが外出中でも、起臥寝食に使われている以上、現住性は失われない。", "arts": ["刑108"], "c": ["現住建造物等放火既遂罪（108条）", "他人所有非現住建造物等放火罪（109条1項）", "自己所有非現住建造物等放火罪（109条2項）", "建造物損壊罪（260条）"]}, {"id": "H30-q02", "y": "H30", "src": ["H30-03", "H30-04"], "t": "mc", "q": "Aが、B所有で生活に使われていない木造建造物を、Bの同意を得て全焼させた。成立する罪はどれか。", "e": "", "arts": ["刑109"], "c": ["自己所有非現住建造物等放火罪（109条2項）", "他人所有非現住建造物等放火罪（109条1項）", "現住建造物等放火罪（108条）", "犯罪は成立しない"]}, {"id": "H30-q03", "y": "H30", "src": ["H30-05"], "t": "ox", "q": "Bの同意があれば、B所有の建造物でも109条2項（自己所有）として扱えるのは、1項と2項の法定刑の差が他人の所有権侵害という財産的側面にあり、その法益侵害をBが放棄しているからである。", "e": "", "arts": ["刑109"], "a": true}, {"id": "H30-q04", "y": "H30", "src": ["H30-06"], "t": "ox", "q": "所有者Bが同意している以上、建造物への放火は不可罰になる。", "e": "放火罪は公共危険犯でもあり、Bの同意で放棄できるのは財産的側面だけ。公共の危険は放棄できない。", "arts": ["刑109"], "a": false}, {"id": "H30-q05", "y": "H30", "src": ["H30-07"], "t": "ox", "q": "所有権が放棄された（無主の）建造物を放火して全焼させた場合も、109条2項として扱ってよい。", "e": "所有権侵害という財産的側面の法益侵害がないので、自己所有と同じ扱いができる。", "arts": ["刑109"], "a": true}, {"id": "H30-q06", "y": "H30", "src": ["H30-08"], "t": "mc", "q": "Aがガソリンをまき、火のついた新聞紙を近づけたが、火はつかなかった。Aの罪責はどれか。", "e": "", "arts": ["刑112"], "c": ["現住建造物等放火未遂罪（108条・112条）", "現住建造物等放火予備罪（113条）", "現住建造物等放火既遂罪", "犯罪は成立しない"]}, {"id": "H30-q07", "y": "H30", "src": ["H30-09"], "t": "mc", "q": "放火罪の実行の着手時期はいつか。", "e": "", "arts": [], "c": ["目的物を焼損させる現実的危険性を生じさせた時点", "点火した時点", "目的物が独立に燃焼を始めた時点", "放火の準備を始めた時点"]}, {"id": "H30-q08", "y": "H30", "src": ["H30-10", "H30-11"], "t": "ox", "q": "ガソリンをまいただけで火をつけていなくても、放火罪の実行の着手が認められる。", "e": "ガソリンは揮発性・引火性が高い。", "arts": [], "a": true
